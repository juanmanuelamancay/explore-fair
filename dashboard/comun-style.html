<style>
	:root {
		--azul: #1a73e8; --azul-suave: #e8f0fe;
		--rojo: #d93025; --rojo-suave: #fce8e6; --amarillo: #f9ab00;
		--verde: #188038; --verde-suave: #e6f4ea;
		--fondo: #ffffff; --superficie: #f8fafd; --texto: #1f1f1f;
		--texto-2: #5f6368; --borde: #dadce0; --borde-suave: #e8eaed;
	}
	* { box-sizing: border-box; }
	[hidden] { display: none !important; }
	html { min-width: 320px; background: var(--fondo); }
	body { margin: 0; color: var(--texto); font: 400 16px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
	button, input, select { font: inherit; }
	button { color: inherit; }
	h1, h2, h3, p { margin: 0; }
	.franja { height: 4px; display: flex; }
	.franja i { flex: 1; }
	.franja i:nth-child(1) { background: #4285f4; }
	.franja i:nth-child(2) { background: #ea4335; }
	.franja i:nth-child(3) { background: #fbbc04; }
	.franja i:nth-child(4) { background: #34a853; }
	.tablero { width: min(100% - 48px, 1440px); margin: 0 auto; padding: 28px 0 48px; }
	.cabecera { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
	.cabecera h1 { font-size: 24px; font-weight: 500; line-height: 1.2; }
	.cabecera p { margin-top: 5px; color: var(--texto-2); font-size: 14px; }
	.refrescar { display: grid; place-items: center; width: 48px; height: 48px; flex: none; border: 1px solid var(--borde); border-radius: 50%; background: var(--fondo); color: var(--azul); cursor: pointer; }
	.refrescar:hover { background: var(--superficie); }
	.refrescar:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
	.refrescar:disabled { color: var(--texto-2); cursor: wait; }
	.refrescar.girando svg { animation: giro .8s linear infinite; }
	@keyframes giro { to { transform: rotate(360deg); } }
	.filtros { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(150px, 1fr) minmax(170px, 1fr) minmax(220px, 1.5fr); align-items: end; gap: 12px; padding: 16px; border: 1px solid var(--borde); border-radius: 20px; background: var(--superficie); }
	.campo { display: grid; min-width: 0; gap: 5px; }
	.campo label { color: var(--texto-2); font-size: 12px; font-weight: 500; }
	.campo input, .campo select { width: 100%; min-width: 0; height: 46px; padding: 0 12px; border: 1px solid var(--borde); border-radius: 12px; background: var(--fondo); color: var(--texto); font-size: 16px; }
	.btn { min-height: 46px; padding: 0 20px; border: 0; border-radius: 24px; background: var(--azul); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
	.btn:hover { background: #1765cc; }
	.btn:disabled { background: #e8eaed; color: #9aa0a6; cursor: wait; }
	.aviso { margin: 14px 0; padding: 12px 16px; border-radius: 16px; background: var(--rojo-suave); color: #8c1d18; }
	.seccion-titulo { margin: 26px 4px 10px; color: var(--texto-2); font-size: 14px; font-weight: 500; }
	.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
	.kpi { min-height: 112px; padding: 16px; border: 1px solid var(--borde); border-radius: 20px; background: var(--fondo); }
	.kpi span { display: block; color: var(--texto-2); font-size: 13px; }
	.kpi strong { display: block; margin-top: 8px; font-size: 28px; line-height: 1.1; font-weight: 500; font-variant-numeric: tabular-nums; }
	.kpi small { display: block; margin-top: 6px; color: var(--texto-2); font-size: 12px; }
	.cuadricula { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
	.tarjeta { min-width: 0; padding: 20px; border: 1px solid var(--borde); border-radius: 20px; background: var(--fondo); }
	.tarjeta h2 { font-size: 17px; line-height: 1.3; font-weight: 500; }
	.subtitulo { margin-top: 18px; font-size: 14px; font-weight: 500; }
	.nota { margin-top: 4px; color: var(--texto-2); font-size: 13px; }
	.col-7 { grid-column: span 7; }
	.col-5 { grid-column: span 5; }
	.col-6 { grid-column: span 6; }
	.col-12 { grid-column: span 12; }
	.grafico { position: relative; width: 100%; height: 290px; margin-top: 16px; }
	.grafico.compacto { height: 200px; }
	.grafico.alto { height: 330px; }
	.grafico-lista-caja { max-height: 70vh; margin-top: 16px; overflow-y: auto; border-radius: 12px; }
	.grafico-lista-wrap { position: relative; width: 100%; min-height: 280px; }
	.grafico-lista-wrap canvas { display: block; }
	.sin-datos { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; color: var(--texto-2); font-size: 14px; text-align: center; }
	.tabla-caja { max-height: 290px; margin-top: 12px; overflow: auto; border: 1px solid var(--borde-suave); border-radius: 12px; }
	table { width: 100%; border-collapse: collapse; font-size: 13px; }
	th, td { padding: 9px 10px; border-bottom: 1px solid var(--borde-suave); text-align: left; vertical-align: top; }
	th { position: sticky; top: 0; z-index: 1; background: var(--superficie); color: var(--texto-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
	tbody tr:last-child td { border-bottom: 0; }
	td.numero { font-variant-numeric: tabular-nums; white-space: nowrap; }
	.pregunta { min-width: 230px; max-width: 480px; }
	.barra-porcentaje { display: flex; align-items: center; gap: 8px; min-width: 120px; }
	.barra-porcentaje > span { width: 44px; flex: none; font-variant-numeric: tabular-nums; }
	.barra-porcentaje i { display: block; height: 7px; min-width: 2px; border-radius: 8px; background: var(--azul); }
	.tabla-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
	.tabla-doble h3 { margin-bottom: 8px; font-size: 14px; font-weight: 500; }
	.cargando { min-height: 200px; display: grid; place-items: center; color: var(--texto-2); }
	.bloque { border-radius: 12px; background: linear-gradient(90deg, #f1f3f4 25%, #e8eaed 37%, #f1f3f4 63%); background-size: 400% 100%; animation: brillo 1.4s ease infinite; }
	.esqueleto .esq-titulo { width: min(280px, 70vw); height: 30px; }
	.esqueleto .esq-linea { width: 40%; height: 14px; margin-top: 10px; }
	.esqueleto .esq-linea.corto { width: 25%; }
	.esqueleto .esq-circulo { width: 48px; height: 48px; border-radius: 50%; flex: none; }
	.esqueleto .esq-seccion { width: 180px; height: 14px; margin: 26px 4px 10px; }
	.esqueleto .esq-kpi { min-height: 112px; border-radius: 20px; }
	.esqueleto .esq-grafico { height: 300px; margin-top: 16px; }
	.esq-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
	@keyframes brillo { from { background-position: 100% 50%; } to { background-position: 0 50%; } }
	@media (max-width: 960px) {
		.tablero { width: min(100% - 32px, 760px); }
		.filtros { grid-template-columns: repeat(2, minmax(0, 1fr)); }
		.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
		.col-7, .col-5, .col-6 { grid-column: span 12; }
	}
	@media (max-width: 560px) {
		.tablero { width: min(100% - 24px, 480px); padding: 22px 0 32px; }
		.cabecera { align-items: flex-start; gap: 8px; }
		.cabecera h1 { font-size: 22px; }
		.refrescar { width: 44px; height: 44px; margin: -4px -4px 0 0; }
		.filtros { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; border-radius: 16px; }
		.campo:nth-child(3), .campo:nth-child(4) { grid-column: span 2; }
		.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
		.kpi { min-height: 104px; padding: 13px; border-radius: 16px; }
		.kpi strong { font-size: 24px; }
		.tarjeta { padding: 16px 14px; border-radius: 18px; }
		.grafico { height: 260px; }
		.grafico.compacto { height: 210px; }
		.grafico.alto { height: 300px; }
		.grafico-lista-caja { max-height: 65vh; }
		.tabla-doble { grid-template-columns: 1fr; gap: 18px; }
		.seccion-titulo { margin-top: 22px; }
		.pregunta { min-width: 150px; }
		.barra-porcentaje { min-width: 96px; }
		.tabla-caja { max-height: 260px; }
		table { font-size: 12px; }
		th, td { padding: 8px; }
	}
	@media (max-width: 380px) {
		.kpis { grid-template-columns: 1fr; }
	}
	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
	}
</style>
