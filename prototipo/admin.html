<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Explore Fair · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #1a73e8;
    --azul-suave: #e8f0fe;
    --rojo: #d93025;
    --rojo-suave: #fce8e6;
    --verde: #188038;
    --verde-suave: #e6f4ea;
    --fondo: #ffffff;
    --superficie: #f8fafd;
    --texto: #1f1f1f;
    --texto-2: #5f6368;
    --borde: #dadce0;
    --borde-suave: #e8eaed;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font: 400 16px/1.45 "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  b, h1, h2, h3 { font-weight: 500; }

  .franja { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 6; display: flex; }
  .franja i { flex: 1; }

  #app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: 20px 16px calc(72px + 24px + env(safe-area-inset-bottom)); }

  /* ---------- Ranking ---------- */
  .rank-titulo { font-size: 24px; font-weight: 400; margin: 0 0 20px; }
  .podio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: end; margin-bottom: 20px; }
  .lugar { text-align: center; min-width: 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--superficie); border: 1px solid var(--borde-suave); font-weight: 500; font-size: 14px; color: var(--texto-2);
  }
  .lugar .avatar { margin: 0 auto 6px; width: 48px; height: 48px; }
  .l1 .avatar { width: 60px; height: 60px; font-size: 18px; background: #fef7e0; border-color: #f9ab00; color: #b06000; }
  .lugar .nombre { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lugar .pts { font-size: 13px; color: var(--texto-2); }
  .lugar .base { margin-top: 8px; border-radius: 12px 12px 0 0; background: var(--superficie); font-size: 20px; font-weight: 500; display: grid; place-items: center; color: var(--texto-2); }
  .l1 .base { height: 72px; background: #fef7e0; color: #b06000; }
  .l2 .base { height: 52px; }
  .l3 .base { height: 40px; }
  .fila .pos { width: 24px; text-align: center; font-weight: 500; color: var(--texto-2); flex: none; }
  .fila .total { font-weight: 500; }
  .vacio { border: 1px solid var(--borde); border-radius: 24px; padding: 40px 20px; text-align: center; }
  .vacio .icono { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; background: #f1f3f4; color: var(--texto-2); }
  .vacio h2 { font-size: 20px; font-weight: 400; }
  .vacio p { margin-top: 6px; font-size: 14px; color: var(--texto-2); }
  .aviso { font-size: 13px; color: var(--texto-2); margin-top: 14px; text-align: center; }

  /* ---------- Navegación inferior ---------- */
  #nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--superficie); border-top: 1px solid var(--borde-suave);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #nav .dentro { max-width: 480px; margin: 0 auto; display: flex; height: 72px; }
  #nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--texto-2); }
  #nav .pastilla { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background .15s; }
  #nav button.activa { color: var(--texto); }
  #nav button.activa .pastilla { background: #d3e3fd; color: #0b57d0; }

  .sec { color: var(--texto-2); }
  .chico { font-size: 13px; }
  .tnum { font-variant-numeric: tabular-nums; }

  .cab h1 { font-size: 22px; line-height: 1.2; }

  .guia { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 16px; border-radius: 16px; background: var(--azul-suave); }
  .guia .icono { width: 36px; height: 36px; border-radius: 50%; background: var(--fondo); color: var(--azul); display: grid; place-items: center; flex: none; }
  .guia b { display: block; font-size: 15px; }
  .guia span { font-size: 14px; color: #3c4043; }
  .guia.ok { background: var(--verde-suave); }
  .guia.ok .icono { color: var(--verde); }

  .titulo-seccion { font-size: 14px; font-weight: 500; color: var(--texto-2); margin: 28px 4px 8px; }

  .lista { border: 1px solid var(--borde); border-radius: 20px; overflow: hidden; }
  .fila { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; border-bottom: 1px solid var(--borde-suave); }
  .fila:last-child { border-bottom: 0; }
  .fila .icono { width: 40px; height: 40px; border-radius: 50%; background: var(--superficie); color: var(--texto-2); display: grid; place-items: center; flex: none; }
  .fila .que { flex: 1; min-width: 0; }
  .fila .que b { display: block; font-size: 15px; }
  .fila .que span { font-size: 13px; color: var(--texto-2); }
  .fila .cuanto { font-weight: 500; font-size: 18px; flex: none; }
  .fila .cuanto.cero { color: #9aa0a6; }

  /* ---------- Tarjeta de reinicio ---------- */
  .tarjeta { border: 1px solid var(--borde); border-radius: 24px; padding: 20px; }
  .tarjeta h2 { font-size: 20px; font-weight: 400; }
  .tarjeta > p { margin-top: 6px; font-size: 14px; color: var(--texto-2); }
  .grupo { margin-top: 18px; }
  .grupo h3 { font-size: 13px; color: var(--texto-2); margin-bottom: 6px; }
  .grupo li { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; font-size: 15px; }
  .grupo li svg { flex: none; margin-top: 2px; }
  .grupo li span { color: var(--texto-2); font-size: 13px; display: block; }

  .btn {
    display: block; width: 100%; min-height: 52px; border-radius: 26px;
    background: var(--azul); color: #fff; font-weight: 500; font-size: 15px; margin-top: 18px;
  }
  .btn.peligro-borde { background: transparent; color: var(--rojo); border: 1px solid var(--borde); }
  .btn.peligro-borde:active { background: var(--rojo-suave); }
  .btn.peligro { background: var(--rojo); }
  .btn.peligro:active { background: #b3261e; }
  .btn.texto { background: transparent; color: var(--azul); margin-top: 4px; }
  .btn:disabled { background: #e8eaed; color: #9aa0a6; border: 0; cursor: default; }

  .ultimo { font-size: 13px; color: var(--texto-2); text-align: center; margin-top: 14px; }
  .demo-link { display: block; margin: 16px auto 0; padding: 12px; font-size: 13px; color: var(--texto-2); text-decoration: underline; }

  /* ---------- Hoja de confirmación ---------- */
  #velo { position: fixed; inset: 0; z-index: 7; background: rgba(32,33,36,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #hoja {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-width: 480px; margin: 0 auto;
    background: var(--fondo); border-radius: 28px 28px 0 0;
    padding: 8px 24px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s cubic-bezier(.2,0,0,1);
    max-height: 92vh; overflow-y: auto;
  }
  body.hoja-abierta #velo { opacity: 1; pointer-events: auto; }
  body.hoja-abierta #hoja { transform: none; }
  .asa { width: 32px; height: 4px; border-radius: 2px; background: var(--borde); margin: 8px auto 20px; }
  #hoja h2 { font-size: 22px; font-weight: 400; }
  #hoja p { margin-top: 10px; color: var(--texto-2); font-size: 15px; }
  .resumen { margin-top: 14px; padding: 12px 16px; border-radius: 16px; background: var(--rojo-suave); color: #8c1d18; font-size: 14px; }
  .resumen li { padding: 2px 0; }
  label.campo { display: block; font-size: 14px; font-weight: 500; margin: 20px 0 8px; }
  #confirmar {
    width: 100%; height: 56px; border-radius: 12px; border: 1px solid #80868b; background: var(--fondo);
    padding: 0 16px; outline: none; text-transform: uppercase;
    font: 500 18px/1 "Roboto Mono", ui-monospace, Consolas, monospace; letter-spacing: .1em;
  }
  #confirmar:focus { border: 2px solid var(--rojo); padding: 0 15px; }

  .giro { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; display: inline-block; vertical-align: -3px; margin-right: 8px; animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="franja" aria-hidden="true"><i style="background:#4285f4"></i><i style="background:#ea4335"></i><i style="background:#fbbc04"></i><i style="background:#34a853"></i></div>

<main id="app"></main>

<nav id="nav" aria-label="Navegación principal">
  <div class="dentro">
    <button data-ir="panel">
      <span class="pastilla"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/></svg></span>
      Panel
    </button>
    <button data-ir="ranking">
      <span class="pastilla"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3"/></svg></span>
      Ranking
    </button>
  </div>
</nav>

<div id="velo" data-cerrar></div>
<section id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo"></section>

<script>
/* =====================================================================
   PROTOTIPO DE UX/UI DEL PANEL ADMIN. Datos de ejemplo en memoria.
   Vistas: PANEL_ADMIN (por ahora solo reinicia los datos de la feria) y RANKING.
   En la versión real, cada bloque marcado con "SERVIDOR" se reemplaza por
   una llamada a google.script.run.
   ===================================================================== */

const PALABRA = 'REINICIAR';
const ADMIN = { nombre: 'Marta Salinas' };
const CONTEO_DEMO = { Intentos: 412, Codigos: 37, Usuarios: 148 };

// Hojas que la app escribe durante la feria: las tres se borran al reiniciar. Las de catálogo nunca se tocan.
const HOJAS = [
  { hoja: 'Intentos', nombre: 'Intentos', detalle: 'Quizzes respondidos y sus puntajes', icono: 'M9 11l3 3 8-8M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9' },
  { hoja: 'Codigos',  nombre: 'Códigos',  detalle: 'Códigos generados por los líderes', icono: 'M15.5 3a5.5 5.5 0 11-5.2 7.3L3 17.6V21h3.4v-2.4h2.4v-2.4h2.3l1.2-1.2A5.5 5.5 0 0115.5 3zM17 7h.01' },
  { hoja: 'Usuarios', nombre: 'Usuarios', detalle: 'Personas que ingresaron a la app', icono: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0' },
];

const RANKING_DEMO = [
  ['Lucía Paredes', 310, 8], ['Diego Salas', 290, 7], ['Mariana Ríos', 270, 7], ['Jorge Medina', 240, 6],
  ['Camila Vega', 220, 6], ['Renzo Aguilar', 200, 5], ['Valeria Soto', 190, 5], ['Bruno Castillo', 170, 5],
  ['Ana Torres', 160, 4], ['Paola Núñez', 150, 4], ['Hugo Campos', 140, 4], ['Sofía León', 120, 3],
  ['Martín Rojas', 110, 3], ['Elena Chávez', 100, 3], ['Tomás Ibáñez', 90, 2], ['Rocío Lazo', 80, 2],
].map(([nombre, puntos, stands]) => ({ nombre, puntos, stands }));

const estado = { vista: 'panel', conteo: { ...CONTEO_DEMO }, ultimo: null, recienReiniciado: null };

const app = document.getElementById('app');
const hoja = document.getElementById('hoja');
const svg = (d, tam = 22, color = 'currentColor', grosor = 2) =>
  `<svg width="${tam}" height="${tam}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${grosor}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const I = {
  check: 'M5 12.5l4.5 4.5L19 7.5',
  equis: 'M6 6l12 12M18 6L6 18',
  escudo: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z',
};
const filas = n => `${n} ${n === 1 ? 'fila' : 'filas'}`;
const hayDatos = () => HOJAS.some(h => estado.conteo[h.hoja] > 0);

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('activa', b.dataset.ir === estado.vista));
  estado.vista === 'panel' ? vistaPanel() : vistaRanking();
}

/* ---------- Vista: ranking ---------- */
function vistaRanking() {
  // El ranking sale de Intentos: tras un reinicio queda vacío.
  const r = estado.conteo.Intentos ? RANKING_DEMO : [];
  if (!r.length) {
    app.innerHTML = `
      <h1 class="rank-titulo">Ranking</h1>
      <div class="vacio">
        <div class="icono">${svg('M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3', 32)}</div>
        <h2>Aún no hay puntajes</h2>
        <p>El ranking se llena cuando los usuarios responden su primer quiz.</p>
      </div>`;
    return;
  }
  const iniciales = n => n.split(' ').map(x => x[0]).slice(0, 2).join('');
  const lugar = (n, clase) => `
    <div class="lugar ${clase}">
      <div class="avatar">${iniciales(r[n].nombre)}</div>
      <div class="nombre">${r[n].nombre}</div>
      <div class="pts tnum">${r[n].puntos} pts</div>
      <div class="base">${n + 1}</div>
    </div>`;
  app.innerHTML = `
    <h1 class="rank-titulo">Ranking</h1>
    <div class="podio">${lugar(1, 'l2')}${lugar(0, 'l1')}${lugar(2, 'l3')}</div>
    <ul class="lista">
      ${r.map((p, i) => `
        <li class="fila">
          <span class="pos tnum">${i + 1}</span>
          <span class="avatar">${iniciales(p.nombre)}</span>
          <span class="que"><b>${p.nombre}</b><span>${p.stands} ${p.stands === 1 ? 'stand' : 'stands'}</span></span>
          <span class="total tnum">${p.puntos}</span>
        </li>`).slice(3).join('')}
    </ul>
    <p class="aviso">En empate, va primero quien llegó antes a ese puntaje.</p>`;
}

/* ---------- Vista: panel ---------- */
function vistaPanel() {
  const r = estado.recienReiniciado;
  app.innerHTML = `
    <header class="cab">
      <p class="sec chico">Explore Fair · Admin</p>
      <h1>Hola, ${ADMIN.nombre.split(' ')[0]}</h1>
    </header>

    ${r ? `
      <div class="guia ok" role="status">
        <span class="icono">${svg(I.check, 20, 'currentColor', 2.5)}</span>
        <p><b>Datos reiniciados</b><span>${r.resumen}. Copia guardada como ${r.respaldo}.</span></p>
      </div>` : `
      <div class="guia">
        <span class="icono">${svg(I.escudo, 20)}</span>
        <p><b>Panel de administración</b><span>Por ahora solo permite reiniciar los datos de la feria.</span></p>
      </div>`}

    <h2 class="titulo-seccion">Datos generados durante la feria</h2>
    <ul class="lista">
      ${HOJAS.map(h => `
        <li class="fila">
          <span class="icono">${svg(h.icono)}</span>
          <span class="que"><b>${h.nombre}</b><span>${h.detalle}</span></span>
          <span class="cuanto tnum ${estado.conteo[h.hoja] ? '' : 'cero'}">${estado.conteo[h.hoja]}</span>
        </li>`).join('')}
    </ul>

    <h2 class="titulo-seccion">Reinicio</h2>
    <section class="tarjeta">
      <h2>Reiniciar la feria</h2>
      <p>Deja la app como al inicio: sin usuarios, sin puntajes y sin códigos. Úsalo después de las pruebas y antes de abrir la feria.</p>

      <div class="grupo">
        <h3>Se borra</h3>
        <ul>
          <li>${svg(I.equis, 18, '#d93025', 2.5)}<div>Intentos<span>Todos los puntajes y el ranking vuelven a cero</span></div></li>
          <li>${svg(I.equis, 18, '#d93025', 2.5)}<div>Códigos<span>Los códigos activos dejan de funcionar</span></div></li>
          <li>${svg(I.equis, 18, '#d93025', 2.5)}<div>Usuarios<span>Se registran de nuevo, solos, al volver a entrar</span></div></li>
        </ul>
      </div>
      <div class="grupo">
        <h3>Se conserva</h3>
        <ul>
          <li>${svg(I.check, 18, '#188038', 2.5)}<div>Pabellones, stands y preguntas</div></li>
          <li>${svg(I.check, 18, '#188038', 2.5)}<div>Líderes, admins, permisos y configuración</div></li>
        </ul>
      </div>

      <button class="btn peligro-borde" id="abrir" ${hayDatos() ? '' : 'disabled'}>${hayDatos() ? 'Reiniciar datos' : 'No hay datos que borrar'}</button>
      <p class="ultimo">${estado.ultimo ? `Último reinicio: hoy a las ${estado.ultimo} por ti` : 'Aún no se ha hecho ningún reinicio'}</p>
    </section>

    ${r ? `<button class="demo-link" id="restaurar">Prototipo: restaurar datos de ejemplo</button>` : ''}
  `;

  document.getElementById('abrir').onclick = abrirConfirmacion;
  const restaurar = document.getElementById('restaurar');
  if (restaurar) restaurar.onclick = () => { estado.conteo = { ...CONTEO_DEMO }; estado.recienReiniciado = null; render(); };
}

function abrirConfirmacion() {
  hoja.innerHTML = `
    <div class="asa"></div>
    <h2 id="hoja-titulo">¿Reiniciar los datos de la feria?</h2>
    <p>Esta acción afecta a todos los usuarios y no se puede deshacer desde la app.</p>
    <ul class="resumen">
      ${HOJAS.map(h => `<li>Se borran <b>${filas(estado.conteo[h.hoja])}</b> de ${h.nombre.toLowerCase()}</li>`).join('')}
    </ul>
    <p class="chico">Antes de borrar se guarda una copia de estas hojas en el mismo archivo.</p>
    <label class="campo" for="confirmar">Escribe ${PALABRA} para confirmar</label>
    <input id="confirmar" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    <button class="btn peligro" id="ejecutar" disabled>Reiniciar datos</button>
    <button class="btn texto" data-cerrar>Cancelar</button>`;
  document.body.classList.add('hoja-abierta');

  const campo = document.getElementById('confirmar');
  const boton = document.getElementById('ejecutar');
  campo.oninput = () => { boton.disabled = campo.value.trim().toUpperCase() !== PALABRA; };
  campo.onkeydown = e => { if (e.key === 'Enter' && !boton.disabled) boton.click(); };
  boton.onclick = () => {
    boton.disabled = true;
    campo.disabled = true;
    boton.innerHTML = '<i class="giro"></i>Reiniciando…';
    // SERVIDOR: comprueba rol ADMIN, toma el bloqueo, copia las hojas a un respaldo,
    // borra sus filas (no los encabezados) y limpia la caché del ranking.
    setTimeout(reiniciar, 1400);
  };
  setTimeout(() => campo.focus(), 250);
}
function cerrarHoja() { document.body.classList.remove('hoja-abierta'); }

function reiniciar() {
  const ahora = new Date();
  const hhmm = ahora.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  const borradas = HOJAS.filter(h => estado.conteo[h.hoja] > 0);
  estado.recienReiniciado = {
    resumen: 'Se borraron ' + borradas.map(h => `${estado.conteo[h.hoja]} ${h.nombre.toLowerCase()}`).join(', ').replace(/, ([^,]*)$/, ' y $1'),
    respaldo: `respaldo_${ahora.toLocaleDateString('sv')}_${hhmm.replace(':', '')}`,
  };
  borradas.forEach(h => { estado.conteo[h.hoja] = 0; });
  estado.ultimo = hhmm;
  cerrarHoja();
  render();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-cerrar]')) return cerrarHoja();
  const destino = e.target.closest('[data-ir]');
  if (destino) { estado.vista = destino.dataset.ir; render(); window.scrollTo(0, 0); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });

render();
</script>
</body>
</html>
