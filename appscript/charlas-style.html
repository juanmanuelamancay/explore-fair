<style>
  /* Ruta de charlas: una columna con una línea que une las paradas. */
  .ch-ruta { margin-top: 8px; }
  .ch-dia { margin: 24px 4px 10px; font-size: 14px; font-weight: 500; color: var(--texto-2); }
  .ch-parada { position: relative; display: flex; gap: 14px; padding-bottom: 14px; }
  .ch-parada:last-child { padding-bottom: 0; }
  /* La línea baja desde el nodo hasta la parada siguiente. */
  .ch-parada::before { content: ''; position: absolute; left: 21px; top: 44px; bottom: -2px; width: 2px; background: var(--borde-suave); }
  .ch-parada.ultima::before { display: none; }
  .ch-nodo { position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--superficie); color: var(--texto-2); border: 2px solid var(--borde); }
  .ch-parada.abierta .ch-nodo { background: var(--azul-suave); color: var(--azul); border-color: var(--azul); }
  .ch-parada.hecha .ch-nodo { background: var(--verde); color: #fff; border-color: var(--verde); }
  .ch-parada.vencida .ch-nodo { background: #f1f3f4; color: #9aa0a6; border-color: var(--borde); }
  .ch-parada.hecha::before { background: var(--verde); }
  .ch-parada.en-vivo .ch-nodo { animation: ch-pulso 1.8s ease-out infinite; }
  @keyframes ch-pulso { 0% { box-shadow: 0 0 0 0 rgba(26, 115, 232, .45); } 100% { box-shadow: 0 0 0 14px rgba(26, 115, 232, 0); } }

  .ch-tarjeta { flex: 1; min-width: 0; border: 1px solid var(--borde); border-radius: 16px; padding: 14px 16px; background: var(--fondo); }
  .ch-parada.proxima .ch-tarjeta { background: var(--superficie); }
  .ch-hora { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-2); }
  .ch-etiqueta { font-size: 12px; font-weight: 500; border-radius: 8px; padding: 2px 8px; background: var(--azul-suave); color: var(--azul); }
  .ch-etiqueta.verde { background: var(--verde-suave); color: var(--verde); }
  .ch-etiqueta.gris { background: #f1f3f4; color: var(--texto-2); }
  .ch-tarjeta h2 { font-size: 17px; line-height: 1.3; margin-top: 6px; }
  .ch-ponente { font-size: 14px; color: var(--texto-2); margin-top: 2px; }
  .ch-desc { font-size: 14px; color: #3c4043; margin-top: 8px; }
  .ch-datos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ch-tarjeta .btn { margin-top: 12px; }
  .ch-nota { font-size: 13px; color: var(--texto-2); margin-top: 10px; }
  .ch-vacio { text-align: center; color: var(--texto-2); padding: 40px 16px; }
</style>
