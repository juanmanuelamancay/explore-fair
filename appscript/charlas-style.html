<style>
  /* Agenda de charlas: tarjetas independientes agrupadas por día. No hay línea ni orden que seguir: cada persona va a las que quiere. */
  .ch-ruta { margin-top: 8px; }
  .ch-resumen { font-size: 13px; color: var(--texto-2); margin: 16px 4px 0; }
  .ch-dia { margin: 20px 4px 8px; font-size: 14px; font-weight: 500; color: var(--texto-2); }
  .ch-dia .ch-hoy { color: var(--azul); }

  .ch-card { border: 1px solid var(--borde); border-radius: 16px; padding: 14px 16px; background: var(--fondo); margin-bottom: 12px; scroll-margin-top: 16px; }
  .ch-card.proxima { background: var(--superficie); }
  .ch-card.abierta { border-color: var(--azul); box-shadow: 0 0 0 1px var(--azul) inset; }
  .ch-card.hecha { border-color: #b7dfc4; }
  /* Cerrada o vencida: una línea de título y estado, sin descripción ni datos. Ocupan poco y dejan arriba lo que sigue vigente. */
  .ch-card.compacta { padding: 10px 14px; background: var(--superficie); }
  .ch-card.compacta h2 { font-size: 15px; font-weight: 400; color: var(--texto-2); margin-top: 4px; }

  .ch-hora { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-2); }
  .ch-icono { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #f1f3f4; color: var(--texto-2); }
  .ch-card.abierta .ch-icono { background: var(--azul-suave); color: var(--azul); }
  .ch-card.hecha .ch-icono { background: var(--verde); color: #fff; }
  .ch-card.en-vivo .ch-icono { animation: ch-pulso 1.8s ease-out infinite; }
  @keyframes ch-pulso { 0% { box-shadow: 0 0 0 0 rgba(26, 115, 232, .45); } 100% { box-shadow: 0 0 0 10px rgba(26, 115, 232, 0); } }
  .ch-etiqueta { margin-left: auto; font-size: 12px; font-weight: 500; border-radius: 8px; padding: 2px 8px; background: var(--azul-suave); color: var(--azul); }
  .ch-etiqueta.verde { background: var(--verde-suave); color: var(--verde); }
  .ch-etiqueta.gris { background: #f1f3f4; color: var(--texto-2); }

  .ch-card h2 { font-size: 17px; line-height: 1.3; margin-top: 8px; }
  .ch-ponente { font-size: 14px; color: var(--texto-2); margin-top: 2px; }
  .ch-desc { font-size: 14px; color: #3c4043; margin-top: 8px; }
  .ch-datos { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; font-size: 13px; color: var(--texto-2); }
  .ch-cierre { display: inline-flex; align-items: center; gap: 4px; }
  .ch-sep { color: var(--borde); }
  .ch-card.en-vivo .ch-etiqueta { background: var(--azul); color: #fff; }
  .ch-card.en-vivo .ch-etiqueta::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: #fff; vertical-align: 1px; animation: ch-parpadeo 1.4s ease-in-out infinite; }
  @keyframes ch-parpadeo { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .ch-card.en-vivo .ch-etiqueta::before { animation: none; } }
  .ch-card .btn { margin-top: 12px; }
  .ch-nota { font-size: 13px; color: var(--texto-2); margin-top: 8px; }
  .ch-card:not(.compacta) .ch-nota { margin-top: 10px; }
  .ch-resultado { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
  .ch-resultado b { font-size: 24px; line-height: 1.1; color: var(--verde); }
  .ch-resultado span { font-size: 13px; color: var(--texto-2); }
  .ch-vacio { text-align: center; color: var(--texto-2); padding: 40px 16px; }
</style>
