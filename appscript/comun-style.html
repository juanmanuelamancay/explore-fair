<style>
  /* Estilos compartidos por todas las vistas. Reglas en docs/reglas/ux-ui.md */
  :root {
    --azul: #1a73e8;
    --azul-suave: #e8f0fe;
    --rojo: #d93025;
    --rojo-suave: #fce8e6;
    --amarillo: #f9ab00;
    --verde: #188038;
    --verde-suave: #e6f4ea;
    --fondo: #ffffff;
    --superficie: #f8fafd;
    --texto: #1f1f1f;
    --texto-2: #5f6368;
    --borde: #dadce0;
    --borde-suave: #e8eaed;
    --nav-h: 72px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font: 400 16px/1.45 "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  b, h1, h2, h3 { font-weight: 500; }
  [hidden] { display: none !important; }

  .franja { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 6; display: flex; }
  .franja i { flex: 1; }
  .franja i:nth-child(1) { background: #4285f4; }
  .franja i:nth-child(2) { background: #ea4335; }
  .franja i:nth-child(3) { background: #fbbc04; }
  .franja i:nth-child(4) { background: #34a853; }

  #app {
    max-width: 480px; margin: 0 auto; min-height: 100%;
    padding: 20px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  }
  #app.sin-nav { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

  .sec { color: var(--texto-2); }
  .chico { font-size: 13px; }
  .tnum { font-variant-numeric: tabular-nums; }
  .aviso { font-size: 13px; color: var(--texto-2); margin-top: 14px; text-align: center; }
  .titulo-seccion { font-size: 14px; font-weight: 500; color: var(--texto-2); margin: 28px 4px 8px; }

  /* Cabecera con saludo y KPIs */
  .cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cab h1 { font-size: 22px; line-height: 1.2; }
  .cab > :first-child { flex: 1; min-width: 0; }

  /* Botón de actualizar, al final de la cabecera de cada vista */
  .refrescar {
    width: 44px; height: 44px; margin-right: -8px; border-radius: 50%; flex: none;
    display: grid; place-items: center; color: var(--texto-2);
  }
  .refrescar:active { background: var(--superficie); }
  .refrescar:disabled { cursor: default; }
  .refrescar.girando svg { animation: giro .8s linear infinite; }
  .kpis { display: flex; border: 1px solid var(--borde); border-radius: 16px; flex: none; }
  .kpi { position: relative; padding: 8px 14px; text-align: center; min-width: 64px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .kpi + .kpi { border-left: 1px solid var(--borde); }
  .kpi b { display: block; font-size: 20px; line-height: 1.15; }
  .kpi span { font-size: 11px; color: var(--texto-2); }

  /* Mensaje guía */
  .guia { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 16px; background: var(--azul-suave); border-radius: 16px; }
  .guia .icono { width: 36px; height: 36px; border-radius: 50%; background: var(--fondo); color: var(--azul); display: grid; place-items: center; flex: none; }
  .guia b { display: block; font-size: 15px; }
  .guia span { font-size: 14px; color: #3c4043; }
  .guia.ok { background: var(--verde-suave); }
  .guia.ok .icono { color: var(--verde); }

  /* Tarjetas y botones */
  .tarjeta { border: 1px solid var(--borde); border-radius: 24px; padding: 24px 20px; }
  .centro { text-align: center; }
  .centro h2 { font-size: 22px; font-weight: 400; }
  .disco-grande {
    width: 76px; height: 76px; border-radius: 50%; margin: 4px auto 16px; display: grid; place-items: center;
    background: var(--t, #f1f3f4); color: var(--c, var(--texto-2)); font-weight: 700; font-size: 18px;
  }
  .btn {
    display: block; width: 100%; min-height: 52px; border-radius: 26px;
    background: var(--azul); color: #fff; font-weight: 500; font-size: 15px; margin-top: 14px;
  }
  .btn:active { background: #1765cc; }
  .btn.secundario { background: transparent; color: var(--azul); border: 1px solid var(--borde); }
  .btn.texto { background: transparent; color: var(--azul); margin-top: 4px; }
  .btn.peligro-borde { background: transparent; color: var(--rojo); border: 1px solid var(--borde); }
  .btn.peligro { background: var(--rojo); }
  .btn:disabled { background: #e8eaed; color: #9aa0a6; border: 0; cursor: default; }

  .giro {
    width: 18px; height: 18px; border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 8px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: giro .8s linear infinite;
  }
  .giro.oscuro { border-color: var(--borde); border-top-color: var(--azul); width: 28px; height: 28px; margin: 0; }
  @keyframes giro { to { transform: rotate(360deg); } }

  /* Cargando, error y sin datos */
  /* Columna centrada: el giro, el ícono, el texto y el botón quedan al medio en cualquier contenedor. */
  .estado { padding: 48px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .estado .giro { flex: none; }
  .estado h2 { font-size: 20px; font-weight: 400; margin-top: 14px; }
  .estado p { margin-top: 6px; font-size: 14px; color: var(--texto-2); }
  .estado .btn { max-width: 220px; margin: 18px auto 0; }
  .estado .icono { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: #f1f3f4; color: var(--texto-2); }

  /* Listas */
  .lista { border: 1px solid var(--borde); border-radius: 20px; overflow: hidden; }
  .fila { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 60px; border-bottom: 1px solid var(--borde-suave); background: var(--fondo); }
  .fila:last-child { border-bottom: 0; }
  .fila .quien { flex: 1; min-width: 0; }
  .fila .quien b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .quien span { font-size: 12px; color: var(--texto-2); }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--superficie); border: 1px solid var(--borde-suave); font-weight: 500; font-size: 14px; color: var(--texto-2);
  }

  /*
   * Medalla de puesto: oro, plata, bronce y azul para los cuatro primeros (los cuatro premios), con una corona
   * de su metal; del quinto en adelante, un círculo neutro. Los colores salen de la misma paleta del resto.
   */
  .medalla {
    position: relative; width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--superficie); border: 1px solid var(--borde-suave); font-weight: 500; color: var(--texto-2);
  }
  /* Los cuatro metales: cualquier elemento con una de estas clases toma sus colores. */
  .oro { --m-fondo: #fef7e0; --m-borde: #f9ab00; --m-texto: #b06000; --m-corona: #fbbc04; }
  .plata { --m-fondo: #f1f3f4; --m-borde: #9aa0a6; --m-texto: #5f6368; --m-corona: #aab0b7; --m-corona-borde: #6f757c; }
  .bronce { --m-fondo: #fbe9e0; --m-borde: #c5733a; --m-texto: #8a4720; --m-corona: #d98e5a; }
  .azul { --m-fondo: var(--azul-suave); --m-borde: var(--azul); --m-texto: var(--azul); --m-corona: #8ab4f8; }
  /* Medalla con número y avatar con iniciales comparten el mismo aspecto de medalla. */
  .medalla.oro, .medalla.plata, .medalla.bronce, .medalla.azul,
  .avatar.oro, .avatar.plata, .avatar.bronce, .avatar.azul {
    position: relative; background: var(--m-fondo); border: 2px solid var(--m-borde); color: var(--m-texto);
    font-weight: 700; box-shadow: inset 0 0 0 2px var(--fondo);
  }
  .corona { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); width: 22px; height: 16px; pointer-events: none; }
  .corona path { fill: var(--m-corona); stroke: var(--m-corona-borde, var(--m-borde)); stroke-width: 1.6; stroke-linejoin: round; }

  .etiqueta-pab { font-size: 12px; font-weight: 500; color: var(--c); letter-spacing: .04em; text-transform: uppercase; }
  .abr {
    width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; background: var(--t); color: var(--c);
  }

  /* Hoja inferior */
  #velo { position: fixed; inset: 0; z-index: 7; background: rgba(32,33,36,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #hoja {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-width: 480px; margin: 0 auto;
    background: var(--fondo); border-radius: 28px 28px 0 0;
    padding: 8px 8px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s cubic-bezier(.2,0,0,1);
    max-height: 90vh; overflow-y: auto;
  }
  body.hoja-abierta #velo { opacity: 1; pointer-events: auto; }
  body.hoja-abierta #hoja { transform: none; }
  .asa { width: 32px; height: 4px; border-radius: 2px; background: var(--borde); margin: 8px auto 12px; }
  .hoja-cerrar {
    position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; color: var(--texto-2);
  }
  .hoja-cerrar:active { background: var(--superficie); }
  .hoja-texto { padding: 8px 16px 4px; }
  .hoja-texto h2 { font-size: 22px; font-weight: 400; }
  .hoja-texto p { margin-top: 10px; color: var(--texto-2); font-size: 15px; }

  /* Navegación inferior */
  #nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--superficie); border-top: 1px solid var(--borde-suave);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #nav .dentro { max-width: 480px; margin: 0 auto; display: flex; height: var(--nav-h); }
  #nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--texto-2); }
  #nav .pastilla { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background .15s; }
  #nav button.activa { color: var(--texto); }
  #nav button.activa .pastilla { background: #d3e3fd; color: #0b57d0; }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
    max-width: 448px; margin: 0 auto; z-index: 9;
    background: #323232; color: #fff; border-radius: 8px; padding: 14px 16px; font-size: 14px;
    opacity: 0; transform: translateY(12px); transition: .2s; pointer-events: none;
  }
  #toast.visible { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
