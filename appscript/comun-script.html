<script>
/* Utilidades y navegación compartidas. Cada vista se registra con App.registrar(nombre, { alMostrar, alOcultar, alRefrescar, sinNav }). */

const INICIO = window.INICIO;
const $ = id => document.getElementById(id);

/** Todo dato que venga de las hojas pasa por aquí antes de entrar a innerHTML. */
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iniciales = nombre => String(nombre).trim().split(/\s+/).map(p => p.charAt(0)).slice(0, 2).join('').toUpperCase();
const formatoReloj = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

const svg = (d, tam = 24, color = 'currentColor', grosor = 2) =>
  `<svg width="${tam}" height="${tam}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${grosor}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

  toque: 'M9 11V5.5a1.5 1.5 0 013 0V11m0-1.5a1.5 1.5 0 013 0V11m0-.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L5 14.5a1.5 1.5 0 012.5-1.6L9 14.5V11',

  trofeo: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3',

  llave: 'M15.5 3a5.5 5.5 0 11-5.2 7.3L3 17.6V21h3.4v-2.4h2.4v-2.4h2.3l1.2-1.2A5.5 5.5 0 0115.5 3zM17 7h.01',
  megafono: 'M4 10v4h3l6 4V6l-6 4H4zM17 9a4 4 0 010 6',

  gente: 'M10 11a3 3 0 100-6 3 3 0 000 6zM4 19v-1a4 4 0 014-4h4a4 4 0 014 4v1M16 5.2a3 3 0 010 5.6M20 19v-1a4 4 0 00-2.5-3.7',
};

const CORONA = '<svg class="corona" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 5l5 4 5-7 5 7 5-4-2 11H4L2 5z"/></svg>';

/** "oro", "plata" o "bronce" para los tres primeros puestos (los tres premios); vacío para el resto. */
const metalDe = puesto => ['oro', 'plata', 'bronce'][puesto - 1] || '';

/** Círculo con el número de puesto. Los tres primeros llevan corona de su metal. */
function medalla(puesto) {
  const metal = metalDe(puesto);
  return `<span class="medalla ${metal}">${metal ? CORONA : ''}${puesto}</span>`;
}

/** Avatar con las iniciales; en los tres primeros puestos toma el metal y la corona. */
function avatarDePuesto(nombre, puesto) {
  const metal = metalDe(puesto);
  return `<span class="avatar ${metal}">${metal ? CORONA : ''}${esc(iniciales(nombre))}</span>`;
}

// Color, tinte e ícono de cada pabellón según su posición en el mapa. Se repiten si hay más de siete.
const PALETA = [
  { color: '#1a73e8', tinte: '#e8f0fe', icono: 'M4 5h16v6H4zM4 13h16v6H4zM8 8h.01M8 16h.01' },
  { color: '#d93025', tinte: '#fce8e6', icono: 'M3 4h18v12H3zM8 20h8M12 16v4' },
  { color: '#188038', tinte: '#e6f4ea', icono: 'M12 3a9 9 0 100 18 9 9 0 000-18zM8 12.5l3 3 5-6' },
  { color: '#e37400', tinte: '#fef7e0', icono: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z' },
  { color: '#9334e6', tinte: '#f3e8fd', icono: 'M5 20V10M12 20V4M19 20v-7' },
  { color: '#c2185b', tinte: '#fce4ec', icono: 'M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4' },
  { color: '#00897b', tinte: '#e0f2f1', icono: 'M8 6h8M7 8l4 8M17 8l-4 8M8 6a2 2 0 11-4 0 2 2 0 014 0zM20 6a2 2 0 11-4 0 2 2 0 014 0zM14 18a2 2 0 11-4 0 2 2 0 014 0z' },
];
const paleta = indice => PALETA[indice % PALETA.length];

/** "ASO / APIs" -> "ASO", "Code Review" -> "CR", "Katalyst" -> "KATA". */
function abreviatura(nombre) {
  const palabras = String(nombre).split('/')[0].trim().split(/[\s&-]+/).filter(Boolean);
  if (palabras.length > 1) return palabras.map(p => p.charAt(0)).join('').slice(0, 4).toUpperCase();
  return (palabras[0] || '?').slice(0, 4).toUpperCase();
}

/** Llama a una función del servidor y devuelve una promesa. */
function servidor(nombre, ...argumentos) {
  return new Promise((bien, mal) => {
    google.script.run.withSuccessHandler(bien).withFailureHandler(error => {
      // Si el servidor ya no le permite esta vista (cambió su rol o se encendió la sala de espera),
      // se comprueba su acceso y la app se reabre con lo que le corresponde.
      if (nombre !== 'obtenerAcceso' && /No tienes permiso/.test(String(error && error.message))) App.comprobarAcceso();
      mal(error);
    })[nombre](...argumentos);
  });
}

/**
 * Como servidor(), pero reintenta sola si falla la conexión. Solo para llamadas que se pueden repetir
 * sin efecto doble: el servidor reconoce el intento que ya existe. No usarla para crear algo nuevo cada vez.
 */
function servidorInsistente(nombre, ...argumentos) {
  const ESPERAS_MS = [1500, 3000, 6000];
  const intentar = n => servidor(nombre, ...argumentos).catch(error => {
    const sinPermiso = /No tienes permiso/.test(String(error && error.message));
    if (sinPermiso || n >= ESPERAS_MS.length) throw error;
    return new Promise(listo => setTimeout(listo, ESPERAS_MS[n])).then(() => intentar(n + 1));
  });
  return intentar(0);
}

/**
 * Filas de fichas con desplazamiento lateral (clase "carril"). Con el dedo se deslizan solas; con mouse
 * no hay gesto, así que la rueda las mueve de lado y también se pueden arrastrar con el botón apretado.
 */
function activarCarriles() {
  document.addEventListener('wheel', e => {
    const carril = e.target.closest('.carril');
    if (!carril || e.ctrlKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;   // el gesto lateral ya funciona solo
    const paso = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    const tope = carril.scrollWidth - carril.clientWidth;
    // En el extremo, o si no hay más que ver, la rueda sigue moviendo la página.
    if (tope <= 0 || (paso < 0 ? carril.scrollLeft <= 1 : carril.scrollLeft >= tope - 1)) return;
    carril.scrollLeft += paso;
    e.preventDefault();
  }, { passive: false });

  let arrastre = null;
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const carril = e.target.closest('.carril');
    if (carril && carril.scrollWidth > carril.clientWidth) arrastre = { carril, x: e.clientX, desde: carril.scrollLeft, movido: false };
  });
  document.addEventListener('pointermove', e => {
    if (!arrastre) return;
    const dx = e.clientX - arrastre.x;
    if (!arrastre.movido && Math.abs(dx) < 5) return;   // un clic con temblor no es un arrastre
    arrastre.movido = true;
    arrastre.carril.classList.add('arrastrando');
    arrastre.carril.scrollLeft = arrastre.desde - dx;
  });
  const soltar = () => {
    if (!arrastre) return;
    const { carril, movido } = arrastre;
    arrastre = null;
    carril.classList.remove('arrastrando');
    if (!movido) return;
    // Al soltar sobre una ficha el navegador manda un clic: tras arrastrar no debe elegirla.
    const ignorar = e => { e.stopPropagation(); e.preventDefault(); };
    document.addEventListener('click', ignorar, true);
    setTimeout(() => document.removeEventListener('click', ignorar, true), 0);
  };
  document.addEventListener('pointerup', soltar);
  document.addEventListener('pointercancel', soltar);
}

/**
 * Los carriles se repintan al elegir una ficha y volverían al inicio. Se llama antes de repintar y la función
 * que devuelve, después: deja el carril donde estaba y a la vista la ficha elegida (aria-selected).
 */
function recordarCarril(raiz) {
  const buscar = () => raiz.matches('.carril') ? raiz : raiz.querySelector('.carril');
  const antes = buscar();
  const izquierda = antes ? antes.scrollLeft : 0;
  return () => {
    const carril = buscar();
    if (!carril) return;
    carril.scrollLeft = izquierda;
    const elegida = carril.querySelector('[aria-selected="true"]');
    if (!elegida) return;
    const c = carril.getBoundingClientRect(), f = elegida.getBoundingClientRect();
    if (f.left < c.left) carril.scrollLeft += f.left - c.left - 16;
    else if (f.right > c.right) carril.scrollLeft += f.right - c.right + 16;
  };
}

let temporizadorToast;
function toast(texto) {
  const t = $('toast');
  t.textContent = texto;
  t.classList.add('visible');
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => t.classList.remove('visible'), 3000);
}

const SEGUNDOS_AVISO = 8;
let temporizadorAviso;
/**
 * Toast largo con título, texto, botón de cerrar y una barra que se vacía. Se cierra solo a los SEGUNDOS_AVISO
 * y un toque en cualquier parte lo cierra antes. Al cambiar de vista se cierra solo (App.ir).
 */
function mostrarAviso(titulo, texto) {
  const a = $('aviso');
  clearTimeout(temporizadorAviso);
  a.style.setProperty('--s', SEGUNDOS_AVISO + 's');
  // Con la barra de navegación a la vista, el aviso va encima de ella.
  a.style.setProperty('--aviso-abajo', $('nav').hidden ? '16px' : 'calc(var(--nav-h) + 16px)');
  // Se vuelve a pintar entero para que la barra de tiempo arranque de cero cada vez.
  a.innerHTML = `
    <span class="aviso-icono">${svg(ICONO.info, 20)}</span>
    <div class="aviso-cuerpo"><b>${esc(titulo)}</b><p>${esc(texto)}</p></div>
    <button class="aviso-cerrar" aria-label="Cerrar aviso">${svg(ICONO.equis, 20)}</button>
    <i class="aviso-tiempo"></i>`;
  a.onclick = cerrarAviso;
  a.classList.add('visible');
  temporizadorAviso = setTimeout(cerrarAviso, SEGUNDOS_AVISO * 1000);
}
function cerrarAviso() {
  clearTimeout(temporizadorAviso);
  $('aviso').classList.remove('visible');
}

const App = (() => {
  // vista de Permisos -> nombre de la vista en el navegador, en el orden de la barra inferior
  const NAVEGACION = [
    { vista: 'MAPA', nombre: 'mapa', texto: 'Mapa', icono: ICONO.mapa },
    { vista: 'CHARLAS', nombre: 'charlas', texto: 'Talleres', icono: ICONO.taller },
    { vista: 'GENERAR_CODIGO', nombre: 'generar-codigo', texto: 'Código', icono: ICONO.llave },
    { vista: 'PREGUNTAS', nombre: 'preguntas', texto: 'Preguntas', icono: 'M5 4h14v16H5zM9 9h6M9 13h6M9 17h3' },
    { vista: 'PANEL_ADMIN', nombre: 'panel-admin', texto: 'Panel', icono: ICONO.escudo },
    { vista: 'RANKING', nombre: 'ranking', texto: 'Ranking', icono: ICONO.trofeo },
    { vista: 'INGRESOS', nombre: 'ingresos', texto: 'Ingresos', icono: ICONO.gente },
    { vista: 'ESPERA', nombre: 'espera', texto: 'Espera', icono: ICONO.reloj },
  ];
  const vistas = {};
  let actual = null;
  let destinos = [];

  function registrar(nombre, definicion) { vistas[nombre] = definicion; }

  function ir(nombre, datos) {
    if (!vistas[nombre]) return;
    if (actual && vistas[actual].alOcultar) vistas[actual].alOcultar();
    cerrarAviso();
    cerrarHoja();
    const anterior = actual;
    actual = nombre;
    // Entrar al quiz avanza desde la derecha, volver de él retrocede desde la izquierda; entre pestañas solo se funde.
    const entrada = !anterior || anterior === nombre ? '' : nombre === 'quiz' ? 'entra-adelante' : anterior === 'quiz' ? 'entra-atras' : 'entra';
    document.querySelectorAll('.vista').forEach(s => {
      s.classList.remove('entra', 'entra-adelante', 'entra-atras');
      s.hidden = s.id !== 'vista-' + nombre;
      if (!s.hidden && entrada) s.classList.add(entrada);
    });
    const conNav = destinos.length > 1 && !vistas[nombre].sinNav;
    $('nav').hidden = !conNav;
    $('app').classList.toggle('sin-nav', !conNav);
    $('nav-dentro').querySelectorAll('button').forEach(b => {
      b.classList.toggle('activa', b.dataset.ir === nombre);
      // La pestaña activa queda a la vista aunque la barra se deslice (sin mover la página).
      if (b.dataset.ir === nombre && !$('nav').hidden) b.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
    window.scrollTo(0, 0);
    if (vistas[nombre].alMostrar) vistas[nombre].alMostrar(datos || {});
  }

  /** Si el rol o las vistas ya no son los de cuando se abrió la página, la vuelve a abrir. */
  function comprobarAcceso() {
    return servidor('obtenerAcceso').then(a => {
      const iguales = a.rol === INICIO.rol && a.vistas.slice().sort().join() === INICIO.vistas.slice().sort().join();
      if (!iguales) reabrir(a.url);
    }).catch(() => {});
  }

  /**
   * Vuelve a pedir al servidor los datos de la vista en pantalla, sin recargar la página.
   * No vacía la caché compartida: eso frenaría a todos. El puntaje y los intentos de cada persona
   * salen de su propio índice, así que siempre llegan al día.
   */
  function refrescar(boton) {
    const vista = vistas[actual];
    if (!vista || !vista.alRefrescar || boton.disabled) return;
    const MINIMO_MS = 600;   // para que el giro se alcance a ver aunque la respuesta sea inmediata
    const ENFRIAMIENTO_MS = 8000;   // tiempo mínimo entre un refresco y el siguiente
    const inicio = Date.now();
    boton.disabled = true;
    boton.classList.add('girando');
    // A la vez que los datos, se comprueba si a la persona le cambiaron el rol o las vistas.
    const acceso = comprobarAcceso();
    const datos = Promise.resolve(vista.alRefrescar()).catch(() => {});
    Promise.all([acceso, datos]).then(() => {
      // El giro para al terminar; el botón queda bloqueado hasta cumplir el enfriamiento, para que no se martille el servidor.
      setTimeout(() => boton.classList.remove('girando'), Math.max(0, MINIMO_MS - (Date.now() - inicio)));
      setTimeout(() => { boton.disabled = false; }, Math.max(0, ENFRIAMIENTO_MS - (Date.now() - inicio)));
    });
  }

  /**
   * Vuelve a abrir la app para que se arme con el rol nuevo. La página vive dentro de un marco
   * de Google que a veces impide navegar sola, así que además queda un botón para hacerlo a mano.
   */
  function reabrir(url) {
    abrirHoja(`
      <div class="hoja-texto">
        <h2>Tu acceso cambió</h2>
        <p>Te asignaron otro rol u otras vistas. Hay que volver a abrir la app para verlas.</p>
        <a class="btn" href="${esc(url)}" target="_top" style="display:grid;place-items:center;text-decoration:none">Abrir de nuevo</a>
      </div>`);
    try { window.open(url, '_top'); } catch (error) { /* queda el botón */ }
  }

  function abrirHoja(html) {
    cerrarAviso();              // la hoja ocupa el mismo lugar: el aviso no debe quedar encima
    $('hoja').onclick = null;   // cada vista pone su propio manejador al abrirla
    $('hoja').removeAttribute('aria-labelledby');
    $('hoja').innerHTML = '<div class="asa"></div><button class="hoja-cerrar" data-cerrar aria-label="Cerrar">' + svg(ICONO.equis, 20) + '</button>' + html;
    document.body.classList.add('hoja-abierta');
    return $('hoja');
  }
  function cerrarHoja() { document.body.classList.remove('hoja-abierta'); }

  function cargando(contenedor) {
    contenedor.innerHTML = '<div class="estado"><i class="giro oscuro"></i><p>Cargando…</p></div>';
  }
  function error(contenedor, reintentar) {
    contenedor.innerHTML = `<div class="estado"><div class="icono">${svg(ICONO.nube, 32)}</div>
      <h2>No pudimos cargar</h2><p>Inténtalo de nuevo.</p>
      <button class="btn secundario">Reintentar</button></div>`;
    contenedor.querySelector('button').onclick = reintentar;
  }

  function iniciar() {
    destinos = NAVEGACION.filter(d => INICIO.vistas.indexOf(d.vista) >= 0 && vistas[d.nombre]);
    $('nav-dentro').innerHTML = destinos.map(d =>
      `<button data-ir="${d.nombre}"><span class="pastilla">${svg(d.icono)}</span>${d.texto}</button>`).join('');
    // "Explore Fair · Rol" en la cabecera de cada vista del staff, para saber con qué rol se entró.
    // El usuario ve solo "Explore Fair": no necesita saber su rol.
    const ROLES = { LIDER: 'Líder', EXPOSITOR: 'Expositor', PONENTE: 'Ponente', ADMIN: 'Admin', VALIDADOR: 'Validador' };
    const etiquetas = (INICIO.roles || [INICIO.rol]).filter(r => r !== 'USUARIO')
      .map(r => ROLES[r] || r.charAt(0) + r.slice(1).toLowerCase());
    const rol = etiquetas.length > 1 ? etiquetas.slice(0, -1).join(', ') + ' y ' + etiquetas[etiquetas.length - 1] : etiquetas[0] || '';
    document.querySelectorAll('[data-marca]').forEach(p => { p.textContent = rol ? 'Explore Fair · ' + rol : 'Explore Fair'; });
    // El usuario no tiene botón de actualizar: la app se pone al día sola (ver ux-ui.md). Solo lo ven líder y admin.
    document.querySelectorAll('[data-refrescar]').forEach(b => {
      if (INICIO.rol === 'USUARIO') b.remove();
      else b.innerHTML = svg(ICONO.refrescar, 22);
    });
    document.addEventListener('click', e => {
      if (e.target.closest('[data-cerrar]')) return cerrarHoja();
      const actualizar = e.target.closest('[data-refrescar]');
      if (actualizar) return refrescar(actualizar);
      const destino = e.target.closest('[data-ir]');
      if (destino) ir(destino.dataset.ir);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });
    activarCarriles();
    if (destinos.length) ir(destinos[0].nombre);
    if (INICIO.rol === 'VALIDADOR') mostrarAviso('Modo solo vista', 'Estás como validador. Puedes ver el mapa, los talleres y las preguntas, pero no responder ni editar nada.');
    if (INICIO.registrar) registrarEnSegundoPlano(0);
  }

  /**
   * Registra a la persona en Usuarios sin que lo note. El servidor responde listo cuando su fila ya está
   * en la hoja; si todavía no (otra persona tiene el turno de escritura), se vuelve a preguntar más tarde.
   * Si se agotan los intentos no pasa nada: se retoma la próxima vez que abra la app o empiece un quiz.
   */
  function registrarEnSegundoPlano(n) {
    const ESPERAS_S = [5, 10, 20, 40, 60];
    servidor('registrarme').then(r => !!(r && r.listo), () => false).then(listo => {
      if (listo || n >= ESPERAS_S.length) return;
      // El azar reparte las consultas de quienes entraron a la vez.
      setTimeout(() => registrarEnSegundoPlano(n + 1), (ESPERAS_S[n] + Math.random() * 5) * 1000);
    });
  }

  // estado.puntos es el total de la persona: el resultado del quiz lo usa para mostrar el acumulado.
  return { registrar, ir, abrirHoja, cerrarHoja, cargando, error, iniciar, comprobarAcceso, estado: { puntos: 0 } };
})();
</script>
