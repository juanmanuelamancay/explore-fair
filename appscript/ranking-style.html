<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap');
  /* Vista RANKING, pensada para proyectar en una pantalla grande.
     Las reglas están limitadas a esta vista (o al panel de ajustes en #hoja).
     Los tamaños salen de variables CSS que se mueven en vivo desde el panel de ajustes.
     El tema escénico (colores, medallas y fondo) está al final del archivo. */
  /* La vista ocupa justo el alto de la pantalla (ni sobra ni falta): arriba 12 px de margen, abajo la barra de
     navegación y 16 px. No lleva cabecera (marca, título): en la pantalla gigante ese alto es para el ranking. */
  /* Margen de seguridad (--rp-mv alto, --rp-mh ancho; ajuste "margen", 5 % por defecto): muchos televisores y
     proyectores recortan los bordes (overscan). El fondo sí llega al borde; el contenido queda dentro. */
  body.pantalla-grande { --rp-mv: 5vh; --rp-mh: 5vw; --rp-borde-arriba: max(12px, var(--rp-mv)); --rp-borde-abajo: max(16px, var(--rp-mv)); }
  body.pantalla-grande #app { max-width: none; padding: var(--rp-borde-arriba) max(32px, var(--rp-mh)) calc(var(--nav-h) + var(--rp-borde-abajo) + env(safe-area-inset-bottom)); }
  #vista-ranking {
    --rp-cols: 3; --rp-alto: 64px; --rp-espacio: 10px; --rp-fuente: 16px; --rp-puntos: 22px; --rp-escala: 1; --rp-ancho-top: 66%; --rp-tiempo: 13px; --rp-nombre-top: 16px; --rp-pts-top: 18px; --rp-tiempo-top: 13px; --rp-ancho-contenido: 100%; --rp-resumen: 20px;
    height: calc(100dvh - var(--rp-borde-arriba, 12px) - var(--rp-borde-abajo, 16px) - var(--nav-h) - env(safe-area-inset-bottom)); display: flex; flex-direction: column; position: relative;
    overflow-x: clip;   /* el halo del podio sale por los lados: no debe abrir una barra horizontal */
  }
  body.pantalla-grande.sin-menu #vista-ranking { height: calc(100dvh - 2 * var(--rp-borde-arriba)); }
  /* El título queda solo para lectores de pantalla */
  #vista-ranking .rp-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Controles flotantes en la esquina superior derecha (hora, ajustes, actualizar): no ocupan alto y casi no se
     ven en la proyección; se encienden al pasar el mouse o al llegar con el teclado */
  #vista-ranking .rp-controles {
    position: absolute; top: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    opacity: .18; transition: opacity .2s;
  }
  #vista-ranking .rp-controles:hover, #vista-ranking .rp-controles:focus-within { opacity: 1; }
  #vista-ranking .rp-hora { margin: 0; font-size: 12px; color: var(--texto-2); font-variant-numeric: tabular-nums; }
  #vista-ranking .rp-ajustes-btn {
    width: 44px; height: 44px; border-radius: 50%; flex: none; align-self: center;
    display: grid; place-items: center; border: 1px solid var(--borde); color: var(--texto-2);
  }
  #vista-ranking .rp-ajustes-btn:active { background: var(--superficie); }
  #vista-ranking .rp-accion {
    height: 36px; padding: 0 14px; border-radius: 18px; flex: none; font: inherit; font-size: 13px; font-weight: 500;
    border: 1px solid var(--borde); background: transparent; color: var(--texto-2); cursor: pointer;
  }
  #vista-ranking .rp-accion:disabled { opacity: .4; cursor: default; }
  /* El contenido va centrado; su ancho es el ajuste "Ancho del contenido" (% del espacio dentro del margen) */
  #vista-ranking #rp-contenido { flex: 1; min-height: 0; display: flex; flex-direction: column; width: var(--rp-ancho-contenido); margin: 0 auto; }

  /* Podio: su ancho y su escala (--rp-ancho-top, --rp-escala) son propios; no dependen de las columnas ni de las filas.
     Cada pedestal mide como mucho 340 px × escala de ancho: así ancho y alto crecen juntos y el podio no se
     vuelve una losa plana en pantallas anchas. Si falta alto, el script baja la escala (ver ajustarPodioAlAlto). */
  #vista-ranking .podio {
    --rp-podio: 3; width: min(calc(var(--rp-ancho-top) * var(--rp-podio) / 3), calc(var(--rp-podio) * 300px * var(--rp-escala-base, 1)));
    margin: 0 auto 24px; padding-top: calc(40px * var(--rp-escala));
    display: grid; grid-template-columns: repeat(var(--rp-podio), 1fr); align-items: end;
  }
  #vista-ranking .lugar { text-align: center; min-width: 0; position: relative; }
  /* Los pedestales se solapan: el 1.º va delante y los otros dos quedan detrás */
  #vista-ranking .lugar.l1 { z-index: 30; }
  #vista-ranking .lugar.l2 { z-index: 20; margin-right: calc(-16px * var(--rp-escala)); }
  #vista-ranking .lugar.l3 { z-index: 10; margin-left: calc(-16px * var(--rp-escala)); }
  /* El avatar levita y su sombra de contacto, sobre la tapa, se encoge cuando sube */
  #vista-ranking .lugar .ficha { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  #vista-ranking .lugar .flota { animation: rp-flota 3.2s ease-in-out infinite; }
  #vista-ranking .lugar .sombra {
    width: 64%; height: calc(14px * var(--rp-escala)); margin-bottom: calc(-7px * var(--rp-escala));
    border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0, 0, 0, .85) 0%, rgba(0, 0, 0, 0) 72%);
    animation: rp-sombra 3.2s ease-in-out infinite;
  }
  #vista-ranking .lugar.l2 .flota, #vista-ranking .lugar.l2 .sombra { animation-duration: 3.6s; animation-delay: .4s; }
  #vista-ranking .lugar.l3 .flota, #vista-ranking .lugar.l3 .sombra { animation-duration: 3.9s; animation-delay: .8s; }
  /* Entrada en resorte: solo corre la primera vez que se muestra la pantalla (clase .entrar) */
  #vista-ranking .podio.entrar .cuerpo { animation: rp-resorte .85s cubic-bezier(.34, 1.56, .64, 1) .3s both; }
  #vista-ranking .podio.entrar .lugar.l2 .cuerpo { animation-delay: .08s; }
  #vista-ranking .podio.entrar .lugar.l3 .cuerpo { animation-delay: .18s; }
  #vista-ranking .podio.entrar .ficha { animation: rp-caida .75s cubic-bezier(.34, 1.56, .64, 1) .6s both; }
  #vista-ranking .podio.entrar .lugar.l2 .ficha { animation-delay: .35s; }
  #vista-ranking .podio.entrar .lugar.l3 .ficha { animation-delay: .45s; }
  @keyframes rp-flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(-12px * var(--rp-escala))); } }
  @keyframes rp-sombra { 0%, 100% { transform: scale(1); opacity: .8; filter: blur(4px); } 50% { transform: scale(.62); opacity: .35; filter: blur(7px); } }
  @keyframes rp-resorte {
    0% { transform: scaleY(.05) translateY(calc(80px * var(--rp-escala))); opacity: 0; }
    60% { transform: scaleY(1.04) translateY(-6px); opacity: 1; }
    80% { transform: scaleY(.98) translateY(2px); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes rp-caida {
    0% { transform: translateY(-50px) scale(.5); opacity: 0; }
    70% { transform: translateY(6px) scale(1.06); opacity: 1; }
    100% { transform: none; opacity: 1; }
  }
  #vista-ranking .lugar .avatar {
    display: grid; margin: 0 auto calc(10px * var(--rp-escala)); width: calc(84px * var(--rp-escala)); height: calc(84px * var(--rp-escala));
    font-size: calc(28px * var(--rp-escala));
  }
  #vista-ranking .lugar.l1 .avatar {
    position: relative; z-index: 2; width: calc(112px * var(--rp-escala)); height: calc(112px * var(--rp-escala));
    font-size: calc(40px * var(--rp-escala)); animation: rp-brillo-oro 2.8s ease-in-out infinite;
  }
  #vista-ranking .lugar.l1 .avatar::before, #vista-ranking .lugar.l1 .avatar::after {
    content: ''; position: absolute; z-index: 3; width: calc(19px * var(--rp-escala)); height: calc(19px * var(--rp-escala)); background: #FFE066;
    clip-path: polygon(50% 0, 62% 37%, 100% 50%, 62% 63%, 50% 100%, 38% 63%, 0 50%, 38% 37%);
    filter: drop-shadow(0 0 5px rgba(255, 215, 0, .8)); animation: rp-estrella-oro 1.8s ease-in-out infinite;
  }
  #vista-ranking .lugar.l1 .avatar::before { top: 13%; right: -12%; }
  #vista-ranking .lugar.l1 .avatar::after {
    left: -11%; bottom: 14%; width: calc(15px * var(--rp-escala)); height: calc(15px * var(--rp-escala)); background: #FFD700;
    filter: drop-shadow(0 0 5px rgba(255, 215, 0, .75)); animation-delay: .9s;
  }
  #vista-ranking .lugar .corona { width: calc(28px * var(--rp-escala)); height: calc(21px * var(--rp-escala)); top: calc(-20px * var(--rp-escala)); }
  #vista-ranking .lugar.l1 .corona { width: calc(40px * var(--rp-escala)); height: calc(30px * var(--rp-escala)); top: calc(-28px * var(--rp-escala)); }
  #vista-ranking .lugar .nombre { font-size: var(--rp-nombre-top); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vista-ranking .lugar.l1 .nombre { font-size: calc(var(--rp-nombre-top) * 1.25); }
  #vista-ranking .lugar .pts { font-size: calc(19px * var(--rp-escala)); color: var(--texto-2); }
  #vista-ranking .lugar .cuerpo {
    position: relative; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
    min-height: calc(var(--rp-cuerpo) * var(--rp-escala)); padding: calc(14px * var(--rp-escala)) calc(10px * var(--rp-escala)) calc(18px * var(--rp-escala));
    --rp-tapa: calc(22px * var(--rp-escala)); transform-origin: bottom center;
  }
  #vista-ranking .lugar .base { margin: auto 0; display: grid; place-items: center; }
  /* El nombre va sobre el pedestal; puntos y tiempo, debajo del número, dentro del cilindro */
  #vista-ranking .lugar .info { display: flex; flex-direction: column; align-items: center; margin-bottom: calc(12px * var(--rp-escala)); }
  #vista-ranking .lugar .metricas { display: flex; flex-direction: column; align-items: center; gap: calc(6px * var(--rp-escala)); margin-top: calc(8px * var(--rp-escala)); }

  /* Chip de tiempo: segundos totales en sus quizzes (el criterio de desempate). Lo lleva todo el mundo, también
     el top, para que cada puesto tenga la misma estructura: nombre, puntos y tiempo. Cada contexto (podio o
     cuadrícula) escala con su propia variable, igual que el resto de sus textos. */
  #vista-ranking .rp-desempate {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 7px; border-radius: 10px; border: 1px solid var(--borde-suave); background: var(--superficie);
    color: var(--texto-2); font-variant-numeric: tabular-nums;
  }
  /* El reloj crece con el texto: así el ajuste de tamaño del tiempo lo arrastra también */
  #vista-ranking .rp-desempate svg { flex: none; width: .95em; height: .95em; }
  #vista-ranking .rp-desempate { font-size: var(--rp-tiempo); }
  /* En el podio, su propio ajuste ("Top · Tamaño del tiempo"), que sigue la escala del top como los puntos */
  #vista-ranking .lugar .rp-desempate { font-size: calc(var(--rp-tiempo-top) * var(--rp-escala)); }
  #vista-ranking .lugar.l1 .rp-desempate { font-size: calc(var(--rp-tiempo-top) * 1.25 * var(--rp-escala)); }
  /* En la cuadrícula el tiempo va debajo de los puntos, sin chip: así el nombre queda centrado en la fila */
  #vista-ranking .rp-rejilla .rp-puntos .rp-desempate { padding: 0; border: 0; background: none; margin-top: 2px; white-space: nowrap; }
  /* Con muchas columnas la tarjeta se angosta: el nombre y los puntos mandan. Primero se va el tiempo de
     desempate (sigue en el top y en el title), luego se achican el círculo de posición y la etiqueta "pts".
     La tarjeta es el contenedor de la consulta, así que estas reglas solo tocan lo que lleva adentro. */
  #vista-ranking .rp-rejilla .fila { container-type: inline-size; }
  @container (max-width: 240px) {
    #vista-ranking .rp-rejilla .fila .rp-desempate { display: none; }
  }
  @container (max-width: 170px) {
    #vista-ranking .rp-rejilla .fila .pos { width: calc(var(--rp-alto) * .4); height: calc(var(--rp-alto) * .4); margin-right: -4px; }
    #vista-ranking .rp-puntos small { display: none; }
  }

  #vista-ranking .lugar.l1 { --rp-cuerpo: 220px; }
  #vista-ranking .lugar.l2 { --rp-cuerpo: 185px; }
  #vista-ranking .lugar.l3 { --rp-cuerpo: 155px; }
  #vista-ranking .lugar .delta { top: calc(-26px * var(--rp-escala)); left: 50%; margin-left: -20px; }
  @keyframes rp-brillo-oro {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(249, 171, 0, 0)); }
    50% { filter: drop-shadow(0 0 16px rgba(255, 215, 0, .55)); }
  }
  @keyframes rp-estrella-oro {
    0%, 100% { opacity: .45; transform: scale(.65) rotate(0); }
    50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
  }

  /* Cuadrícula de puestos del 5.º en adelante: columnas, alto y espacio configurables */
  #vista-ranking .rp-cuerpo { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #vista-ranking .rp-rejilla {
    flex: 1 1 0; min-height: 0; overflow: hidden;
    /* Exactamente las columnas del ajuste, sin ancho mínimo por tarjeta: con muchas, los nombres largos se cortan con "…" */
    display: grid; grid-template-columns: repeat(var(--rp-cols), minmax(0, 1fr));
    grid-template-rows: repeat(var(--rp-filas, 1), var(--rp-alto)); grid-auto-flow: column; gap: var(--rp-espacio); align-content: start;
  }
  /* Cada tarjeta separa sus datos: posición en círculo, nombre, y puntos a la derecha */
  #vista-ranking .rp-rejilla .fila {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 12px;
    height: var(--rp-alto); min-height: var(--rp-alto); font-size: var(--rp-fuente);
    border: 1px solid var(--borde); border-radius: 14px; background: var(--fondo);
  }
  #vista-ranking .rp-rejilla .fila::before {
    content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0;
    background: rgba(184, 216, 248, .25);
  }
  #vista-ranking .rp-rejilla .fila .pos {
    width: calc(var(--rp-alto) * .53); height: calc(var(--rp-alto) * .53); border-radius: 50%; flex: none;
    display: grid; place-items: center; background: var(--superficie); border: 1px solid var(--borde-suave);
    color: var(--texto-2); font-size: calc(var(--rp-fuente) * .82); font-weight: 700;
  }
  #vista-ranking .rp-rejilla .fila .quien { flex: 1; min-width: 0; }
  #vista-ranking .rp-rejilla .fila .quien b { display: block; font-size: var(--rp-fuente); font-weight: 600; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* "460 pts" en una línea, igual que en el podio: con la etiqueta debajo, la fila parecía cortada */
  #vista-ranking .rp-puntos { flex: none; min-width: calc(var(--rp-puntos) * 3.1); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; line-height: 1; font-variant-numeric: tabular-nums; }
  #vista-ranking .rp-pts-linea { display: flex; align-items: baseline; gap: 4px; }
  #vista-ranking .rp-puntos b { font-size: var(--rp-puntos); font-weight: 500; color: var(--azul); }
  #vista-ranking .rp-puntos small { font-size: calc(var(--rp-puntos) * .55); color: var(--texto-2); }
  #vista-ranking .rp-rejilla .fila.top10::before { background: linear-gradient(180deg, #FFE680 0%, #FFC400 100%); }
  #vista-ranking .rp-rejilla .fila.top20::before { background: linear-gradient(180deg, #A9D8FF 0%, #6FB5FF 100%); }

  /* Revelación: los puestos tapados se ven tenues; los que acaban de aparecer entran en cascada con --rp-retraso */
  #vista-ranking .oculto .nombre, #vista-ranking .oculto .pts, #vista-ranking .oculto .quien b, #vista-ranking .oculto .rp-puntos { opacity: .4; }
  #vista-ranking .revela { animation: rp-revela .55s cubic-bezier(.34, 1.56, .64, 1) var(--rp-retraso, 0ms) both; }
  @keyframes rp-revela {
    0% { opacity: 0; transform: scale(.6) translateY(12px); }
    60% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: none; }
  }
  /* Nombres del podio tapados: el 1.º no se ve en absoluto (su caída es la sorpresa); el 2.º y el 3.º muestran una
     moneda tenue con "?" que late, para crear expectativa. */
  #vista-ranking .podio .lugar .ficha.sin-nombre { opacity: .35; filter: grayscale(.6); }
  #vista-ranking .podio .lugar.l1 .ficha.sin-nombre { visibility: hidden; }
  #vista-ranking .podio .lugar .ficha.sin-nombre .avatar { animation: rp-latido 1.6s ease-in-out infinite; }
  @keyframes rp-latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  /* 2.º y 3.º: la moneda gira como lanzada al aire y se asienta; la placa del nombre se abre desde el centro;
     al asentarse, una onda en el color del metal sale sobre la tapa y el pedestal destella. */
  #vista-ranking .podio .lugar .ficha.voltea .flota { perspective: 600px; }
  #vista-ranking .podio .lugar .ficha.voltea .avatar { animation: rp-volteo 1s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes rp-volteo {
    0% { transform: rotateY(-90deg) scale(1.2); filter: brightness(.6); }
    65% { transform: rotateY(990deg) scale(1.22); filter: brightness(1.7); }
    82% { transform: rotateY(1080deg) scale(.94); }
    100% { transform: rotateY(1080deg) scale(1); filter: none; }
  }
  #vista-ranking .podio .lugar .ficha.voltea .nombre { animation: rp-placa .55s cubic-bezier(.3, 1.3, .5, 1) .6s backwards; }
  @keyframes rp-placa {
    0% { clip-path: inset(0 50% round 9999px); letter-spacing: .4em; opacity: 0; }
    30% { opacity: 1; }
    100% { clip-path: inset(-30px -60px round 9999px); letter-spacing: .02em; opacity: 1; }
  }
  #vista-ranking .podio .lugar .rp-onda {
    position: absolute; left: 50%; bottom: calc(-12px * var(--rp-escala)); width: 80%; height: calc(26px * var(--rp-escala));
    border-radius: 50%; border: 3px solid var(--m-borde); box-shadow: 0 0 16px var(--m-glow), inset 0 0 10px var(--m-glow);
    pointer-events: none; animation: rp-onda .9s ease-out .9s both;
  }
  @keyframes rp-onda {
    0% { transform: translateX(-50%) scale(.3); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.7); opacity: 0; }
  }
  #vista-ranking .podio .lugar.destello-nombre .cuerpo { animation: rp-destello .9s ease-out .9s; }

  /* Clímax del 1.º (los tiempos van con CLIMAX en ranking-script.html): 0 s la sala se apaga, se enciende el foco y
     la tapa late como un redoble; 1,2 s la moneda cae girando; 2,3 s impacto (temblor, onda, destello), cae la
     corona y se abre la placa con un brillo; fuegos y confeti; 4,2 s vuelven las luces. */
  #vista-ranking .podio .lugar.l2, #vista-ranking .podio .lugar.l3, #vista-ranking .rp-cuerpo { transition: opacity .8s ease; }
  #vista-ranking.rp-climax .podio .lugar.l2, #vista-ranking.rp-climax .podio .lugar.l3, #vista-ranking.rp-climax .rp-cuerpo { opacity: .5; }
  /* Reflector (lo arma encenderFoco), en #rp-escena, directo en el body y con medidas de la ventana.
     Ni #rp-escena ni .rp-foco llevan posición, opacidad, filtro ni transformación: si los llevaran, formarían un
     grupo propio y las capas se mezclarían solo entre ellas, no con la página, y la luz volvería a verse pegada.
     Cada capa es fija y va por encima de la barra de navegación. */
  #rp-escena .rp-foco > * { position: fixed; z-index: 1000; pointer-events: none; }
  /* La sala se oscurece alrededor; solo queda clara la zona que toca la luz */
  #rp-escena .rp-foco > .rp-penumbra {
    inset: 0;
    background: radial-gradient(ellipse calc(var(--ancho) * 1.1) calc(var(--tapa) * 1.3) at var(--cx) calc(var(--tapa) * .75),
      rgba(0, 0, 12, 0) 0%, rgba(0, 0, 12, 0) 35%, rgba(0, 0, 12, .45) 70%, rgba(0, 0, 12, .7) 100%);
    animation: rp-luz-sube 1s ease-out both;
  }
  /* Resplandor de la fuente, arriba, de donde nace el haz */
  #rp-escena .rp-lampara {
    left: calc(var(--cx) - var(--pedestal) * .45); top: calc(var(--pedestal) * -.18); width: calc(var(--pedestal) * .9); height: calc(var(--pedestal) * .36);
    border-radius: 50%; mix-blend-mode: screen; filter: blur(10px);
    background: radial-gradient(ellipse at center, rgba(255, 252, 235, .95) 0%, rgba(255, 228, 150, .45) 30%, rgba(255, 200, 90, 0) 70%);
    animation: rp-luz-enciende 1.1s linear both;
  }
  /* Haz: dos conos difuminados (el desenfoque va en el padre para que ablande los bordes del recorte) */
  #rp-escena .rp-haz {
    left: calc(var(--cx) - var(--ancho) / 2); top: 0; width: var(--ancho); height: calc(var(--tapa) + 18px);
    mix-blend-mode: screen; filter: blur(14px); animation: rp-luz-enciende 1.1s linear both;
  }
  #rp-escena .rp-haz i {
    position: absolute; inset: 0; clip-path: polygon(43% 0, 57% 0, 96% 100%, 4% 100%);
    background: linear-gradient(180deg, rgba(255, 238, 190, .62) 0%, rgba(255, 214, 120, .22) 45%, rgba(255, 205, 100, .34) 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 28%, #000 72%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 28%, #000 72%, transparent 100%);
    animation: rp-luz-respira 3.4s ease-in-out 1.1s infinite;
  }
  #rp-escena .rp-haz i.nucleo {
    clip-path: polygon(47.5% 0, 52.5% 0, 72% 100%, 28% 100%);
    background: linear-gradient(180deg, rgba(255, 250, 230, .55) 0%, rgba(255, 236, 180, .12) 60%, rgba(255, 230, 160, .2) 100%);
    animation-delay: 1.8s;
  }
  /* Polvo suspendido: solo se ve dentro del haz, por eso va recortado con el mismo cono */
  #rp-escena .rp-motas {
    left: calc(var(--cx) - var(--ancho) / 2); top: 0; width: var(--ancho); height: var(--tapa);
    clip-path: polygon(43% 0, 57% 0, 96% 100%, 4% 100%); mix-blend-mode: screen; animation: rp-luz-sube 2s ease-out .6s both;
  }
  #rp-escena .rp-motas i {
    position: absolute; width: var(--s); height: var(--s); border-radius: 50%;
    background: rgba(255, 244, 210, .9); box-shadow: 0 0 4px rgba(255, 230, 160, .8); filter: blur(.4px);
    animation: rp-mota var(--t) ease-in-out var(--d) infinite alternate;
  }
  /* Charco de luz donde pega el haz: ilumina la tapa del pedestal */
  #rp-escena .rp-charco {
    left: calc(var(--cx) - var(--pedestal) * .65); top: calc(var(--tapa) - var(--pedestal) * .14); width: calc(var(--pedestal) * 1.3); height: calc(var(--pedestal) * .3);
    border-radius: 50%; mix-blend-mode: screen; filter: blur(9px);
    background: radial-gradient(ellipse at center, rgba(255, 240, 190, .7) 0%, rgba(255, 214, 120, .32) 40%, rgba(255, 200, 90, 0) 72%);
    animation: rp-luz-enciende 1.1s linear both;
  }
  #rp-escena .rp-foco.apaga > * { animation: rp-luz-apaga 1s ease-in forwards; }
  /* Encendido de reflector: dos chispazos y luego sube hasta su intensidad */
  @keyframes rp-luz-enciende {
    0% { opacity: 0; } 8% { opacity: .7; } 14% { opacity: .1; } 24% { opacity: .85; } 30% { opacity: .35; } 100% { opacity: 1; }
  }
  @keyframes rp-luz-sube { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rp-luz-respira { 0%, 100% { opacity: 1; } 50% { opacity: .82; } }
  @keyframes rp-luz-apaga { to { opacity: 0; } }
  @keyframes rp-mota {
    0% { transform: translate(0, 0); opacity: .15; }
    50% { opacity: .9; }
    100% { transform: translate(var(--dx), var(--dy)); opacity: .3; }
  }
  #vista-ranking.rp-climax .podio .lugar.l1 .cuerpo::before { animation: rp-redoble 1.25s ease-in both; }
  @keyframes rp-redoble {
    0%, 30%, 55%, 76%, 92%, 100% { filter: brightness(1); }
    15% { filter: brightness(1.6); } 43% { filter: brightness(1.8); } 66% { filter: brightness(2); } 85% { filter: brightness(2.3); } 96% { filter: brightness(2.6); }
  }
  #vista-ranking .podio .lugar .ficha.cae.girar.climax { animation-delay: 1.2s; }
  #vista-ranking .podio .lugar.l1 .rp-onda { width: 95%; border-width: 4px; animation-delay: 2.3s; }
  #vista-ranking .podio .lugar.l1.destello-nombre .cuerpo { animation-delay: 2.3s; }
  #vista-ranking .podio .lugar .ficha.climax .corona { animation: rp-corona .6s cubic-bezier(.34, 1.56, .64, 1) 2.45s backwards; }
  @keyframes rp-corona {
    0% { transform: translate(-50%, -90px) rotate(-25deg); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translateX(-50%); opacity: 1; }
  }
  #vista-ranking .podio .lugar .ficha.climax .nombre { position: relative; animation: rp-placa .6s cubic-bezier(.3, 1.3, .5, 1) 2.6s backwards; }
  #vista-ranking .podio .lugar .ficha.climax .nombre::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .75) 50%, transparent 70%);
    animation: rp-brillo-placa 1s ease-in-out 3.2s both;
  }
  @keyframes rp-brillo-placa { 0% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  #vista-ranking .podio.temblor { animation: rp-temblor .5s ease-out; }
  @keyframes rp-temblor {
    0%, 100% { transform: none; } 15% { transform: translate(-6px, 3px); } 30% { transform: translate(5px, -3px); }
    45% { transform: translate(-4px, 2px); } 60% { transform: translate(3px, -1px); } 80% { transform: translate(-1px, 1px); }
  }
  #rp-escena .rp-confeti { position: fixed; inset: 0; z-index: 1002; pointer-events: none; overflow: hidden; }
  #rp-escena .rp-confeti i {
    position: absolute; top: -20px; width: 9px; height: 15px; opacity: 0;
    animation-name: rp-confeti; animation-timing-function: cubic-bezier(.3, .4, .6, 1); animation-fill-mode: both;
  }
  @keyframes rp-confeti {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), 105vh) rotate(var(--giro)); }
  }
  #vista-ranking .podio .lugar .ficha.cae { animation: rp-cae 1.1s cubic-bezier(.34, 1.2, .64, 1) both; }
  @keyframes rp-cae {
    0% { opacity: 0; transform: translateY(-70vh); }
    20% { opacity: 1; }
    80% { transform: translateY(14px); }
    100% { opacity: 1; transform: none; }
  }
  #vista-ranking .podio .lugar:has(.girar) { perspective: 800px; }
  #vista-ranking .podio .lugar .ficha.cae.girar { animation: rp-cae-giro 1.6s cubic-bezier(.34, 1.2, .64, 1) both; }
  @keyframes rp-cae-giro {
    0% { opacity: 0; transform: translateY(-70vh) rotateY(0deg); }
    15% { opacity: 1; }
    70% { transform: translateY(14px) rotateY(1080deg); }
    85% { transform: translateY(-8px) rotateY(1080deg); }
    100% { opacity: 1; transform: translateY(0) rotateY(1080deg); }
  }
  #rp-escena .rp-fuegos { position: fixed; inset: 0; z-index: 1001; pointer-events: none; overflow: hidden; }
  #rp-escena .rp-rafaga { position: absolute; width: 0; height: 0; }
  #rp-escena .rp-rafaga i {
    position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
    box-shadow: 0 0 8px 2px currentColor; animation: rp-chispa 1.3s ease-out both;
  }
  @keyframes rp-chispa {
    0% { opacity: 0; transform: translate(0, 0) scale(.3); }
    10% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); }
  }
  @media (prefers-reduced-motion: reduce) {
    #vista-ranking .revela, #vista-ranking .podio .lugar .ficha.cae, #vista-ranking .podio .lugar .ficha.cae.girar,
    #vista-ranking .podio .lugar .ficha.voltea .avatar, #vista-ranking .podio .lugar .ficha.voltea .nombre,
    #vista-ranking .podio .lugar .ficha.sin-nombre .avatar, #vista-ranking .podio .lugar.destello-nombre .cuerpo { animation: none; }
    #vista-ranking .podio .lugar .rp-onda, #rp-escena .rp-foco { display: none; }
    #vista-ranking .podio.temblor, #vista-ranking.rp-climax .podio .lugar.l1 .cuerpo::before,
    #vista-ranking .podio .lugar .ficha.climax .corona, #vista-ranking .podio .lugar .ficha.climax .nombre,
    #vista-ranking .podio .lugar .ficha.climax .nombre::after { animation: none; }
  }
  body.pantalla-grande #vista-ranking .rp-accion { border-color: rgba(0, 229, 255, .4); color: #00E5FF; background: rgba(7, 14, 70, .5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* Cambios desde el último refresco: la fila destella y aparece un "+N" que se desvanece.
     Solo se anima quien subió; en cada refresco sin cambios no pasa nada. */
  #vista-ranking .fila.subio { animation: rp-destello-p 1.6s ease both; }
  @keyframes rp-destello-p { 0% { background-color: var(--verde-suave); box-shadow: inset 4px 0 0 var(--verde); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
  /* El "+N" va pegado a la izquierda de los puntos, centrado en su línea, sea cual sea el largo de la cifra.
     Es absoluto (no ocupa lugar ni deja hueco al desvanecerse) y opaco, para leerse limpio si pisa el final del nombre. */
  #vista-ranking .rp-pts-linea { position: relative; }
  #vista-ranking .rp-rejilla .fila .delta {
    position: absolute; right: calc(100% + 10px); top: 0; bottom: 0; margin: auto 0; height: fit-content;
    background: #0B3A4C; border: 1px solid rgba(45, 204, 205, .55); line-height: 1.2;
  }
  #vista-ranking .delta {
    white-space: nowrap; pointer-events: none; padding: 2px 8px; border-radius: 10px;
    background: var(--verde-suave); color: var(--verde); font-size: 13px; font-style: normal; font-weight: 500;
    animation: rp-sube-p 2.4s ease both;
  }
  @keyframes rp-sube-p {
    0% { opacity: 0; transform: translateY(6px) scale(.8); }
    20% { opacity: 1; transform: none; }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-6px); }
  }

  /* Panel de ajustes (vive en #hoja, fuera de la vista) */
  #hoja .rp-ajustes .rp-campo { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  #hoja .rp-ajustes .rp-campo > span { font-size: 14px; color: var(--texto-2); }
  #hoja .rp-ctl { display: flex; align-items: center; gap: 12px; }
  #hoja .rp-ctl input[type="range"] { flex: 1; accent-color: var(--azul); }
  #hoja .rp-ctl input[type="number"] {
    width: 76px; padding: 6px 8px; border: 1px solid var(--borde); border-radius: 8px; background: transparent; color: inherit;
    text-align: right; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  #hoja .rp-ajustes .rp-grupo { margin: 22px 0 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-2); }
  #hoja .rp-ajustes .btn { margin-top: 14px; }
  #hoja .rp-check { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 15px; }
  #hoja .rp-check input { width: 20px; height: 20px; accent-color: var(--azul); }
  #hoja .rp-estado-ajustes { margin-top: 10px; font-size: 13px; color: var(--texto-2); min-height: 18px; }
  /* Tema escénico (docs/UX_UI_solo_para_vista_ranking.md): fondo de escenario con luz azul, acentos cian neón y
     medallas en metal. Es el único tema de la vista; los tokens de color de la pantalla se definen aquí. */
  body.pantalla-grande {
    --fondo: #070E46; --superficie: rgba(7, 14, 70, .6); --texto: #FFFFFF; --texto-2: #B8D8F8;
    --borde: rgba(0, 229, 255, .3); --borde-suave: rgba(184, 216, 248, .16);
    --azul: #00E5FF; --azul-suave: rgba(0, 229, 255, .12);
    --verde: #2DCCCD; --verde-suave: rgba(45, 204, 205, .18); --rojo: #FF8A80;
    background: radial-gradient(circle at 50% 30%, rgba(0, 19, 145, .5) 0%, rgba(0, 19, 145, .22) 35%, rgba(7, 14, 70, .98) 72%),
      linear-gradient(125deg, #070E46 0%, #001391 50%, #070E46 100%);
    background-attachment: fixed; color: var(--texto);
  }
  body.pantalla-grande #vista-ranking { font-family: Inter, system-ui, sans-serif; }

  body.pantalla-grande #vista-ranking .rp-ajustes-btn,
  body.pantalla-grande #vista-ranking .refrescar {
    border: 1px solid rgba(0, 229, 255, .4); color: #00E5FF; background: rgba(7, 14, 70, .5);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }

  /* Podio: halo azul detrás y pedestales de metal pulido (cilindros con tapa elíptica, como en el ejemplo de referencia).
     El halo va detrás de los pedestales (isolation + z-index -1): si se pinta encima, parecen de vidrio. */
  body.pantalla-grande #vista-ranking .podio { position: relative; isolation: isolate; }
  body.pantalla-grande #vista-ranking .podio::before {
    content: ''; position: absolute; left: -10%; right: -10%; top: -20%; bottom: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(ellipse at 50% 70%, rgba(0, 19, 145, .45) 0%, rgba(0, 19, 145, 0) 60%);
  }
  body.pantalla-grande #vista-ranking .lugar.oro {
    --m-disco: linear-gradient(135deg, #FFFDE8 0%, #FFE680 28%, #FFD84D 55%, #FFF3B0 72%, #C98A00 100%); --m-borde: #FFD700; --m-texto: #FFD700;
    --m-corona: #FFE066; --m-glow: rgba(255, 215, 0, .5); --m-acento: #FFE680; --m-canto: #7A4E00;
    --m-brillo: linear-gradient(100deg, #FFFDE8 0%, #FFE680 18%, #FFC400 38%, #A86E00 52%, #FFD84D 64%, #FFF3B0 78%, #C98A00 100%);
    --m-tapa: radial-gradient(ellipse at 50% 40%, #FFFDE8 0%, #FFE066 45%, #B57A00 100%);
  }
  body.pantalla-grande #vista-ranking .lugar.plata {
    --m-disco: linear-gradient(135deg, #FFFFFF 0%, #F1F4F7 28%, #D9E0E6 55%, #FFFFFF 72%, #8E99A3 100%); --m-borde: #C0C0C0; --m-texto: #E6EAEE;
    --m-corona: #DADCE0; --m-corona-borde: #7F8C8D; --m-glow: rgba(192, 192, 192, .4); --m-acento: #E6EAEE; --m-canto: #4F5861;
    --m-brillo: linear-gradient(100deg, #FFFFFF 0%, #F1F4F7 18%, #C9D1D8 38%, #6F7A84 52%, #D9E0E6 64%, #FFFFFF 78%, #8E99A3 100%);
    --m-tapa: radial-gradient(ellipse at 50% 40%, #FFFFFF 0%, #DDE3E9 45%, #7F8A94 100%);
  }
  body.pantalla-grande #vista-ranking .lugar.bronce {
    --m-disco: linear-gradient(135deg, #FFE9D6 0%, #F6B87E 28%, #E9A267 55%, #FFD9B5 72%, #9A5220 100%); --m-borde: #CD7F32; --m-texto: #F0B07A;
    --m-corona: #E09A5E; --m-glow: rgba(205, 127, 50, .5); --m-acento: #F6B87E; --m-canto: #5E2C0B;
    --m-brillo: linear-gradient(100deg, #FFE9D6 0%, #F6B87E 18%, #D9853F 38%, #7E3C10 52%, #E9A267 64%, #FFD9B5 78%, #9A5220 100%);
    --m-tapa: radial-gradient(ellipse at 50% 40%, #FFE9D6 0%, #F6B87E 45%, #9A5220 100%);
  }
  body.pantalla-grande #vista-ranking .lugar .nombre {
    display: inline-flex; align-items: center; gap: .4em; max-width: 100%; box-sizing: border-box; padding: 4px 12px; border-radius: 9999px;
    border: 2.5px solid transparent;
    background: linear-gradient(180deg, #071936 0%, #03091A 100%) padding-box, var(--m-brillo, var(--m-borde)) border-box;
    box-shadow: 0 0 14px var(--m-glow), inset 0 0 8px rgba(0, 0, 0, .5);
    font-family: Montserrat, sans-serif; font-size: var(--rp-nombre-top); font-weight: 700; letter-spacing: .02em;
    text-transform: uppercase; color: #FFFFFF;
  }
  /* Los nombres del top tienen su propio ajuste (--rp-nombre-top): no se achican con el podio; el 1.º va un 25 % más grande */
  body.pantalla-grande #vista-ranking .lugar.l1 .nombre { font-size: calc(var(--rp-nombre-top) * 1.25); }
  /* Avatar como moneda 3D: borde metálico en relieve, brillo especular arriba y bisel en sombra */
  body.pantalla-grande #vista-ranking .lugar .avatar {
    box-sizing: border-box; color: #070E46; font-family: Montserrat, sans-serif; font-weight: 800; text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
    border: calc(4px * var(--rp-escala)) solid transparent;
    background-image: radial-gradient(circle at 34% 24%, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, 0) 38%), var(--m-disco), var(--m-brillo);
    background-origin: padding-box, padding-box, border-box;
    background-clip: padding-box, padding-box, border-box;
    background-repeat: no-repeat;
    box-shadow: inset 0 2px 3px rgba(255, 255, 255, .7), inset 0 -4px 6px rgba(0, 0, 0, .35), 0 8px 12px rgba(0, 0, 0, .45), 0 0 22px var(--m-glow);
  }
  body.pantalla-grande #vista-ranking .lugar.l1 .avatar { box-shadow: inset 0 2px 3px rgba(255, 255, 255, .7), inset 0 -4px 6px rgba(0, 0, 0, .35), 0 8px 12px rgba(0, 0, 0, .45), 0 0 36px var(--m-glow); }
  body.pantalla-grande #vista-ranking .lugar .corona { filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
  /* Cilindro de metal: la luz horizontal del metal, con caída vertical; la base elíptica se curva hacia abajo */
  body.pantalla-grande #vista-ranking .lugar .cuerpo {
    color: var(--m-texto); font-family: Montserrat, sans-serif; font-weight: 900;
    border-radius: 0 0 50% 50% / 0 0 var(--rp-tapa) var(--rp-tapa);
    background: linear-gradient(180deg, rgba(255, 255, 255, .12) 0%, rgba(255, 255, 255, 0) 30%, rgba(7, 14, 70, .75) 100%), linear-gradient(90deg, #070E46 0%, #001391 20%, rgba(255, 255, 255, .18) 46%, #001391 72%, #070E46 100%);
    box-shadow: inset 0 -14px 22px rgba(0, 0, 0, .45), 0 22px 34px -10px rgba(0, 0, 0, .8), 0 0 34px -8px var(--m-glow);
  }
  body.pantalla-grande #vista-ranking .lugar.l1 .cuerpo { box-shadow: inset 0 -14px 22px rgba(0, 0, 0, .45), 0 22px 34px -10px rgba(0, 0, 0, .8), 10px 0 14px -6px rgba(0, 0, 0, .6), -10px 0 14px -6px rgba(0, 0, 0, .6), 0 0 34px -8px var(--m-glow); }
  /* Sombra de contacto bajo cada pedestal, sobre el escenario */
  body.pantalla-grande #vista-ranking .lugar .cuerpo::after {
    content: ''; position: absolute; left: 6%; right: 6%; bottom: calc(var(--rp-tapa) * -.6); height: 14px;
    border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0, 0, 0, .7) 0%, rgba(0, 0, 0, 0) 70%); filter: blur(3px);
  }
  /* Tapa elíptica: el borde superior del cilindro, con la luz cenital */
  body.pantalla-grande #vista-ranking .lugar .cuerpo::before {
    content: ''; position: absolute; left: calc(-4px * var(--rp-escala)); right: calc(-4px * var(--rp-escala)); top: calc(var(--rp-tapa) * -.5); height: var(--rp-tapa);
    border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, 0) 45%), var(--m-tapa);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6), inset 0 -2px 0 var(--m-canto), 0 3px 6px rgba(0, 0, 0, .5);
  }
  body.pantalla-grande #vista-ranking .lugar { filter: drop-shadow(0 14px 16px rgba(0, 0, 0, .45)); }
  body.pantalla-grande #vista-ranking .lugar.l1 { filter: drop-shadow(0 14px 16px rgba(0, 0, 0, .45)) drop-shadow(0 0 18px rgba(0, 0, 0, .55)); }
  /* Placa del pedestal: número de metal oscuro entre dos ramas de laurel, centrado; escala con --rp-escala */
  body.pantalla-grande #vista-ranking .lugar.l1 { --rp-num: calc(88px * var(--rp-escala)); }
  body.pantalla-grande #vista-ranking .lugar.l2 { --rp-num: calc(62px * var(--rp-escala)); }
  body.pantalla-grande #vista-ranking .lugar.l3 { --rp-num: calc(50px * var(--rp-escala)); }
  body.pantalla-grande #vista-ranking .lugar .rp-placa {
    display: flex; align-items: center; justify-content: center; gap: calc(var(--rp-num) * .08);
  }
  body.pantalla-grande #vista-ranking .lugar .rp-num {
    font-size: var(--rp-num); line-height: 1; font-weight: 900; color: var(--m-acento);
    text-shadow: 0 2px 0 rgba(0, 0, 0, .45), 0 0 12px rgba(0, 0, 0, .35);
  }
  body.pantalla-grande #vista-ranking .lugar .rp-rama {
    flex: none; height: calc(var(--rp-num) * 1.2); width: calc(var(--rp-num) * .58); overflow: visible;
    color: var(--m-acento); filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .5));
  }
  body.pantalla-grande #vista-ranking .lugar .rp-rama:last-child { transform: scaleX(-1); }

  /* El nombre se recorta con puntos suspensivos */
  body.pantalla-grande #vista-ranking .lugar .nombre .rp-nombre { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Puntos y tiempo como texto plano, con sombra para dar profundidad sobre el metal */
  body.pantalla-grande #vista-ranking .lugar .pts {
    font-family: Montserrat, sans-serif; font-size: calc(var(--rp-pts-top) * var(--rp-escala)); font-weight: 800; color: #FFFFFF; font-variant-numeric: tabular-nums;
    line-height: 1.1; text-shadow: 0 2px 0 rgba(0, 0, 0, .45), 0 0 10px rgba(0, 0, 0, .35);
  }
  body.pantalla-grande #vista-ranking .lugar .rp-desempate {
    padding: 0; border: 0; background: none; color: #B8D8F8;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .45), 0 0 8px rgba(0, 0, 0, .35);
  }
  body.pantalla-grande #vista-ranking .lugar.l1 .pts { font-size: calc(var(--rp-pts-top) * 1.25 * var(--rp-escala)); }

  /* Revelación, paso de los puntos del podio: "? pts" tenue hasta su turno; luego el número cuenta desde 0 en el
     color del metal. Al llegar, el número da un golpe, el pedestal destella y recién entonces sube el tiempo. */
  #vista-ranking .metricas.cuenta:not(.contando) .pts { opacity: .4; }
