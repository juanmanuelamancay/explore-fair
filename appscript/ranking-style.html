<style>
  /* Vista RANKING: podio, lista y fila propia. */
  .rank-cab { margin-bottom: 20px; }
  .rank-cab .rank-titulo { font-size: 24px; font-weight: 400; }
  .podio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: end; margin-bottom: 20px; padding-top: 16px; }
  .lugar { text-align: center; min-width: 0; }
  .lugar .avatar { display: grid; margin: 0 auto 6px; width: 48px; height: 48px; }
  .l1 .avatar { width: 60px; height: 60px; font-size: 18px; }
  .l1 .corona { width: 28px; height: 21px; top: -16px; }
  .lugar .nombre { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lugar .pts { font-size: 13px; color: var(--texto-2); }
  .lugar .base { margin-top: 8px; border-radius: 12px 12px 0 0; background: var(--m-fondo, var(--superficie)); font-size: 20px; font-weight: 700; display: grid; place-items: center; color: var(--m-texto, var(--texto-2)); }
  .l1 .base { height: 72px; }
  .l2 .base { height: 52px; }
  .l3 .base { height: 40px; }
  .lugar.yo .nombre { color: var(--azul); }

  .fila .pos { width: 24px; text-align: center; font-weight: 500; color: var(--texto-2); flex: none; }
  .fila.yo { background: var(--azul-suave); }
  .fila.yo .pos { color: var(--azul); }
  .fila.con-corona { padding-top: 18px; }   /* deja sitio a la corona sobre el avatar */

  /* Claridad de cada fila: puesto en círculo, nombre, y puntos a la derecha con su unidad */
  #vista-ranking .fila { padding: 10px 16px 10px 12px; }
  #vista-ranking .fila .pos {
    width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--superficie); border: 1px solid var(--borde-suave); color: var(--texto-2); font-size: 14px; font-weight: 500;
  }
  #vista-ranking .fila.yo .pos { background: var(--azul); border-color: var(--azul); color: #fff; }
  #vista-ranking .fila .puntos-fila { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
  #vista-ranking .fila .puntos-fila b { font-size: 22px; font-weight: 500; color: var(--azul); }
  #vista-ranking .fila .puntos-fila small { margin-top: 3px; font-size: 11px; color: var(--texto-2); text-transform: uppercase; letter-spacing: .04em; }

  /* Cambios desde el último refresco: la fila destella y aparece un "+N" que se desvanece.
     Solo se anima quien subió; en cada refresco sin cambios no pasa nada. */
  .fila.subio { animation: rank-destello 1.6s ease both; }
  @keyframes rank-destello { 0% { background-color: var(--verde-suave); box-shadow: inset 4px 0 0 var(--verde); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
  /* El "+N" va en absoluto: no ocupa lugar y no deja hueco cuando se desvanece */
  .fila { position: relative; }
  .lugar { position: relative; }
  .fila .delta { position: absolute; right: 60px; top: 50%; margin-top: -11px; }
  .lugar .delta { top: -26px; left: 50%; margin-left: -20px; }
  .delta {
    white-space: nowrap; pointer-events: none; padding: 2px 8px; border-radius: 10px;
    background: var(--verde-suave); color: var(--verde); font-size: 13px; font-style: normal; font-weight: 500;
    animation: rank-sube 2.4s ease both;
  }
  @keyframes rank-sube {
    0% { opacity: 0; transform: translateY(6px) scale(.8); }
    20% { opacity: 1; transform: none; }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce) { .fila.subio, .delta { animation: none; } }

  .mi-puesto { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 4; pointer-events: none; }
  .mi-puesto .fila {
    max-width: 448px; margin: 0 16px 8px; border: 0; border-radius: 16px;
    box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
  }
  @media (min-width: 480px) { .mi-puesto .fila { margin: 0 auto 8px; } }
</style>
