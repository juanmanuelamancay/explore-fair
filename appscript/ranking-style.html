<style>
  /* Vista RANKING, pensada para proyectar en una pantalla grande.
     Las reglas están limitadas a esta vista (o al panel de ajustes en #hoja).
     Los tamaños salen de variables CSS que se mueven en vivo desde el panel de ajustes. */
  .rank-cab { margin-bottom: 20px; }
  body.pantalla-grande #app { max-width: none; padding: 20px 32px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
  #vista-ranking {
    --rp-cols: 6; --rp-alto: 64px; --rp-espacio: 10px; --rp-fuente: 16px; --rp-puntos: 22px; --rp-escala: 1; --rp-ancho-top: 66%;
    min-height: calc(100vh - var(--nav-h) - 110px); display: flex; flex-direction: column;
  }
  #vista-ranking .rank-titulo { font-size: 32px; }
  #vista-ranking .rp-hora { font-variant-numeric: tabular-nums; align-self: flex-end; padding-bottom: 6px; }
  #vista-ranking .rp-ajustes-btn {
    width: 44px; height: 44px; border-radius: 50%; flex: none; align-self: center;
    display: grid; place-items: center; border: 1px solid var(--borde); color: var(--texto-2);
  }
  #vista-ranking .rp-ajustes-btn:active { background: var(--superficie); }
  /* El contenido va centrado con un ancho máximo: en una pantalla grande no se estira de borde a borde */
  #vista-ranking #rp-contenido { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1400px; margin: 0 auto; }

  /* Podio: su ancho y su escala (--rp-ancho-top, --rp-escala) son propios; no dependen de las columnas ni de las filas */
  #vista-ranking .podio {
    --rp-podio: 3; width: calc(var(--rp-ancho-top) * var(--rp-podio) / 3); margin: 0 auto 20px; padding-top: 16px;
    display: grid; grid-template-columns: repeat(var(--rp-podio), 1fr); gap: 8px; align-items: end;
  }
  #vista-ranking .lugar { text-align: center; min-width: 0; position: relative; }
  #vista-ranking .lugar .avatar {
    display: grid; margin: 0 auto calc(10px * var(--rp-escala)); width: calc(84px * var(--rp-escala)); height: calc(84px * var(--rp-escala));
    font-size: calc(28px * var(--rp-escala));
  }
  #vista-ranking .lugar.l1 .avatar {
    position: relative; z-index: 2; width: calc(112px * var(--rp-escala)); height: calc(112px * var(--rp-escala));
    font-size: calc(40px * var(--rp-escala)); animation: rp-brillo-oro 2.8s ease-in-out infinite;
  }
  #vista-ranking .lugar.l1 .avatar::before, #vista-ranking .lugar.l1 .avatar::after {
    content: ''; position: absolute; z-index: 3; width: calc(19px * var(--rp-escala)); height: calc(19px * var(--rp-escala)); background: #fbbc04;
    clip-path: polygon(50% 0, 62% 37%, 100% 50%, 62% 63%, 50% 100%, 38% 63%, 0 50%, 38% 37%);
    filter: drop-shadow(0 0 5px rgba(249, 171, 0, .8)); animation: rp-estrella-oro 1.8s ease-in-out infinite;
  }
  #vista-ranking .lugar.l1 .avatar::before { top: 13%; right: -12%; }
  #vista-ranking .lugar.l1 .avatar::after {
    left: -11%; bottom: 14%; width: calc(15px * var(--rp-escala)); height: calc(15px * var(--rp-escala)); background: #e37400;
    filter: drop-shadow(0 0 5px rgba(227, 116, 0, .75)); animation-delay: .9s;
  }
  #vista-ranking .lugar .corona { width: calc(28px * var(--rp-escala)); height: calc(21px * var(--rp-escala)); top: calc(-20px * var(--rp-escala)); }
  #vista-ranking .lugar.l1 .corona { width: calc(40px * var(--rp-escala)); height: calc(30px * var(--rp-escala)); top: calc(-28px * var(--rp-escala)); }
  #vista-ranking .lugar .nombre { font-size: calc(22px * var(--rp-escala)); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vista-ranking .lugar.l1 .nombre { font-size: calc(26px * var(--rp-escala)); }
  #vista-ranking .lugar .pts { font-size: calc(19px * var(--rp-escala)); color: var(--texto-2); margin-top: calc(2px * var(--rp-escala)); }
  #vista-ranking .lugar .base {
    margin-top: calc(10px * var(--rp-escala)); border-radius: 12px 12px 0 0; background: var(--m-fondo, var(--superficie));
    font-size: calc(36px * var(--rp-escala)); font-weight: 700; display: grid; place-items: center; color: var(--m-texto, var(--texto-2));
  }
  #vista-ranking .lugar.l1 .base { height: calc(150px * var(--rp-escala)); font-size: calc(52px * var(--rp-escala)); }
  #vista-ranking .lugar.l2 .base { height: calc(110px * var(--rp-escala)); }
  #vista-ranking .lugar.l3 .base { height: calc(84px * var(--rp-escala)); }
  #vista-ranking .lugar .delta { top: calc(-26px * var(--rp-escala)); left: 50%; margin-left: -20px; }
  @keyframes rp-brillo-oro {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(249, 171, 0, 0)); }
    50% { filter: drop-shadow(0 0 16px rgba(249, 171, 0, .55)); }
  }
  @keyframes rp-estrella-oro {
    0%, 100% { opacity: .45; transform: scale(.65) rotate(0); }
    50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
  }

  /* Cuadrícula de puestos del 5.º en adelante: columnas, alto y espacio configurables */
  #vista-ranking .rp-cuerpo { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #vista-ranking .rp-rejilla {
    flex: 1 1 0; min-height: 0; overflow: hidden;
    display: grid; grid-template-columns: repeat(var(--rp-cols), minmax(0, 1fr));
    grid-auto-rows: var(--rp-alto); gap: var(--rp-espacio); align-content: start;
  }
  /* Cada tarjeta separa sus datos: posición en círculo, nombre, y puntos a la derecha */
  #vista-ranking .rp-rejilla .fila {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 10px;
    height: var(--rp-alto); min-height: var(--rp-alto); font-size: var(--rp-fuente);
    border: 1px solid var(--borde); border-radius: 16px; background: var(--fondo);
  }
  #vista-ranking .rp-rejilla .fila .pos {
    width: calc(var(--rp-alto) * .53); height: calc(var(--rp-alto) * .53); border-radius: 50%; flex: none;
    display: grid; place-items: center; background: var(--superficie); border: 1px solid var(--borde-suave);
    color: var(--texto-2); font-size: calc(var(--rp-fuente) * .85); font-weight: 500;
  }
  #vista-ranking .rp-rejilla .fila .quien { flex: 1; min-width: 0; }
  #vista-ranking .rp-rejilla .fila .quien b { display: block; font-size: var(--rp-fuente); font-weight: 500; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vista-ranking .rp-puntos { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
  #vista-ranking .rp-puntos b { font-size: var(--rp-puntos); font-weight: 500; color: var(--azul); }
  #vista-ranking .rp-puntos small { margin-top: 3px; font-size: calc(var(--rp-puntos) * .5); color: var(--texto-2); text-transform: uppercase; letter-spacing: .04em; }

  /* Cambios desde el último refresco: la fila destella y aparece un "+N" que se desvanece.
     Solo se anima quien subió; en cada refresco sin cambios no pasa nada. */
  #vista-ranking .fila.subio { animation: rp-destello-p 1.6s ease both; }
  @keyframes rp-destello-p { 0% { background-color: var(--verde-suave); box-shadow: inset 4px 0 0 var(--verde); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
  /* El "+N" va en absoluto: no ocupa lugar y no deja hueco cuando se desvanece */
  #vista-ranking .rp-rejilla .fila .delta { position: absolute; right: calc(var(--rp-puntos) * 3); top: 50%; margin-top: -11px; }
  #vista-ranking .delta {
    white-space: nowrap; pointer-events: none; padding: 2px 8px; border-radius: 10px;
    background: var(--verde-suave); color: var(--verde); font-size: 13px; font-style: normal; font-weight: 500;
    animation: rp-sube-p 2.4s ease both;
  }
  @keyframes rp-sube-p {
    0% { opacity: 0; transform: translateY(6px) scale(.8); }
    20% { opacity: 1; transform: none; }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-6px); }
  }

  #vista-ranking .rp-pie { margin-top: 10px; text-align: center; color: var(--texto-2); font-size: 14px; }

  /* Panel de ajustes (vive en #hoja, fuera de la vista) */
  #hoja .rp-ajustes .rp-campo { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  #hoja .rp-ajustes .rp-campo > span { font-size: 14px; color: var(--texto-2); }
  #hoja .rp-ctl { display: flex; align-items: center; gap: 12px; }
  #hoja .rp-ctl input[type="range"] { flex: 1; accent-color: var(--azul); }
  #hoja .rp-ctl output { min-width: 56px; text-align: right; font-size: 16px; font-variant-numeric: tabular-nums; }
  #hoja .rp-ajustes .btn { margin-top: 14px; }
  #hoja .rp-check { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 15px; }
  #hoja .rp-check input { width: 20px; height: 20px; accent-color: var(--azul); }
  #hoja .rp-estado-ajustes { margin-top: 10px; font-size: 13px; color: var(--texto-2); min-height: 18px; }
  #hoja:has(.rp-ajustes) { background: rgba(255, 255, 255, .72); border: 1px solid rgba(255, 255, 255, .7); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  #hoja:has(.rp-ajustes input:focus), #hoja:has(.rp-ajustes input:active) {
    background: rgba(255, 255, 255, .4); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  body.hoja-abierta:has(#hoja .rp-ajustes) #velo { background: rgba(32, 33, 36, .08); }
  body.hoja-abierta:has(#hoja .rp-ajustes input:focus) #velo,
  body.hoja-abierta:has(#hoja .rp-ajustes input:active) #velo { background: rgba(32, 33, 36, .02); }

  /* Modo oscuro de la pantalla: cambia los colores mientras la vista está abierta */
  body.pantalla-grande.pantalla-oscura {
    --fondo: #0f1419; --superficie: #1b232b; --texto: #e8eaed; --texto-2: #9aa0a6;
    --borde: #3c4650; --borde-suave: #263238; --azul: #8ab4f8; --azul-suave: rgba(138, 180, 248, .16);
    --verde: #81c995; --verde-suave: rgba(129, 201, 149, .18); --rojo: #f28b82;
    background: #0f1419; color: #e8eaed;
  }
  body.pantalla-grande.pantalla-oscura #vista-ranking .oro { --m-fondo: #3a2e10; --m-texto: #fdd663; --m-corona: #fbbc04; }
  body.pantalla-grande.pantalla-oscura #vista-ranking .plata { --m-fondo: #2a2f35; --m-texto: #e8eaed; --m-corona: #dadce0; --m-corona-borde: #9aa0a6; }
  body.pantalla-grande.pantalla-oscura #vista-ranking .bronce { --m-fondo: #3a2316; --m-texto: #f0a875; --m-corona: #d98e5a; }
  body.pantalla-grande.pantalla-oscura #hoja:has(.rp-ajustes) { background: rgba(15, 20, 25, .76); border-color: rgba(255, 255, 255, .12); }
  body.pantalla-grande.pantalla-oscura #hoja:has(.rp-ajustes input:focus),
  body.pantalla-grande.pantalla-oscura #hoja:has(.rp-ajustes input:active) { background: rgba(15, 20, 25, .42); }

  /* Modo pantalla: sin barra de navegación, el ranking ocupa todo el alto */
  body.pantalla-grande.sin-menu #nav { display: none !important; }
  body.pantalla-grande.sin-menu #app { padding-bottom: 24px; }

  @media (max-width: 899px) {
    body.pantalla-grande #app { padding: 16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
    #vista-ranking .rank-titulo { font-size: 26px; }
    #vista-ranking .rp-rejilla { grid-template-columns: 1fr; }
    #vista-ranking .podio { width: 100%; gap: 4px; }
    #vista-ranking .lugar .avatar { width: calc(60px * var(--rp-escala)); height: calc(60px * var(--rp-escala)); font-size: calc(20px * var(--rp-escala)); }
    #vista-ranking .lugar.l1 .avatar { width: calc(76px * var(--rp-escala)); height: calc(76px * var(--rp-escala)); font-size: calc(26px * var(--rp-escala)); }
    #vista-ranking .lugar .nombre { font-size: calc(15px * var(--rp-escala)); }
    #vista-ranking .lugar.l1 .nombre { font-size: calc(17px * var(--rp-escala)); }
    #vista-ranking .lugar .pts { font-size: calc(14px * var(--rp-escala)); }
  }
  @media (prefers-reduced-motion: reduce) {
    #vista-ranking .fila.subio, #vista-ranking .delta,
    #vista-ranking .lugar.l1 .avatar, #vista-ranking .lugar.l1 .avatar::before,
    #vista-ranking .lugar.l1 .avatar::after { animation: none; }
  }
</style>
