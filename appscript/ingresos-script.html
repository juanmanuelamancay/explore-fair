<script>
(() => {
  const lista = $('ingresos-lista');
  const total = $('ingresos-total');
  $('ingresos-guia-icono').innerHTML = svg(ICONO.gente, 18);
  const ZONA = 'America/Lima';
  // Fechas y horas en hora de Lima, sin importar la zona del dispositivo.
  const partesLima = ms => Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: ZONA, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(ms)).map(p => [p.type, p.value]));
  const claveDia = ms => { const p = partesLima(ms); return p.year + '-' + p.month + '-' + p.day; };
  const esHoy = ms => claveDia(ms) === claveDia(Date.now());
  const fechaCorta = ms => { const p = partesLima(ms); return p.day + ' - ' + p.month + ' - ' + p.year; };
  const horaCorta = ms => new Date(ms).toLocaleTimeString('es', { timeZone: ZONA, hour: '2-digit', minute: '2-digit', hour12: false });
  const cuantos = n => n + (n === 1 ? ' ingreso' : ' ingresos');
  // "JUAN manuel perez" -> "Juan Manuel Perez"
  const nombrePropio = t => String(t || '').toLocaleLowerCase('es').replace(/\S+/g, p => p.charAt(0).toLocaleUpperCase('es') + p.slice(1));
  let datos = null;

  function mostrar() {
    if (!datos) App.cargando(lista);
    cargar();
  }

  function cargar() {
    return servidor('obtenerIngresos').then(r => {
      datos = r;
      pintar();
    }).catch(() => {
      if (datos) toast('No pudimos actualizar los ingresos.');
      else App.error(lista, cargar);
    });
  }

  /** Un desplegable por día, de la más reciente a la más antigua. Cada uno dice cuántos entraron ese día; al abrirlo, nombre y hora. */
  function pintar() {
    total.textContent = datos.total;
    if (!datos.personas.length) {
      lista.innerHTML = `<div class="estado"><div class="icono">${svg(ICONO.gente, 32)}</div>
        <h2>Todavía nadie ha entrado</h2><p>Aparecerán aquí en cuanto abran la app.</p></div>`;
      return;
    }
    // Al refrescar, cada día conserva si el usuario lo dejó abierto; por defecto todos van colapsados.
    const estaba = {};
    lista.querySelectorAll('details[data-clave]').forEach(d => { estaba[d.dataset.clave] = d.open; });

    const dias = [];
    datos.personas.forEach(p => {
      const ultimo = dias[dias.length - 1];
      const clave = p.ms ? claveDia(p.ms) : 'sin-fecha';
      if (ultimo && ultimo.clave === clave) ultimo.personas.push(p);
      else dias.push({ clave: clave, ms: p.ms, personas: [p] });
    });
    lista.innerHTML = dias.map(d => `
      <details class="dia-ingresos" data-clave="${d.clave}" ${estaba[d.clave] ? 'open' : ''}>
        <summary>
          <span class="dia-fecha">${!d.ms ? 'Sin fecha' : esHoy(d.ms) ? 'Hoy' : fechaCorta(d.ms)}</span>
          <span class="dia-cuenta tnum">${cuantos(d.personas.length)}</span>
        </summary>
        <ul class="lista filas">${d.personas.map(p => `
          <li class="fila"><span class="quien"><b>${esc(nombrePropio(p.nombre))}</b></span><span class="hora tnum">${p.ms ? horaCorta(p.ms) : '–'}</span></li>`).join('')}
        </ul>
      </details>`).join('');
  }

  // Sin botón de actualizar: cada vez que se abre la pestaña, la lista se vuelve a leer.
  App.registrar('ingresos', { alMostrar: mostrar });
})();
</script>
