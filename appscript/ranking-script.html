<script>
(() => {
  const SEGUNDOS_MINIMOS_DE_REFRESCO = 10;
  const RETRASO_DE_GUARDADO_MS = 700;   // espera a que terminen los movimientos del deslizador antes de escribir en Config
  // Preset de la pantalla. Se guarda en la hoja Config (claves rp_*); si no hay nada, se usan estos valores.
  // El top (escala y ancho) tiene sus propios ajustes: las columnas y las filas no lo afectan.
  // Los mismos valores que CONFIG_DEFECTO (datos.gs): se usan mientras no llega el preset de la hoja Config.
  const AJUSTES_DEFECTO = {
    personas: 0, columnas: 3, filas: 0, alto: 64, espacio: 10, fuente: 16, puntos: 22, tiempo: 13,
    escala: 100, anchoTop: 52, nombreTop: 16, ptsTop: 18, anchoContenido: 100, margen: 5, resumen: 20,
    ocultarMenu: false, achicarTop: true,
  };
  // Interruptores del panel (sí o no).
  const INTERRUPTORES = [
    { clave: 'ocultarMenu', etiqueta: 'Ocultar menú de navegación (queda solo el ranking)' },
    { clave: 'achicarTop', etiqueta: 'Achicar el top si no entran 3 filas de la lista' },
  ];
  // Los mismos topes que RANGOS_PANTALLA_ (ranking.gs): amplios a propósito, cada pantalla se ajusta a su gusto.
  // El deslizador recorre todo el rango; para un valor exacto se escribe en la casilla.
  const CONTROLES = [
    { grupo: 'Lista' },
    { clave: 'columnas', etiqueta: 'Columnas', min: 1, max: 20, paso: 1 },
    { clave: 'filas', etiqueta: 'Filas (0 = las que quepan)', min: 0, max: 100, paso: 1 },
    { clave: 'personas', etiqueta: 'Personas por pantalla (0 = lo que quepa)', min: 0, max: 2000, paso: 1 },
    { clave: 'alto', etiqueta: 'Alto de cada fila (px)', min: 20, max: 400, paso: 1 },
    { clave: 'espacio', etiqueta: 'Espacio entre filas (px)', min: 0, max: 120, paso: 1 },
    { clave: 'fuente', etiqueta: 'Tamaño de nombres (px)', min: 6, max: 120, paso: 1 },
    { clave: 'puntos', etiqueta: 'Tamaño de puntos (px)', min: 6, max: 200, paso: 1 },
    { clave: 'tiempo', etiqueta: 'Tamaño del tiempo de desempate (px)', min: 6, max: 80, paso: 1 },
    { grupo: 'Top' },
    { clave: 'escala', etiqueta: 'Tamaño del top (%)', min: 10, max: 500, paso: 5 },
    { clave: 'anchoTop', etiqueta: 'Ancho del top (% del contenido)', min: 10, max: 100, paso: 1 },
    { clave: 'nombreTop', etiqueta: 'Tamaño de nombres (px; el 1.º, un 25 % más)', min: 6, max: 160, paso: 1 },
    { clave: 'ptsTop', etiqueta: 'Tamaño de puntos (px; el 1.º, un 25 % más)', min: 6, max: 200, paso: 1 },
    { grupo: 'Pantalla' },
    { clave: 'anchoContenido', etiqueta: 'Ancho del contenido (% de la pantalla)', min: 20, max: 100, paso: 1 },
    { clave: 'margen', etiqueta: 'Margen de seguridad en los bordes (%; súbelo si la pantalla recorta)', min: 0, max: 30, paso: 1 },
    { clave: 'resumen', etiqueta: 'Tamaño del contador de participantes (px; 0 lo oculta)', min: 0, max: 120, paso: 1 },
  ];
  const contenido = $('rp-contenido');
  const vista = $('vista-ranking');
  let ajustes = { ...AJUSTES_DEFECTO };
  let ajustesPendientes = false;        // hay cambios que todavía no llegaron a Config: no se pisan con lo del servidor
  let temporizadorGuardado = null;
  let filas = null;
  let intervalo = null;
  let anteriores = null;               // nombre -> puntos de la última vez que se pintó
  let comparando = null;               // solo mientras se pinta: sirve para destacar lo que subió
  let enPantalla = false;
  let animarPodio = false;             // la entrada en resorte corre solo al mostrar la pantalla
  let finEntrada = null;
  let revelacion = null;               // { pasos, hecho, revelados }: solo mientras se revela
  let recien = new Set();              // puestos que acaba de revelar el último clic
  let finRecien = null;
  let recienTipo = null;
  let ultimoPuestoVisible = 0;         // último puesto que la cuadrícula llega a pintar

  /** Lleva los ajustes a las variables CSS de la vista: los tamaños cambian al instante. */
  function aplicarEstilos() {
    const estilo = vista.style;
    estilo.setProperty('--rp-cols', ajustes.columnas);
    estilo.setProperty('--rp-alto', ajustes.alto + 'px');
    estilo.setProperty('--rp-espacio', ajustes.espacio + 'px');
    estilo.setProperty('--rp-fuente', ajustes.fuente + 'px');
    estilo.setProperty('--rp-puntos', ajustes.puntos + 'px');
    estilo.setProperty('--rp-escala', ajustes.escala / 100);
    // La escala del ajuste, sin el achique por alto: el ancho del podio se queda con esta.
    estilo.setProperty('--rp-escala-base', ajustes.escala / 100);
    estilo.setProperty('--rp-ancho-top', ajustes.anchoTop + '%');
    estilo.setProperty('--rp-tiempo', ajustes.tiempo + 'px');
    estilo.setProperty('--rp-nombre-top', ajustes.nombreTop + 'px');
    estilo.setProperty('--rp-pts-top', ajustes.ptsTop + 'px');
    estilo.setProperty('--rp-ancho-contenido', ajustes.anchoContenido + '%');
    estilo.setProperty('--rp-resumen', ajustes.resumen + 'px');
    vista.classList.toggle('sin-resumen', !ajustes.resumen);
    // El margen de seguridad va en el body porque lo usa #app, que envuelve a la vista. Se quita al salir.
    if (enPantalla) {
      document.body.style.setProperty('--rp-mv', ajustes.margen + 'vh');
      document.body.style.setProperty('--rp-mh', ajustes.margen + 'vw');
    }
    // La barra de navegación solo se oculta mientras esta vista está abierta.
    document.body.classList.toggle('sin-menu', enPantalla && !!ajustes.ocultarMenu);
  }

  /** Un cambio del panel: se ve al momento y se guarda en Config poco después. */
  function cambiarAjuste(clave, valor) {
    ajustes[clave] = valor;
    ajustesPendientes = true;
    aplicarEstilos();
    if (filas) pintar();
    guardarEnConfig();
  }

  function estadoDeAjustes(texto) {
    const el = $('rp-estado-ajustes');
    if (el) el.textContent = texto;
  }

  function guardarEnConfig() {
    clearTimeout(temporizadorGuardado);
    estadoDeAjustes('Guardando en la hoja Config…');
    temporizadorGuardado = setTimeout(() => {
      servidor('guardarAjustesPantalla', ajustes)
        .then(() => { ajustesPendientes = false; estadoDeAjustes('Guardado en la hoja Config'); })
        .catch(error => estadoDeAjustes('No se pudo guardar: ' + (error && error.message ? error.message : 'inténtalo otra vez')));
    }, RETRASO_DE_GUARDADO_MS);
  }

  /** Panel de ajustes: deslizadores que se aplican al momento y se guardan en la hoja Config. */
  function abrirAjustes() {
    const hoja = App.abrirHoja(`
      <div class="hoja-texto rp-ajustes">
        <h2>Ajustes de pantalla</h2>
        <p>Los cambios se ven al momento y se guardan en la hoja Config. Cada pantalla los toma al actualizarse.</p>
        ${CONTROLES.map(c => c.grupo ? `<h3 class="rp-grupo">${c.grupo}</h3>` : `
          <label class="rp-campo">
            <span>${c.etiqueta}</span>
            <div class="rp-ctl">
              <input type="range" data-clave="${c.clave}" min="${c.min}" max="${c.max}" step="${c.paso}" value="${ajustes[c.clave]}" aria-label="${c.etiqueta}">
              <input type="number" min="${c.min}" max="${c.max}" step="1" value="${ajustes[c.clave]}" inputmode="numeric" aria-label="${c.etiqueta} (valor exacto)">
            </div>
          </label>`).join('')}
        ${INTERRUPTORES.map(i => `
          <label class="rp-check">
            <input type="checkbox" data-flag="${i.clave}" ${ajustes[i.clave] ? 'checked' : ''}>
            <span>${i.etiqueta}</span>
          </label>`).join('')}
        <p class="rp-estado-ajustes" id="rp-estado-ajustes" aria-live="polite">${ajustesPendientes ? 'Guardando en la hoja Config…' : ''}</p>
        <button class="btn texto" type="button" id="rp-restablecer">Restablecer valores</button>
        <button class="btn" type="button" data-cerrar>Listo</button>
      </div>`);

    // Deslizador y casilla van juntos: mover uno actualiza el otro. La casilla acepta cualquier valor del rango
    // (el deslizador redondea al paso) y lo corrige al salir si se escribió algo fuera.
    hoja.querySelectorAll('input[data-clave]').forEach(entrada => {
      const casilla = entrada.nextElementSibling;
      entrada.addEventListener('input', () => {
        casilla.value = entrada.value;
        cambiarAjuste(entrada.dataset.clave, Number(entrada.value));
      });
      casilla.addEventListener('change', () => {
        const valor = Math.round(Math.min(Number(casilla.max), Math.max(Number(casilla.min), Number(casilla.value) || 0)));
        casilla.value = valor;
        entrada.value = valor;
        cambiarAjuste(entrada.dataset.clave, valor);
      });
    });
    hoja.querySelectorAll('input[data-flag]').forEach(entrada => {
      entrada.addEventListener('change', () => cambiarAjuste(entrada.dataset.flag, entrada.checked));
    });
    hoja.querySelector('#rp-restablecer').addEventListener('click', () => {
      App.cerrarHoja();
      Object.keys(AJUSTES_DEFECTO).forEach(clave => { ajustes[clave] = AJUSTES_DEFECTO[clave]; });
      aplicarEstilos();
      if (filas) pintar();
      guardarEnConfig();
      abrirAjustes();
    });
  }

  /** Pantalla grande: quita el ancho de celular mientras esta vista está abierta. */
  function mostrar() {
    enPantalla = true;
    animarPodio = true;
    clearTimeout(finEntrada);
    finEntrada = null;
    document.body.classList.add('pantalla-grande');
    aplicarEstilos();
    if (!filas) App.cargando(contenido);
    cargar();
    programar();
    window.addEventListener('resize', alCambiarTamano);
  }

  function ocultar() {
    enPantalla = false;
    clearInterval(intervalo);
    window.removeEventListener('resize', alCambiarTamano);
    document.body.classList.remove('pantalla-grande', 'sin-menu');
    document.body.style.removeProperty('--rp-mv');
    document.body.style.removeProperty('--rp-mh');
  }

  function programar() {
    clearInterval(intervalo);
    intervalo = setInterval(cargar, Math.max(SEGUNDOS_MINIMOS_DE_REFRESCO, INICIO.segundosRefresco) * 1000);
  }

  // Sin pedir nada en segundo plano, y al volver se actualiza al momento.
  document.addEventListener('visibilitychange', () => {
    if (!enPantalla) return;
    if (document.hidden) return clearInterval(intervalo);
    cargar();
    programar();
  });

  function alCambiarTamano() {
    if (!filas || !enPantalla) return;
    pintar();
  }

  /** forzar = true cuando lo pide el botón de actualizar: el servidor descarta la caché y lee el Sheet. */
  function cargar(forzar) {
    return servidor('obtenerRanking', forzar === true).then(r => {
      // El preset llega de la hoja Config, salvo que haya cambios de esta pantalla todavía sin guardar.
      if (r.ajustes && !ajustesPendientes) {
        ajustes = { ...AJUSTES_DEFECTO, ...r.ajustes };
        aplicarEstilos();
      }
      if (revelacion) return;   // durante la revelación el ranking queda congelado
      comparando = anteriores;
      filas = r.filas;
      pintar();
      actualizarControles();
      comparando = null;
      anteriores = new Map(filas.map(p => [p.nombre, p.puntos]));
      $('rp-hora').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }).catch(() => { if (!filas) App.error(contenido, cargar); });
  }

  /** Cuántos puntos subió desde el último refresco. Sin cambio, 0 y no se anima nada. */
  const subio = p => (comparando && comparando.has(p.nombre) ? Math.max(0, p.puntos - comparando.get(p.nombre)) : 0);
  const etiqueta = n => (n > 0 ? `<i class="delta">+${n}</i>` : '');

  // Todos muestran sus segundos, también el top: así cada puesto tiene la misma estructura (nombre, puntos y
  // tiempo) y las filas quedan alineadas. Además deja ver el desempate antes de que ocurra.
  const formatoTiempo = s => {
    const total = Math.round(s);
    return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
  };
  const chipTiempo = p => (typeof p.seg === 'number')
    ? `<span class="rp-desempate" title="Tiempo total en sus quizzes (minutos:segundos): en empate de puntos va primero quien tardó menos">${svg(ICONO.reloj, 13)}${formatoTiempo(p.seg)}</span>`
    : '';

  // El podio toma hasta tres personas, una por premio; la cuadrícula empieza en el 4.º.
  const PUESTOS_DEL_PODIO = 3;
  // De izquierda a derecha: el 2.º, el 1.º en el pico, y luego el 3.º.
  const ORDEN_DEL_PODIO = [1, 0, 2];

  // Llena columna por columna, de arriba hacia abajo: devuelve cuántas personas se muestran y cuántas filas usa.
  function distribucion() {
    const rejilla = $('rp-rejilla');
    const caben = Math.max(1, Math.floor((rejilla.clientHeight + ajustes.espacio) / (ajustes.alto + ajustes.espacio)));
    // "Filas" pone un tope a las que caben; nunca muestra más de las que entran (quedarían cortadas).
    const filasVisibles = ajustes.filas > 0 ? Math.min(caben, ajustes.filas) : caben;
    // Las columnas que de verdad pinta la rejilla: por debajo de 900 px es una sola, aunque el ajuste diga otra cosa.
    const columnas = getComputedStyle(rejilla).gridTemplateColumns.split(' ').length || ajustes.columnas;
    const cabe = columnas * filasVisibles;
    const cuantas = ajustes.personas > 0 ? Math.min(cabe, ajustes.personas) : cabe;
    return { cuantas, filas: Math.max(1, Math.min(filasVisibles, Math.ceil(cuantas / columnas))) };
  }

  // El podio nunca deja a la cuadrícula con menos de estas filas: si no caben, se achica en proporción.
  const FILAS_MINIMAS = 3;
  const ESCALA_MINIMA = 0.5;   // relativa al "Tamaño del top" de los ajustes

  /**
   * En pantallas bajas (o con zoom del navegador) el podio a tamaño completo dejaba la cuadrícula en media fila.
   * Aquí se baja --rp-escala hasta que entren FILAS_MINIMAS. Todas las medidas del podio dependen de esa
   * variable, así que se achica entero y mantiene sus proporciones. Se mide con la rejilla todavía vacía.
   */
  function ajustarPodioAlAlto() {
    const base = ajustes.escala / 100;
    vista.style.setProperty('--rp-escala', base);
    if (!ajustes.achicarTop) return;   // el top se queda con su tamaño aunque la lista quede con menos filas
    const rejilla = $('rp-rejilla');
    const podio = contenido.querySelector('.podio');
    const necesita = FILAS_MINIMAS * ajustes.alto + (FILAS_MINIMAS - 1) * ajustes.espacio;
    let escala = base;
    // Unas pocas vueltas: los márgenes fijos hacen que una sola cuenta se quede un poco corta.
    for (let vuelta = 0; vuelta < 4 && rejilla.clientHeight < necesita && escala > base * ESCALA_MINIMA; vuelta++) {
      const alto = podio.offsetHeight;
      escala = Math.max(base * ESCALA_MINIMA, escala * (alto - (necesita - rejilla.clientHeight)) / alto);
      vista.style.setProperty('--rp-escala', escala);
    }
  }

  /**
   * Rama de laurel que flanquea el número del pedestal (una a cada lado; la derecha es la misma en espejo por CSS).
   * Se dibuja una vez: el tallo sigue un arco abierto, como un "(", y en cada nudo salen dos hojas en punta,
   * una hacia afuera y otra hacia adentro, que se afinan hacia la punta. Toma el color del metal (currentColor).
   */
  const RAMA = (() => {
    const R = 52, CX = 62, CY = 54, NUDOS = 8, inicio = 0.62, fin = 2.45;
    const punto = t => [CX - R * Math.sin(t), CY + R * Math.cos(t)];
    // Hoja en forma de almendra que nace en (x, y) y apunta hacia "grados".
    const hoja = (x, y, grados, largo, ancho) =>
      `<path d="M0 0Q${(largo / 2).toFixed(1)} ${(-ancho).toFixed(1)} ${largo.toFixed(1)} 0Q${(largo / 2).toFixed(1)} ${ancho.toFixed(1)} 0 0" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${grados.toFixed(1)})"/>`;
    const partes = [];
    for (let i = 0; i < NUDOS; i++) {
      const t = inicio + (fin - inicio) * i / (NUDOS - 1);
      const [x, y] = punto(t);
      // Dirección en la que crece la rama (tangente al arco, hacia arriba).
      const rumbo = Math.atan2(-Math.sin(t), -Math.cos(t)) * 180 / Math.PI;
      const tamano = 1 - i * 0.045;
      partes.push(hoja(x, y, rumbo - 40, 16 * tamano, 5.6 * tamano));   // afuera
      partes.push(hoja(x, y, rumbo + 40, 13.5 * tamano, 4.8 * tamano)); // adentro
    }
    const [xf, yf] = punto(fin);
    const rumboFin = Math.atan2(-Math.sin(fin), -Math.cos(fin)) * 180 / Math.PI;
    partes.push(hoja(xf, yf, rumboFin, 13, 4.6));                         // hoja de la punta
    const [x0, y0] = punto(inicio - 0.08);
    const tallo = `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${xf.toFixed(1)} ${yf.toFixed(1)}" class="rp-tallo" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`;
    return `<svg class="rp-rama" viewBox="0 0 48 100" aria-hidden="true"><g fill="currentColor">${tallo}${partes.join('')}</g></svg>`;
  })();

  // Puestos tapados muestran ? y, al aparecer, entran en cascada.
  const puestoVisible = puesto => !revelacion || revelacion.revelados.has(puesto);
  const enRecien = (puesto, tipo) => recien.has(puesto) && recienTipo === tipo;
  const claseRevelado = puesto => (!puestoVisible(puesto) ? 'oculto' : (enRecien(puesto, 'filas') ? 'revela' : ''));
  const podioConPuntos = puesto => !revelacion || revelacion.podioPuntos.has(puesto);
  const podioConNombre = puesto => !revelacion || revelacion.podioNombres.has(puesto);
  const retrasoRevelado = puesto => {
    const primero = recien.size ? Math.min(...recien) : puesto;
    return `--rp-retraso: ${Math.min(1200, (puesto - primero) * 30)}ms`;
  };

  /** Un puesto del podio. */
  const lugar = (p, n) => {
    const puesto = n + 1;
    const conPuntos = podioConPuntos(puesto);
    const conNombre = podioConNombre(puesto);
    const delta = conPuntos ? subio(p) : 0;
    return `
      <div class="lugar l${puesto} ${metalDe(puesto)} ${delta ? 'subio' : ''}">
        <div class="ficha ${conNombre ? '' : 'sin-nombre'} ${enRecien(puesto, 'nombre') ? 'cae' : ''}">
          <div class="flota">${avatarDePuesto(conNombre ? p.nombre : '?', puesto)}</div>
          <div class="info">
            <div class="nombre"><span class="rp-nombre">${conNombre ? esc(p.nombre) : '?'}</span></div>
          </div>
          <div class="sombra"></div>
        </div>
        <div class="cuerpo">
          <div class="base">
            <span class="rp-placa">${RAMA}<span class="rp-num">${n + 1}</span>${RAMA}</span>
            <div class="metricas ${conPuntos ? (enRecien(puesto, 'puntos') ? 'revela' : '') : 'oculto'}">
              <div class="pts tnum">${conPuntos ? `${etiqueta(delta)}${p.puntos} pts` : '? pts'}</div>
              ${conPuntos ? chipTiempo(p) : ''}
            </div>
          </div>
        </div>
      </div>`;
  };

  /** Una fila de la cuadrícula: posición, nombre y puntos. */
  const celda = (p, puesto) => {
    const visible = puestoVisible(puesto);
    const delta = visible ? subio(p) : 0;
    const clasePuesto = puesto <= 10 ? 'top10' : (puesto <= 20 ? 'top20' : 'resto');
    return `
      <div class="fila ${clasePuesto} ${delta ? 'subio' : ''} ${claseRevelado(puesto)}" style="${retrasoRevelado(puesto)}">
        <span class="pos tnum">${puesto}</span>
        <span class="quien"><b>${visible ? esc(p.nombre) : '?'}</b></span>
        <span class="rp-puntos tnum"><span class="rp-pts-linea">${visible ? `${etiqueta(delta)}<b>${p.puntos}</b><small>pts</small>` : '<b>?</b>'}</span>${visible ? chipTiempo(p) : ''}</span>
      </div>`;
  };

  function pintar() {
    if (!filas.length) {
      contenido.innerHTML = `<div class="tarjeta estado"><div class="icono">${svg(ICONO.trofeo, 32)}</div>
        <h2>Esperando los primeros puntajes</h2>
        <p>Aún nadie tiene puntaje.</p></div>`;
      return;
    }

    // El podio muestra a quienes haya, hasta tres: con una persona solo el 1.º, con dos el 1.º y el 2.º, y así.
    const enPodio = Math.min(PUESTOS_DEL_PODIO, filas.length);
    const orden = ORDEN_DEL_PODIO.filter(n => n < enPodio);
    // Los tipos de letra llegan después del primer pintado y repintan el podio: la ventana de entrada los cubre.
    const entrada = animarPodio ? ' entrar' : '';
    if (entrada && !finEntrada) finEntrada = setTimeout(() => { animarPodio = false; }, 1500);
    contenido.innerHTML = `
      <div class="podio${entrada}" style="--rp-podio: ${enPodio}">${orden.map(n => lugar(filas[n], n)).join('')}</div>
      <div class="rp-cuerpo"><div class="rp-rejilla" id="rp-rejilla"></div></div>`;

    // Primero se dibuja la rejilla vacía para medir cuánto cabe, y luego se llena con esa cantidad.
    const inicio = PUESTOS_DEL_PODIO;
    if (filas.length > inicio) ajustarPodioAlAlto();
    const { cuantas, filas: filasUsadas } = distribucion();
    const visibles = filas.slice(inicio, inicio + cuantas);
    ultimoPuestoVisible = inicio + visibles.length;
    const rejilla = $('rp-rejilla');
    rejilla.style.setProperty('--rp-filas', filasUsadas);
    rejilla.innerHTML = visibles.map((p, k) => celda(p, inicio + k + 1, inicio + k)).join('');
  }

  // Montserrat llega después del primer pintado y agranda el podio: se vuelve a medir para que la última fila no quede cortada.
  if (document.fonts) document.fonts.addEventListener('loadingdone', alCambiarTamano);

  /** Pasos: filas fuera del top 10, del 10 al 4, puntos del podio y luego los nombres del 3 al 1. */
  function construirPasos(ultimo, total) {
    const rango = (desde, hasta) => Array.from({ length: Math.max(0, hasta - desde + 1) }, (_, i) => desde + i);
    const pasos = [
      { tipo: 'filas', ranks: rango(11, ultimo) },
      { tipo: 'filas', ranks: rango(4, Math.min(10, ultimo)) },
      { tipo: 'puntos', ranks: rango(1, Math.min(3, total)) },
      ...[3, 2, 1].filter(p => p <= total).map(p => ({ tipo: 'nombre', ranks: [p] })),
    ];
    return pasos.filter(paso => paso.ranks.length);
  }

  /** Toma el ranking del servidor (forzado) y lo congela; ningún refresco lo cambia hasta salir. */
  function iniciarRevelacion() {
    servidor('obtenerRanking', true).then(r => {
      filas = r.filas;
      revelacion = { pasos: [], hecho: 0, revelados: new Set(), podioPuntos: new Set(), podioNombres: new Set() };
      recien = new Set();
      pintar();
      revelacion.pasos = construirPasos(Math.min(filas.length, ultimoPuestoVisible), filas.length);
      actualizarControles();
    }).catch(() => { $('rp-hora').textContent = 'Sin conexión: inténtalo otra vez'; });
  }

  function revelarSiguiente() {
    const { pasos, hecho } = revelacion;
    if (hecho >= pasos.length) return;
    const paso = pasos[hecho];
    revelacion.hecho++;
    const destino = { filas: revelacion.revelados, puntos: revelacion.podioPuntos, nombre: revelacion.podioNombres }[paso.tipo];
    paso.ranks.forEach(puesto => destino.add(puesto));
    recien = new Set(paso.ranks);
    recienTipo = paso.tipo;
    clearTimeout(finRecien);
    finRecien = setTimeout(() => { recien = new Set(); }, 2500);
    pintar();
    actualizarControles();
  }

  function salirRevelacion() {
    revelacion = null;
    recien = new Set();
    cargar(true);
    actualizarControles();
  }

  /** Estado de los botones de revelación. */
  function actualizarControles() {
    const boton = $('rp-revelar');
    if (!revelacion) {
      boton.textContent = 'Iniciar revelación';
      boton.disabled = !filas || !filas.length;
    } else if (revelacion.hecho < revelacion.pasos.length) {
      boton.textContent = `Revelar siguiente (${revelacion.hecho}/${revelacion.pasos.length})`;
      boton.disabled = false;
    } else {
      boton.textContent = 'Revelación completa';
      boton.disabled = true;
    }
    $('rp-salir').hidden = !revelacion;
  }

  $('rp-revelar').addEventListener('click', () => (revelacion ? revelarSiguiente() : iniciarRevelacion()));
  $('rp-salir').addEventListener('click', salirRevelacion);
  aplicarEstilos();
  actualizarControles();
  $('rp-ajustes').addEventListener('click', abrirAjustes);
  App.registrar('ranking', { alMostrar: mostrar, alOcultar: ocultar, alRefrescar: () => cargar(true) });
})();
</script>
