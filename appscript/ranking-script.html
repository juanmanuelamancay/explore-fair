<script>
(() => {
  const SEGUNDOS_MINIMOS_DE_REFRESCO = 10;
  const contenido = $('ranking-contenido');
  const fija = $('ranking-mi-puesto');
  let filas = null;
  let intervalo = null;
  let observador = null;
  let anteriores = null;    // nombre -> puntos de la última vez que se pintó el ranking
  let comparando = null;    // puntos anteriores solo mientras se pinta; sin ellos no hay nada que destacar

  let enPantalla = false;   // la vista Ranking es la que se está mostrando

  /** Siempre trae el ranking al entrar: quien vuelve de un quiz lo ve al día sin esperar ni pulsar nada. */
  function mostrar() {
    enPantalla = true;
    if (!filas) App.cargando(contenido);
    cargar();
    programar();
  }

  // Mientras la vista está abierta se refresca sola, sin bajar del mínimo para no saturar el servidor.
  function programar() {
    clearInterval(intervalo);
    intervalo = setInterval(cargar, Math.max(SEGUNDOS_MINIMOS_DE_REFRESCO, INICIO.segundosRefresco) * 1000);
  }

  // Con el celular bloqueado o la app en segundo plano no se pide nada; al volver se actualiza de inmediato.
  document.addEventListener('visibilitychange', () => {
    if (!enPantalla) return;
    if (document.hidden) return clearInterval(intervalo);
    cargar();
    programar();
  });

  function ocultar() {
    enPantalla = false;
    clearInterval(intervalo);
    if (observador) observador.disconnect();
    fija.hidden = true;
  }

  /** forzar = true cuando lo pide el botón de actualizar: el servidor descarta la caché y lee el Sheet. */
  function cargar(forzar) {
    return servidor('obtenerRanking', forzar === true).then(r => {
      // Antes de pintar, se guarda lo que había: así solo se destacan los puntos que subieron.
      comparando = anteriores;
      filas = r.filas;
      pintar();
      comparando = null;
      anteriores = new Map(filas.map(p => [p.nombre, p.puntos]));
    }).catch(() => { if (!filas) App.error(contenido, cargar); });
  }

  /** Cuántos puntos subió desde el último refresco. Sin cambio, 0 y no se anima nada. */
  const subio = p => (comparando && comparando.has(p.nombre) ? Math.max(0, p.puntos - comparando.get(p.nombre)) : 0);
  const etiqueta = n => (n > 0 ? `<i class="delta">+${n}</i>` : '');

  const htmlFila = (p, i, destacar = true) => {
    const delta = destacar ? subio(p) : 0;
    return `
    <li class="fila ${p.yo ? 'yo' : ''} ${i < 3 ? 'con-corona' : ''} ${delta ? 'subio' : ''}">
      <span class="pos tnum">${i + 1}</span>
      ${i < 3 ? avatarDePuesto(p.nombre, i + 1) : ''}
      <span class="quien"><b>${esc(p.nombre)}${p.yo ? ' (tú)' : ''}</b></span>
      ${etiqueta(delta)}
      <span class="puntos-fila tnum"><b>${p.puntos}</b><small>pts</small></span>
    </li>`;
  };

  function pintar() {
    if (observador) observador.disconnect();
    fija.hidden = true;

    if (!filas.length) {
      contenido.innerHTML = `<div class="tarjeta estado"><div class="icono">${svg(ICONO.trofeo, 32)}</div>
        <h2>Aún no hay puntajes</h2><p>El ranking se llena cuando alguien responde su primer quiz.</p></div>`;
      return;
    }

    // El podio necesita tres personas; con menos se muestra todo como lista.
    const conPodio = filas.length >= 3;
    const lugar = (n, clase) => {
      const delta = subio(filas[n]);
      return `
      <div class="lugar ${clase} ${metalDe(n + 1)} ${filas[n].yo ? 'yo' : ''} ${delta ? 'subio' : ''}">
        ${avatarDePuesto(filas[n].nombre, n + 1)}
        <div class="nombre">${esc(filas[n].nombre)}${filas[n].yo ? ' (tú)' : ''}</div>
        <div class="pts tnum">${etiqueta(delta)}${filas[n].puntos} pts</div>
        <div class="base">${n + 1}</div>
      </div>`;
    };
    const lista = filas.map((p, i) => htmlFila(p, i)).slice(conPodio ? 3 : 0).join('');

    contenido.innerHTML = `
      ${conPodio ? `<div class="podio">${lugar(1, 'l2')}${lugar(0, 'l1')}${lugar(2, 'l3')}</div>` : ''}
      ${lista ? `<ul class="lista">${lista}</ul>` : ''}
      <p class="aviso">En empate, va primero quien llegó antes a ese puntaje.</p>
      <div style="height:72px"></div>`;

    // La fila propia queda fija abajo solo mientras la original no se ve en pantalla.
    const original = contenido.querySelector('.fila.yo');
    if (!original) return;
    const yo = filas.findIndex(p => p.yo);
    fija.innerHTML = `<ul>${htmlFila(filas[yo], yo, false)}</ul>`;
    observador = new IntersectionObserver(entradas => { fija.hidden = entradas[0].intersectionRatio >= 0.9; },
      { rootMargin: '0px 0px -72px 0px', threshold: 0.9 });
    observador.observe(original);
  }

  App.registrar('ranking', { alMostrar: mostrar, alOcultar: ocultar, alRefrescar: () => cargar(true) });
})();
</script>
