<style>
  /* Vista MAPA: el usuario en el centro y los pabellones alrededor. */
  .mapa { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1; margin: 20px auto 48px; }
  .mapa svg.orbita { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mapa .estado { position: absolute; inset: 0; justify-content: center; }

  .guia { width: 100%; text-align: left; cursor: pointer; }
  .guia:active { background: #dce8fc; }
  .guia-texto { flex: 1; min-width: 0; }
  .guia-texto b { display: block; }
  .guia-texto span { display: block; }
  .guia .icono { position: relative; perspective: 120px; transform-style: preserve-3d; overflow: hidden; }
  .guia-icono-cara {
    position: absolute; inset: 0; display: grid; place-items: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .guia-icono-pregunta { color: var(--azul); font-size: 20px; font-weight: 500; transform: rotateY(180deg); }
  .guia-icono-mano { animation: guia-moneda-mano 3.6s ease-in-out infinite; }
  .guia-icono-pregunta { animation: guia-moneda-pregunta 3.6s ease-in-out infinite; }
  @keyframes guia-moneda-mano {
    0%, 35% { opacity: 1; transform: rotateY(0); }
    50%, 100% { opacity: 0; transform: rotateY(180deg); }
  }
  @keyframes guia-moneda-pregunta {
    0%, 35% { opacity: 0; transform: rotateY(-180deg); }
    50%, 85% { opacity: 1; transform: rotateY(0); }
    100% { opacity: 0; transform: rotateY(180deg); }
  }

  .mapa-seccion { margin-top: 24px; }
  .mapa-seccion h2 { font-size: 20px; font-weight: 400; }
  .mapa-seccion p { margin-top: 2px; color: var(--texto-2); font-size: 14px; }

  .pasos-ayuda { margin-top: 16px; }
  .paso-ayuda { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--borde-suave); }
  .paso-ayuda:last-child { border-bottom: 0; }
  .paso-ayuda .numero {
    width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--azul-suave); color: var(--azul); font-weight: 500;
  }
  .paso-ayuda b { display: block; font-size: 15px; }
  .paso-ayuda span { display: block; margin-top: 2px; color: var(--texto-2); font-size: 14px; }

  .punto { position: absolute; transform: translate(-50%, -50%); display: block; }
  .punto .rot {
    position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    width: 104px; text-align: center; font-size: 13px; line-height: 1.2; font-weight: 500;
    pointer-events: none;
  }
  .punto .rot small { display: block; font-size: 12px; font-weight: 500; color: var(--c); margin-top: 2px; }
  .punto .hecho {
    position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--verde); border: 3px solid var(--fondo); display: grid; place-items: center;
  }

  .pab .disco {
    position: relative; width: 64px; height: 64px; border-radius: 50%; padding: 3px; display: block;
    background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--borde-suave) 0);
    transition: transform .12s;
  }
  .pab .disco > span {
    width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
    background: var(--t); color: var(--c); border: 2px solid var(--fondo);
  }
  .pab .disco .hecho { right: -4px; bottom: -4px; width: 24px; height: 24px; }
  .pab:active .disco, .yo-nodo:active .disco { transform: scale(.94); }

  /* Pabellones cerrados hasta terminar el quiz de entrada */
  .pab.bloqueado .disco > span { filter: grayscale(1); opacity: .5; }
  .pab.bloqueado .rot { color: #9aa0a6; }
  .pab.bloqueado:active .disco { transform: none; }
  .pab .candado {
    position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%;
    background: #f1f3f4; border: 3px solid var(--fondo); display: grid; place-items: center;
  }

  .yo-nodo .disco {
    position: relative; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
    background: var(--azul); color: #fff; font-size: 24px; font-weight: 500;
    box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
    transition: transform .12s;
  }
  .yo-nodo.pendiente .disco::before {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid var(--azul); animation: pulso 1.8s ease-out infinite;
  }
  @keyframes pulso { from { transform: scale(.92); opacity: .8; } to { transform: scale(1.25); opacity: 0; } }
  .yo-nodo .rot { background: var(--fondo); border-radius: 8px; padding: 2px 0; width: 112px; }
  .yo-nodo .rot small { color: var(--azul); }

  /*
   * Apertura al terminar el quiz de entrada: cada pabellón recupera su color, su candado salta
   * y desaparece, y una onda de su color se expande. --retraso los escalona uno tras otro.
   * "both" mantiene el aspecto cerrado mientras a cada uno le llega su turno.
   */
  .pab.abriendo .disco > span { animation: abrir-color var(--duracion) ease both; animation-delay: var(--retraso); }
  .pab.abriendo .rot { animation: abrir-texto var(--duracion) ease both; animation-delay: var(--retraso); }
  .pab.abriendo .candado { animation: abrir-candado var(--duracion) cubic-bezier(.3, 0, .2, 1) both; animation-delay: var(--retraso); }
  .pab.abriendo .disco::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--c);
    opacity: 0; animation: abrir-onda var(--duracion) ease-out forwards; animation-delay: var(--retraso);
  }
  .yo-nodo .hecho.recien { animation: abrir-check .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes abrir-color { from { filter: grayscale(1); opacity: .5; } to { filter: none; opacity: 1; } }
  @keyframes abrir-texto { from { color: #9aa0a6; } to { color: var(--texto); } }
  @keyframes abrir-candado {
    0% { transform: none; opacity: 1; }
    35% { transform: scale(1.3) rotate(-14deg); opacity: 1; }
    100% { transform: scale(0) rotate(20deg); opacity: 0; }
  }
  @keyframes abrir-onda { 0% { transform: scale(.95); opacity: .7; } 100% { transform: scale(1.45); opacity: 0; } }
  @keyframes abrir-check { from { transform: scale(0); } to { transform: scale(1); } }

  /*
   * Stand respondido: el anillo se llena desde el progreso anterior (--p es animable porque está
   * registrada), una onda sale del disco, el "+N" sube y se desvanece, y el check aparece al completar.
   */
  @property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
  .pab { transition: --p .9s cubic-bezier(.3, 0, .2, 1); }
  .pab.sumando .disco::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--c);
    opacity: 0; animation: abrir-onda .9s ease-out .2s forwards;
  }
  .pab .sumado {
    position: absolute; left: 50%; bottom: 100%; white-space: nowrap; pointer-events: none;
    padding: 2px 9px; border-radius: 12px; background: var(--c); color: #fff; font-size: 13px; font-weight: 500;
    font-style: normal; border: 2px solid var(--fondo); opacity: 0;
    animation: sumar-subir 1.7s cubic-bezier(.3, 1.3, .5, 1) .3s forwards;
  }
  .pab .hecho.recien { animation: abrir-check .45s cubic-bezier(.3, 1.6, .5, 1) .7s both; }
  @keyframes sumar-subir {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); }
    20% { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
    75% { opacity: 1; transform: translate(-50%, -26px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -36px) scale(1); }
  }
  #mapa-puntos.sube { display: inline-block; animation: sumar-kpi .7s ease; }
  /* Puesto en el podio: la medalla se deja caer sobre el recuadro y el recuadro da un pequeño pulso */
  .kpi.celebra { animation: kpi-pulso .9s ease .45s both; }
  .kpi.celebra .corona { animation: corona-caer .7s cubic-bezier(.3, 1.5, .5, 1) .45s both; }
  @keyframes corona-caer {
    0% { opacity: 0; transform: translate(-50%, -26px) rotate(-18deg) scale(.6); }
    100% { opacity: 1; transform: translate(-50%, 0) rotate(0) scale(1); }
  }
  @keyframes kpi-pulso { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.1); } }
  @keyframes sumar-kpi { 0% { transform: scale(1); } 40% { transform: scale(1.3); color: var(--azul); } 100% { transform: scale(1); } }

  /* Hoja con los stands de un pabellón */
  .hoja-cab { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px; }
  .hoja-cab .icono { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--t); color: var(--c); flex: none; }
  .hoja-cab h2 { font-size: 20px; }
  .hoja-seccion { padding: 8px 16px 4px; color: var(--texto-2); font-size: 14px; font-weight: 500; }
  .item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 68px; padding: 10px 16px; border-radius: 16px; }
  button.item:active { background: var(--superficie); }
  .item .nom { flex: 1; min-width: 0; }
  .item .nom b { display: block; }
  .item .nom span { font-size: 13px; color: var(--texto-2); }
  .item .fin { font-size: 14px; font-weight: 500; flex: none; display: flex; align-items: center; gap: 4px; color: var(--texto-2); }
  .item.hecho .fin { color: var(--verde); }
  .item.vencido { opacity: .6; }
</style>
