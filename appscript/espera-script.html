<script>
(() => {
  // Llegada la hora, se pregunta cada tanto si ya abrieron la feria, para entrar sin que el usuario haga nada.
  const SEGUNDOS_ENTRE_COMPROBACIONES = 60;
  const cuenta = $('espera-cuenta');
  let datos = null;
  let desfase = 0;          // hora del servidor menos hora del celular
  let intervalo = null;
  let ultimaComprobacion = 0;

  function mostrar() {
    $('espera-saludo').textContent = 'Hola, ' + INICIO.nombre.split(' ')[0];
    if (!datos) App.cargando(cuenta);
    cargar();
    intervalo = setInterval(tic, 1000);
  }

  function ocultar() { clearInterval(intervalo); }

  function cargar() {
    return servidor('obtenerEspera').then(r => {
      datos = r;
      desfase = r.ahora - Date.now();
      pintar();
    }).catch(() => { if (!datos) App.error(cuenta, cargar); });
  }

  const restante = () => Math.max(0, Math.floor((datos.fecha - (Date.now() + desfase)) / 1000));

  function pintar() {
    pintarCuenta();

    $('espera-premios').hidden = !datos.premios.length;
    $('espera-premios').innerHTML = !datos.premios.length ? '' : `
      <h2 class="titulo-seccion">Premios</h2>
      ${datos.mensajePremios ? `<p class="premios-intro">${esc(datos.mensajePremios)}</p>` : ''}
      <ul class="lista">${datos.premios.map((p, i) => `
        <li class="fila premio">
          ${metalDe(i + 1) ? medalla(i + 1) : `<span class="medalla azul">${CORONA}${i + 1}</span>`}

          <span class="quien"><b>${esc(p.titulo)}</b>${p.descripcion ? `<span>${esc(p.descripcion)}</span>` : ''}</span>
        </li>`).join('')}
      </ul>`;

    pintarCharlas();

    $('espera-objetivo-icono').innerHTML = svg(ICONO.mapa, 22);
    document.querySelectorAll('.obj-ico').forEach(e => { e.innerHTML = svg(ICONO.check, 12, 'currentColor', 3); });

    // Una tarjeta por pabellón, después de Cómo participar y antes de Premios, que cierra el carrusel.
    carrusel.hidden = false;   // se muestra recién con todas sus láminas, no solo con la fija
    carrusel.querySelectorAll('.lamina.de-pabellon').forEach(l => l.remove());
    $('espera-premios').insertAdjacentHTML('beforebegin', datos.pabellones.map(p => {
      const tono = paleta(p.indice);
      return `
        <section class="lamina de-pabellon" data-titulo="Pabellón ${esc(p.nombre)}">
          <h2 class="titulo-seccion">Descubre agentes de IA</h2>
          <div class="tarjeta pab-tarjeta" style="--c:${tono.color};--t:${tono.tinte}">
            <div class="titulo">
              <span class="icono">${svg(tono.icono, 26)}</span>
              <div><span class="etiqueta-pab">${p.stands.length} ${p.stands.length === 1 ? 'stand' : 'stands'}</span><h2>${esc(p.nombre)}</h2></div>
            </div>
            <ul>${p.stands.map(s => `<li><span class="abr">${esc(abreviatura(s))}</span>${esc(s)}</li>`).join('')}</ul>
          </div>
        </section>`;
    }).join(''));
    armarCarrusel();
  }

  const diaLargo = ms => { const d = new Date(ms).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' }); return d.charAt(0).toUpperCase() + d.slice(1); };
  const horaCorta = ms => new Date(ms).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', hour12: false });
  const claveDia = ms => { const d = new Date(ms); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };

  /** Una lámina con las charlas, un día tras otro. Sin charlas en la hoja, no aparece. */
  function pintarCharlas() {
    const lamina = $('espera-charlas');
    lamina.hidden = !datos.charlas.length;
    if (!datos.charlas.length) { lamina.innerHTML = ''; return; }
    // Un rótulo y una lista por día.
    const dias = [];
    datos.charlas.forEach(c => {
      const ultimo = dias[dias.length - 1];
      if (ultimo && ultimo.clave === claveDia(c.inicio)) ultimo.charlas.push(c);
      else dias.push({ clave: claveDia(c.inicio), inicio: c.inicio, charlas: [c] });
    });
    const filas = dias.map(d => `<p class="dia-charlas">${esc(diaLargo(d.inicio))}</p>
      <ul class="lista espera-charlas">${d.charlas.map(c => `<li class="fila"><span class="hora-charla tnum">${horaCorta(c.inicio)}</span><span class="quien"><b>${esc(c.titulo)}</b>${c.ponente ? `<span>${esc(c.ponente)}</span>` : ''}</span></li>`).join('')}</ul>`).join('');
    lamina.innerHTML = `
      <h2 class="titulo-seccion">Empieza con las charlas</h2>
      <p class="espera-intro">Al terminar cada charla, quien la dicta comparte un código. Ingrésalo en la app, responde su quiz y suma puntos para el ranking.</p>
      ${filas}`;
  }

  /* ---------- Carrusel ---------- */
  const SEGUNDOS_POR_LAMINA = 6;
  const SEGUNDOS_DE_PAUSA_TRAS_TOCAR = 12;   // si la persona lo mueve, se le deja leer tranquila
  const carrusel = $('espera-carrusel');
  const puntos = $('espera-puntos');
  let laminas = [];
  let activa = 0;
  let ultimoToque = 0;
  let ultimoAvance = Date.now();
  let enMovimientoHasta = 0;   // mientras el carrusel se desplaza solo, no se recalcula la lámina activa

  function armarCarrusel() {
    laminas = [...carrusel.querySelectorAll('.lamina')].filter(l => !l.hidden);
    activa = Math.min(activa, laminas.length - 1);
    puntos.hidden = laminas.length < 2;
    puntos.innerHTML = laminas.map((l, i) =>
      `<button role="tab" data-lamina="${i}" aria-label="${esc(l.dataset.titulo)}"></button>`).join('');
    // Al aparecer láminas nuevas (los pabellones llegan con los datos), el navegador puede reacomodar
    // el desplazamiento y dejar el carrusel en otra lámina. Se le fija la posición a mano, ahora y en
    // el siguiente cuadro, que es cuando el navegador la reacomoda.
    irALamina(activa, false);
    requestAnimationFrame(() => irALamina(activa, false));
  }

  function marcarActiva() {
    puntos.querySelectorAll('button').forEach((b, i) => {
      b.classList.toggle('activa', i === activa);
      b.setAttribute('aria-selected', i === activa);
    });
    // El carrusel toma el alto de la lámina a la vista, para no dejar un hueco bajo las más cortas.
    if (laminas[activa]) carrusel.style.height = laminas[activa].offsetHeight + 'px';
  }

  function irALamina(indice, suave) {
    if (!laminas.length) return;
    activa = (indice + laminas.length) % laminas.length;
    // Cada lámina dura su tiempo completo desde que aparece, aunque la anterior haya llevado mucho rato.
    ultimoAvance = Date.now();
    enMovimientoHasta = Date.now() + (suave ? 800 : 300);
    carrusel.scrollTo({ left: laminas[activa].offsetLeft, behavior: suave ? 'smooth' : 'auto' });
    marcarActiva();
  }

  // Al deslizar con el dedo, el punto activo sigue a la lámina que quedó a la vista.
  carrusel.addEventListener('scroll', () => {
    if (Date.now() < enMovimientoHasta) return;
    const cerca = laminas.reduce((mejor, l, i) =>
      Math.abs(l.offsetLeft - carrusel.scrollLeft) < Math.abs(laminas[mejor].offsetLeft - carrusel.scrollLeft) ? i : mejor, 0);
    if (cerca !== activa) { activa = cerca; marcarActiva(); }
  }, { passive: true });

  ['pointerdown', 'touchstart', 'wheel'].forEach(evento => {
    carrusel.addEventListener(evento, () => { ultimoToque = Date.now(); }, { passive: true });
  });
  puntos.addEventListener('click', e => {
    const boton = e.target.closest('[data-lamina]');
    if (!boton) return;
    ultimoToque = Date.now();
    irALamina(+boton.dataset.lamina, true);
  });
  window.addEventListener('resize', () => irALamina(activa, false));

  /** Avanza solo. No lo hace con la app en segundo plano, recién tocado, o con movimiento reducido. */
  function avanzarSolo() {
    const ahora = Date.now();
    if (laminas.length < 2 || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const duracion = +laminas[activa].dataset.segundos || SEGUNDOS_POR_LAMINA;   // las láminas largas piden más tiempo
    if (ahora - ultimoToque < SEGUNDOS_DE_PAUSA_TRAS_TOCAR * 1000 || ahora - ultimoAvance < duracion * 1000) return;
    // Si ya bajó hasta dejar el inicio del carrusel fuera de la pantalla, está leyendo: no se le mueve.
    if (carrusel.getBoundingClientRect().top < 0) return;
    ultimoAvance = ahora;
    irALamina(activa + 1, true);
  }

  /** "Charlas del lunes 19 al miércoles 21 de octubre · Feria el jueves 22 de octubre", con las fechas de las hojas. */
  function resumenDelEvento() {
    const partes = [];
    if (datos.charlas.length) {
      const primera = datos.charlas[0].inicio, ultima = datos.charlas[datos.charlas.length - 1].inicio;
      const corto = ms => new Date(ms).toLocaleDateString('es', { weekday: 'long', day: 'numeric' });
      const mes = ms => new Date(ms).toLocaleDateString('es', { month: 'long' });
      partes.push(claveDia(primera) === claveDia(ultima) ? 'Charlas el ' + corto(primera) + ' de ' + mes(primera)
        : 'Charlas del ' + corto(primera) + ' al ' + corto(ultima) + ' de ' + mes(ultima));
    }
    if (datos.fechaFeria) partes.push('Feria el ' + new Date(datos.fechaFeria).toLocaleDateString('es', { weekday: 'long', day: 'numeric' }) + ' de ' + new Date(datos.fechaFeria).toLocaleDateString('es', { month: 'long' }));
    return partes.join(' · ');
  }

  function pintarCuenta() {
    const cuando = !datos.fecha ? '' : new Date(datos.fecha).toLocaleString('es', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
    const resumen = resumenDelEvento();
    const pie = `
      ${cuando ? `<p class="cuando">${esc(cuando.charAt(0).toUpperCase() + cuando.slice(1))}</p>` : ''}
      ${resumen ? `<p class="donde-es">${esc(resumen)}</p>` : ''}
      ${datos.lugar ? `<p class="donde-es">${esc(datos.lugar)}</p>` : ''}
      ${datos.mensaje ? `<p class="mensaje">${esc(datos.mensaje)}</p>` : ''}`;

    if (!datos.fecha) {
      cuenta.innerHTML = `<div class="disco-grande">${svg(ICONO.reloj, 34)}</div><h2>Muy pronto</h2>
        <p class="aviso">Estamos preparando las charlas y la feria de agentes.</p>${pie}`;
    } else if (restante() === 0) {
      cuenta.innerHTML = `<div class="disco-grande" style="--t:var(--verde-suave);--c:var(--verde)">${svg(ICONO.check, 34, 'currentColor', 2.5)}</div>
        <h2>Llegó el día</h2><p class="aviso">El evento está por empezar. Esta pantalla cambiará sola cuando abra.</p>${pie}`;
    } else {
      cuenta.innerHTML = `
        <p class="sec chico">El evento de agentes empieza en</p>
        <div class="reloj-grande tnum" role="timer">
          <div><b id="espera-d">0</b><span>días</span></div>
          <div><b id="espera-h">0</b><span>horas</span></div>
          <div><b id="espera-m">0</b><span>min</span></div>
          <div><b id="espera-s">0</b><span>seg</span></div>
        </div>${pie}`;
      pintarNumeros();
    }
  }

  function pintarNumeros() {
    const r = restante();
    $('espera-d').textContent = Math.floor(r / 86400);
    $('espera-h').textContent = String(Math.floor(r % 86400 / 3600)).padStart(2, '0');
    $('espera-m').textContent = String(Math.floor(r % 3600 / 60)).padStart(2, '0');
    $('espera-s').textContent = String(r % 60).padStart(2, '0');
  }

  function tic() {
    if (!datos) return;
    avanzarSolo();
    if (!datos.fecha) return;
    if (restante() > 0) {
      if ($('espera-d')) pintarNumeros(); else pintarCuenta();
      return;
    }
    if ($('espera-d')) pintarCuenta();   // la cuenta acaba de llegar a cero
    if (document.hidden || Date.now() - ultimaComprobacion < SEGUNDOS_ENTRE_COMPROBACIONES * 1000) return;
    ultimaComprobacion = Date.now();
    App.comprobarAcceso();
  }

  App.registrar('espera', { alMostrar: mostrar, alOcultar: ocultar, alRefrescar: cargar });
})();
</script>
