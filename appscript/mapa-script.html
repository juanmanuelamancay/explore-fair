<script>
(() => {
  const RADIO = 37;   // distancia del centro a los pabellones, en % del mapa
  // Animación de apertura de los pabellones: espera inicial, desfase entre uno y otro, y duración de cada uno.
  const APERTURA = { inicioMs: 350, pasoMs: 130, duracionMs: 650 };
  // Animación al volver de un stand: duración total, para no repintar mientras se ve.
  const SUMA = { totalMs: 1900 };
  let datos = null;
  let animandoHasta = 0;

  function cargar() {
    const primerNombre = INICIO.nombre.split(' ')[0];
    $('mapa-saludo').textContent = 'Hola, ' + primerNombre.charAt(0).toUpperCase() + primerNombre.slice(1);
    if (!datos) App.cargando($('mapa-lienzo'));
    else aplicarResultadoReciente();
    return servidorInsistente('obtenerMapa').then(respuesta => {
      datos = respuesta;
      App.estado.puntos = respuesta.puntos;
      // Lo que diga el servidor manda, pero se pinta al terminar la animación para no cortarla.
      const espera = animandoHasta - Date.now();
      if (espera > 0) setTimeout(() => { if (datos === respuesta) pintar(); }, espera);
      else pintar();
    }).catch(() => {
      if (datos) toast('No pudimos actualizar el mapa.');
      else App.error($('mapa-lienzo'), cargar);
    });
  }

  /**
   * Al volver de un quiz, el navegador ya sabe cómo terminó: se refleja en el mapa de inmediato
   * en lugar de mostrar los datos viejos mientras responde el servidor. Si lo que terminó fue
   * el quiz de entrada, los pabellones se abren con animación.
   */
  function aplicarResultadoReciente() {
    const reciente = App.estado.recien;
    App.estado.recien = null;
    if (!reciente) return;

    const esEntrada = !!datos.entrada && datos.entrada.id === reciente.standId;
    let stand = esEntrada ? datos.entrada : null;
    let pabellon = null;
    if (!stand) datos.pabellones.forEach(p => p.stands.forEach(s => { if (s.id === reciente.standId) { stand = s; pabellon = p; } }));
    if (!stand || stand.estado === 'COMPLETADO' || stand.estado === 'VENCIDO') return;

    // El anillo del pabellón arranca desde lo que tenía antes del stand recién respondido.
    const desde = pabellon ? progreso(pabellon) : 0;
    Object.assign(stand, { estado: reciente.estado, correctas: reciente.correctas, total: reciente.total, puntaje: reciente.puntaje });
    datos.puntos += reciente.puntaje;
    App.estado.puntos = datos.puntos;

    const sumando = pabellon ? { pabId: pabellon.id, desde: desde, puntos: reciente.puntaje } : null;
    pintar(esEntrada, sumando);
    if (esEntrada) {
      animandoHasta = Date.now() + APERTURA.inicioMs + APERTURA.pasoMs * (datos.pabellones.length - 1) + APERTURA.duracionMs;
      toast('Ya puedes visitar los pabellones.');
    } else if (sumando) {
      animandoHasta = Date.now() + SUMA.totalMs;
      sumar(sumando, pabellon, stand);
    }
  }

  /** Porcentaje de stands completados de un pabellón. */
  function progreso(p) {
    return p.stands.filter(s => s.estado === 'COMPLETADO').length / p.stands.length * 100;
  }

  /** Anillo que se llena hasta el nuevo progreso y los puntos que suben. */
  function sumar(sumando, pabellon, stand) {
    const kpi = $('mapa-puntos');
    kpi.classList.remove('sube');
    void kpi.offsetWidth;
    kpi.classList.add('sube');
    requestAnimationFrame(() => {
      const nodo = $('mapa-lienzo').querySelector(`[data-pab="${sumando.pabId}"]`);
      if (!nodo) return;
      void nodo.offsetWidth; // fuerza el estado inicial para que la transición corra
      nodo.style.setProperty('--p', progreso(pabellon));
    });
    toast(sumando.puntos ? `+${sumando.puntos} puntos en ${stand.nombre}` : `Completaste ${stand.nombre}`);
  }

  /** Con abriendo = true los pabellones se dibujan cerrados y se abren uno tras otro. */
  function pintar(abriendo, sumando) {
    const entrada = datos.entrada;
    // El validador no responde: los pabellones están abiertos desde el inicio y no tiene puntos.
    const soloLectura = !!datos.soloLectura;
    const entradaHecha = soloLectura || !entrada || entrada.estado === 'COMPLETADO' || entrada.estado === 'VENCIDO';

    $('mapa-puntos').textContent = datos.puntos;
    $('mapa-puntos').closest('.kpis').style.display = soloLectura ? 'none' : '';
    $('mapa-guia-icono').innerHTML = `
      <span class="guia-icono-cara guia-icono-mano">${svg(ICONO.toque, 20)}</span>
      <span class="guia-icono-cara guia-icono-pregunta" aria-hidden="true">?</span>`;
    // El validador ve el mismo texto de bienvenida que quien aún no responde el quiz de entrada.
    const bienvenida = soloLectura || !entradaHecha;
    $('mapa-guia-titulo').textContent = bienvenida ? 'Te damos la bienvenida a la feria' : 'Suma puntos en cada stand';
    $('mapa-guia-texto').textContent = bienvenida ? 'Responde el quiz de entrada para abrir los pabellones.' : 'Escucha la charla y pulsa su pabellón.';

    const pabellones = datos.pabellones.map((p, i) => {
      const angulo = (-90 + i * 360 / datos.pabellones.length) * Math.PI / 180;
      const x = 50 + RADIO * Math.cos(angulo), y = 50 + RADIO * Math.sin(angulo);
      const hechos = p.stands.filter(s => s.estado === 'COMPLETADO');
      const puntos = hechos.reduce((suma, s) => suma + s.puntaje, 0);
      const completo = hechos.length === p.stands.length;
      const tono = paleta(p.indice);
      const esSumando = !!sumando && sumando.pabId === p.id;
      return `
        <button class="punto pab ${entradaHecha ? (abriendo ? 'abriendo' : '') : 'bloqueado'} ${esSumando ? 'sumando' : ''}" data-pab="${esc(p.id)}" aria-disabled="${!entradaHecha}"
                style="left:${x}%;top:${y}%;--c:${tono.color};--t:${tono.tinte};--p:${esSumando ? sumando.desde : hechos.length / p.stands.length * 100};--retraso:${APERTURA.inicioMs + i * APERTURA.pasoMs}ms;--duracion:${APERTURA.duracionMs}ms"
                aria-label="Pabellón ${esc(p.nombre)}${entradaHecha ? '' : ', bloqueado hasta responder el quiz de entrada'}${completo ? ' completo' : ''}${hechos.length ? ', ' + puntos + ' puntos' : ''}">
          <span class="disco"><span>${svg(tono.icono, 26)}</span>${completo ? `<i class="hecho ${esSumando ? 'recien' : ''}">${svg(ICONO.check, 13, '#fff', 3)}</i>` : ''}${entradaHecha && !abriendo ? '' : `<i class="candado">${svg(ICONO.candado, 12, '#5f6368', 2.5)}</i>`}${esSumando && sumando.puntos ? `<i class="sumado">+${sumando.puntos}</i>` : ''}</span>
          <span class="rot">${esc(p.nombreCorto || p.nombre)}${hechos.length ? `<small>${puntos} pts</small>` : ''}</span>
        </button>`;
    }).join('');

    let centro = '';
    if (entrada) {
      const hecha = entrada.estado === 'COMPLETADO';
      const rotulo = hecha ? `Quiz de entrada<small>${entrada.puntaje} pts</small>`
        : entrada.estado === 'VENCIDO' ? 'Quiz de entrada<small>Sin puntaje</small>'
        : entrada.estado === 'EN_CURSO' ? 'Continúa aquí<small>Quiz de entrada</small>'
        : 'Empieza aquí<small>Quiz de entrada</small>';
      centro = `
        <button class="punto yo-nodo ${soloLectura || !entradaHecha ? 'pendiente' : ''}" data-stand="${esc(entrada.id)}" style="left:50%;top:50%"
                aria-label="${hecha ? 'Quiz de entrada respondido, ' + entrada.puntaje + ' puntos' : 'Quiz de entrada'}">
          <span class="disco">${esc(iniciales(INICIO.nombre))}${hecha ? `<span class="hecho ${abriendo ? 'recien' : ''}">${svg(ICONO.check, 14, '#fff', 3)}</span>` : ''}</span>
          <span class="rot">${rotulo}</span>
        </button>`;
    }

    $('mapa-lienzo').innerHTML = `
      <svg class="orbita" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="${RADIO}" fill="none" stroke="#e8eaed" stroke-width=".4" stroke-dasharray="1.2 1.6"/>
      </svg>${pabellones}${centro}`;
  }

  function abrirPabellon(id) {
    const p = datos.pabellones.find(x => x.id === id);
    if (!p) return;
    const tono = paleta(p.indice);
    const completo = p.stands.every(s => s.estado === 'COMPLETADO');
    // Todos los stands tienen las mismas preguntas y puntos, así que la fila solo dice el estado.
    // El círculo muestra ese estado (no la sigla), y el nombre aparece una sola vez.
    const filas = p.stands.map(s => {
      if (s.estado === 'COMPLETADO') return `<li><div class="item hecho">
        <span class="estado-stand hecho">${svg(ICONO.check, 20, '#fff', 3)}</span>
        <span class="nom"><b>${esc(s.nombre)}</b><span>${s.correctas} de ${s.total} correctas</span></span>
        <span class="fin tnum">${s.puntaje} pts</span></div></li>`;
      if (s.estado === 'VENCIDO') return `<li><div class="item vencido">
        <span class="estado-stand vencido">${svg(ICONO.equis, 18)}</span>
        <span class="nom"><b>${esc(s.nombre)}</b><span>Se venció el tiempo</span></span>
        <span class="fin tnum">0 pts</span></div></li>`;
      const enCurso = s.estado === 'EN_CURSO';
      // Pendiente no lleva subtítulo: basta con el nombre y la flecha.
      const detalle = enCurso ? '<span>En curso · toca para continuar</span>' : '';
      return `<li><button class="item" data-stand="${esc(s.id)}">
        <span class="estado-stand ${enCurso ? 'en-curso' : 'pendiente'}">${svg(enCurso ? ICONO.play : ICONO.check, 20)}</span>
        <span class="nom"><b>${esc(s.nombre)}</b>${detalle}</span>
        <span class="fin">${svg(ICONO.flecha, 20)}</span></button></li>`;
    }).join('');

    const hoja = App.abrirHoja(`
      <div style="--c:${tono.color};--t:${tono.tinte}">
        <div class="hoja-cab">
          <span class="icono">${svg(tono.icono)}</span>
          <div><p class="sec chico">Pabellón${completo ? ' completo' : ''}</p><h2>${esc(p.nombre)}</h2></div>
        </div>
        <p class="hoja-seccion">Descubre los stands, responde aquí y gana puntos</p>
        <ul>${filas}</ul>
        <p class="aviso" style="margin:8px 16px 4px">Necesitas el código que da el líder al terminar la charla.</p>
      </div>`);
    hoja.onclick = e => {
      const fila = e.target.closest('[data-stand]');
      if (fila) abrirStand(fila.dataset.stand, p);
    };
  }

  function abrirStand(id, pabellon) {
    const stand = pabellon ? pabellon.stands.find(s => s.id === id) : datos.entrada;
    if (!stand) return;
    if (stand.estado === 'COMPLETADO') return toast(`Ya respondiste ${stand.nombre}: ${stand.correctas} de ${stand.total} · ${stand.puntaje} pts`);
    if (stand.estado === 'VENCIDO') return toast(`Se te venció el tiempo en ${stand.nombre}. No se puede repetir.`);
    const tono = pabellon ? paleta(pabellon.indice) : PALETA[0];
    App.ir('quiz', { stand: stand, pabellon: pabellon ? pabellon.nombre : 'General', color: tono.color, tinte: tono.tinte });
  }

function abrirComoJugar() {
  const modal = App.abrirHoja(`
    <div class="hoja-texto">
      <h2 id="como-jugar-titulo">Cómo participar</h2>

      <p>
        Recorre la feria a tu ritmo, participa en las charlas y
        completa quizzes para sumar puntos y subir en el ranking.
      </p>

      <ol class="pasos-ayuda">

        <li class="paso-ayuda">
          <b class="numero">1</b>
          <div>
            <b>Empieza con el quiz de entrada</b>
            <span>
              Pulsa tu círculo en el centro de la pantalla y completa
              el quiz para conseguir tus primeros puntos y desbloquear
              los pabellones.
            </span>
          </div>
        </li>

        <li class="paso-ayuda">
          <b class="numero">2</b>
          <div>
            <b>Recorre la feria y escucha una charla</b>
            <span>
              Puedes visitar los pabellones y stands en el orden que quieras.
              Al terminar una charla, el líder compartirá un código.
            </span>
          </div>
        </li>

        <li class="paso-ayuda">
          <b class="numero">3</b>
          <div>
            <b>Abre el quiz del stand</b>
            <span>
              En la app, pulsa el pabellón donde estás, selecciona el stand
              de la charla e introduce el código.
            </span>
          </div>
        </li>

        <li class="paso-ayuda">
          <b class="numero">4</b>
          <div>
            <b>Responde y suma puntos</b>
            <span>
              Completa el quiz para sumar puntos. Los puestos se ven
              en la pantalla grande de la feria.
            </span>
          </div>
        </li>

      </ol>
    </div>
  `);

  modal.setAttribute('aria-labelledby', 'como-jugar-titulo');
  modal.setAttribute('tabindex', '-1');
  modal.focus();
}

  $('mapa-como-jugar').addEventListener('click', abrirComoJugar);

  $('mapa-lienzo').addEventListener('click', e => {
    if (!datos) return;
    const pabellon = e.target.closest('[data-pab]');
    if (pabellon) {
      // El servidor también lo impide; aquí solo se avisa antes de abrir la hoja.
      if (pabellon.classList.contains('bloqueado')) return toast('Primero responde el quiz de entrada: pulsa tu círculo.');
      return abrirPabellon(pabellon.dataset.pab);
    }
    const stand = e.target.closest('[data-stand]');
    if (stand) abrirStand(stand.dataset.stand, null);
  });

  App.registrar('mapa', { alMostrar: cargar, alRefrescar: cargar });
})();
</script>
