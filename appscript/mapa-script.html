<script>
(() => {
  const RADIO = 37;   // distancia del centro a los pabellones, en % del mapa
  // Animación de apertura de los pabellones: espera inicial, desfase entre uno y otro, y duración de cada uno.
  const APERTURA = { inicioMs: 350, pasoMs: 130, duracionMs: 650 };
  let datos = null;
  let animandoHasta = 0;

  function cargar() {
    $('mapa-saludo').textContent = 'Hola, ' + INICIO.nombre.split(' ')[0];
    if (!datos) App.cargando($('mapa-lienzo'));
    else aplicarResultadoReciente();
    return servidor('obtenerMapa').then(respuesta => {
      datos = respuesta;
      App.estado.puesto = respuesta.puesto;
      // Lo que diga el servidor manda, pero se pinta al terminar la animación para no cortarla.
      const espera = animandoHasta - Date.now();
      if (espera > 0) setTimeout(() => { if (datos === respuesta) pintar(); }, espera);
      else pintar();
    }).catch(() => {
      if (datos) toast('No pudimos actualizar el mapa.');
      else App.error($('mapa-lienzo'), cargar);
    });
  }

  /**
   * Al volver de un quiz, el navegador ya sabe cómo terminó: se refleja en el mapa de inmediato
   * en lugar de mostrar los datos viejos mientras responde el servidor. Si lo que terminó fue
   * el quiz de entrada, los pabellones se abren con animación.
   */
  function aplicarResultadoReciente() {
    const reciente = App.estado.recien;
    App.estado.recien = null;
    if (!reciente) return;

    const esEntrada = !!datos.entrada && datos.entrada.id === reciente.standId;
    let stand = esEntrada ? datos.entrada : null;
    if (!stand) datos.pabellones.forEach(p => p.stands.forEach(s => { if (s.id === reciente.standId) stand = s; }));
    if (!stand || stand.estado === 'COMPLETADO' || stand.estado === 'VENCIDO') return;

    Object.assign(stand, { estado: reciente.estado, correctas: reciente.correctas, total: reciente.total, puntaje: reciente.puntaje });
    datos.puntos += reciente.puntaje;
    datos.puesto = reciente.puesto;

    pintar(esEntrada);
    if (esEntrada) {
      animandoHasta = Date.now() + APERTURA.inicioMs + APERTURA.pasoMs * (datos.pabellones.length - 1) + APERTURA.duracionMs;
      toast('Ya puedes visitar los pabellones.');
    }
  }

  /** Con abriendo = true los pabellones se dibujan cerrados y se abren uno tras otro. */
  function pintar(abriendo) {
    const entrada = datos.entrada;
    const entradaHecha = !entrada || entrada.estado === 'COMPLETADO' || entrada.estado === 'VENCIDO';

    $('mapa-puntos').textContent = datos.puntos;
    $('mapa-puesto').textContent = datos.puesto ? '#' + datos.puesto : '–';
    const kpiPuesto = $('mapa-puesto').parentElement;
    kpiPuesto.classList.remove('oro', 'plata', 'bronce');
    kpiPuesto.querySelectorAll('.corona').forEach(c => c.remove());
    if (metalDe(datos.puesto)) {
      kpiPuesto.classList.add(metalDe(datos.puesto));
      kpiPuesto.insertAdjacentHTML('afterbegin', CORONA);
    }
    $('mapa-guia-icono').innerHTML = svg(ICONO.toque, 20);
    $('mapa-guia-titulo').textContent = entradaHecha ? 'Suma puntos en cada stand' : 'Te damos la bienvenida a la feria';
    $('mapa-guia-texto').textContent = entradaHecha ? 'Escucha la charla y pulsa su pabellón.' : 'Pulsa tu círculo y responde el quiz de entrada para abrir los pabellones.';

    const pabellones = datos.pabellones.map((p, i) => {
      const angulo = (-90 + i * 360 / datos.pabellones.length) * Math.PI / 180;
      const x = 50 + RADIO * Math.cos(angulo), y = 50 + RADIO * Math.sin(angulo);
      const hechos = p.stands.filter(s => s.estado === 'COMPLETADO');
      const puntos = hechos.reduce((suma, s) => suma + s.puntaje, 0);
      const completo = hechos.length === p.stands.length;
      const tono = paleta(p.indice);
      return `
        <button class="punto pab ${entradaHecha ? (abriendo ? 'abriendo' : '') : 'bloqueado'}" data-pab="${esc(p.id)}" aria-disabled="${!entradaHecha}"
                style="left:${x}%;top:${y}%;--c:${tono.color};--t:${tono.tinte};--p:${hechos.length / p.stands.length * 100};--retraso:${APERTURA.inicioMs + i * APERTURA.pasoMs}ms;--duracion:${APERTURA.duracionMs}ms"
                aria-label="Pabellón ${esc(p.nombre)}${entradaHecha ? '' : ', bloqueado hasta responder el quiz de entrada'}${completo ? ' completo' : ''}${hechos.length ? ', ' + puntos + ' puntos' : ''}">
          <span class="disco"><span>${svg(tono.icono, 26)}</span>${completo ? `<i class="hecho">${svg(ICONO.check, 13, '#fff', 3)}</i>` : ''}${entradaHecha && !abriendo ? '' : `<i class="candado">${svg(ICONO.candado, 12, '#5f6368', 2.5)}</i>`}</span>
          <span class="rot">${esc(p.nombre)}${hechos.length ? `<small>${puntos} pts</small>` : ''}</span>
        </button>`;
    }).join('');

    let centro = '';
    if (entrada) {
      const hecha = entrada.estado === 'COMPLETADO';
      const rotulo = hecha ? `Quiz de entrada<small>${entrada.puntaje} pts</small>`
        : entrada.estado === 'VENCIDO' ? 'Quiz de entrada<small>Sin puntaje</small>'
        : entrada.estado === 'EN_CURSO' ? 'Continúa aquí<small>Quiz de entrada</small>'
        : 'Empieza aquí<small>Quiz de entrada</small>';
      centro = `
        <button class="punto yo-nodo ${entradaHecha ? '' : 'pendiente'}" data-stand="${esc(entrada.id)}" style="left:50%;top:50%"
                aria-label="${hecha ? 'Quiz de entrada respondido, ' + entrada.puntaje + ' puntos' : 'Quiz de entrada'}">
          <span class="disco">${esc(iniciales(INICIO.nombre))}${hecha ? `<span class="hecho ${abriendo ? 'recien' : ''}">${svg(ICONO.check, 14, '#fff', 3)}</span>` : ''}</span>
          <span class="rot">${rotulo}</span>
        </button>`;
    }

    $('mapa-lienzo').innerHTML = `
      <svg class="orbita" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="${RADIO}" fill="none" stroke="#e8eaed" stroke-width=".4" stroke-dasharray="1.2 1.6"/>
      </svg>${pabellones}${centro}`;
  }

  function abrirPabellon(id) {
    const p = datos.pabellones.find(x => x.id === id);
    if (!p) return;
    const tono = paleta(p.indice);
    const completo = p.stands.every(s => s.estado === 'COMPLETADO');
    const filas = p.stands.map(s => {
      const abr = `<span class="abr">${esc(abreviatura(s.nombre))}</span>`;
      if (s.estado === 'COMPLETADO') return `<li><div class="item hecho">${abr}
        <span class="nom"><b>${esc(s.nombre)}</b><span>${s.correctas} de ${s.total} correctas</span></span>
        <span class="fin tnum">${svg(ICONO.check, 18, '#188038', 3)}${s.puntaje} pts</span></div></li>`;
      if (s.estado === 'VENCIDO') return `<li><div class="item vencido">${abr}
        <span class="nom"><b>${esc(s.nombre)}</b><span>Se venció el tiempo</span></span>
        <span class="fin tnum">0 pts</span></div></li>`;
      const detalle = s.estado === 'EN_CURSO' ? 'En curso · toca para continuar' : `${s.numPreguntas} preguntas · hasta ${s.puntosMax} pts`;
      return `<li><button class="item" data-stand="${esc(s.id)}">${abr}
        <span class="nom"><b>${esc(s.nombre)}</b><span>${detalle}</span></span>
        <span class="fin">${svg(ICONO.flecha, 20)}</span></button></li>`;
    }).join('');

    const hoja = App.abrirHoja(`
      <div style="--c:${tono.color};--t:${tono.tinte}">
        <div class="hoja-cab">
          <span class="icono">${svg(tono.icono)}</span>
          <div><p class="sec chico">Pabellón${completo ? ' completo' : ''}</p><h2>${esc(p.nombre)}</h2></div>
        </div>
        <ul>${filas}</ul>
        <p class="aviso" style="margin:8px 16px 4px">Necesitas el código que da el líder al terminar la charla.</p>
      </div>`);
    hoja.onclick = e => {
      const fila = e.target.closest('[data-stand]');
      if (fila) abrirStand(fila.dataset.stand, p);
    };
  }

  function abrirStand(id, pabellon) {
    const stand = pabellon ? pabellon.stands.find(s => s.id === id) : datos.entrada;
    if (!stand) return;
    if (stand.estado === 'COMPLETADO') return toast(`Ya respondiste ${stand.nombre}: ${stand.correctas} de ${stand.total} · ${stand.puntaje} pts`);
    if (stand.estado === 'VENCIDO') return toast(`Se te venció el tiempo en ${stand.nombre}. No se puede repetir.`);
    const tono = pabellon ? paleta(pabellon.indice) : PALETA[0];
    App.ir('quiz', { stand: stand, pabellon: pabellon ? pabellon.nombre : 'General', color: tono.color, tinte: tono.tinte });
  }

  $('mapa-lienzo').addEventListener('click', e => {
    if (!datos) return;
    const pabellon = e.target.closest('[data-pab]');
    if (pabellon) {
      // El servidor también lo impide; aquí solo se avisa antes de abrir la hoja.
      if (pabellon.classList.contains('bloqueado')) return toast('Primero responde el quiz de entrada: pulsa tu círculo.');
      return abrirPabellon(pabellon.dataset.pab);
    }
    const stand = e.target.closest('[data-stand]');
    if (stand) abrirStand(stand.dataset.stand, null);
  });

  App.registrar('mapa', { alMostrar: cargar, alRefrescar: cargar });
})();
</script>
