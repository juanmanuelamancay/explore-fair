<script>
(() => {
  const LETRAS = 'ABCD';
  const SEGUNDOS_EN_ROJO = 30;
  const pantalla = $('quiz-pantalla');

  // Lo que llega desde el mapa o desde la ruta de charlas (unidad, etiqueta, titulo, volver, color, tinte) más el quiz en curso.
  // La unidad es un pabellón o una charla; "volver" es la vista a la que se regresa.
  let q = null;

  // Bloqueo por códigos incorrectos: vale para toda la persona, no para un stand. Hora (ms) hasta la que no puede escribir.
  let bloqueoHasta = 0;
  let cuentaAtras = null;
  const textoVolver = () => (q.volver === 'charlas' ? 'Volver a los talleres' : 'Volver al mapa');
  const duracion = s => (s % 60 === 0 ? (s / 60) + (s === 60 ? ' minuto' : ' minutos') : s + ' segundos');

  // El validador recorre las preguntas sin responderlas: sin reloj, sin intento y sin puntos.
  const validador = INICIO.rol === 'VALIDADOR';

  function mostrar(datos) {
    q = { unidad: datos.unidad, etiqueta: datos.etiqueta, titulo: datos.titulo, volver: datos.volver || 'mapa', color: datos.color, tinte: datos.tinte, intervalo: null, desfase: datos.desfase || 0, vigila: null };
    if (validador) {
      // El validador no pide código ni responde: entra directo a ver las preguntas.
      verPreguntas();
    } else if (q.unidad.estado === 'EN_CURSO') {
      // Cerró la app a mitad del quiz: se retoma sin pedir el código otra vez.
      App.cargando(pantalla);
      iniciar('');
    } else {
      pantallaCodigo();
    }
  }

  function ocultar() {
    if (q) { clearInterval(q.intervalo); clearInterval(q.vigila); }
    clearInterval(cuentaAtras);
  }

  const cabecera = () => `
    <div class="barra-sup" style="--c:${q.color}">
      <button class="volver" data-ir="${q.volver}" aria-label="${textoVolver()}">${svg(ICONO.atras)}</button>
      <div class="donde"><span class="etiqueta-pab">${esc(q.etiqueta)}</span><b>${esc(q.titulo)}</b></div>
    </div>`;

  /* ---------- Código ---------- */
  /**
   * Una charla cierra a la hora de su columna "cierre". Si pasa mientras la persona está en la pantalla del código, se la
   * saca de aquí y se la lleva a la ruta de charlas con el aviso, sin esperar a que toque "Empezar". Con el quiz ya en curso
   * no se vigila: ese se termina.
   */
  function vigilarCierre() {
    clearInterval(q.vigila);
    if (!q.unidad.cierre || validador) return;
    const revisar = () => {
      if (Date.now() + q.desfase <= q.unidad.cierre) return;
      clearInterval(q.vigila);
      toast('La hora para responder este taller se venció.');
      App.ir(q.volver);
    };
    q.vigila = setInterval(revisar, 1000);
    revisar();
  }

  function pantallaCodigo() {
    const s = q.unidad;
    clearInterval(cuentaAtras);
    vigilarCierre();
    pantalla.innerHTML = `
      ${cabecera()}
      <div class="tarjeta centro" style="--c:${q.color};--t:${q.tinte}">
        <div class="disco-grande">${svg(s.requiereCodigo ? ICONO.llave : ICONO.play, 32)}</div>
        <h2>${s.requiereCodigo ? 'Ingresa el código' : 'Listo para empezar'}</h2>
        ${s.stands && s.stands.length ? `
          <p class="sec chico">Las preguntas serán sobre estos stands:</p>
          <div class="datos">${s.stands.map(st => `<span class="chip">${esc(st.nombre)}</span>`).join('')}</div>` : ''}
        <div class="datos">
          <span class="chip">${s.numPreguntas} preguntas</span>
          <span class="chip">${INICIO.minutosParaResponder} minutos</span>
          <span class="chip">Hasta ${s.puntosMax} pts</span>
        </div>
        ${s.requiereCodigo ? `
          <div class="campo-codigo">
            <input id="quiz-codigo" maxlength="4" inputmode="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="····" aria-label="Código del líder" aria-describedby="quiz-error">
          </div>
          <p class="msg-error" id="quiz-error" role="alert"></p>` : ''}
        <button class="btn" id="quiz-empezar" ${s.requiereCodigo ? 'disabled' : ''}>Empezar</button>
        <p class="aviso">${s.requiereCodigo
          ? `Si fallas el código ${INICIO.fallosDeCodigo} veces, tendrás que esperar ${duracion(INICIO.segundosBloqueoCodigo)} para volver a intentarlo.`
          : 'Solo tienes un intento.'}</p>
      </div>`;

    const boton = $('quiz-empezar');
    const campo = $('quiz-codigo');
    if (!campo) { boton.onclick = () => iniciar(''); return; }

    campo.oninput = () => {
      campo.value = campo.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      campo.classList.remove('error');
      $('quiz-error').textContent = '';
      boton.disabled = campo.value.length < 4;
    };
    campo.onkeydown = e => { if (e.key === 'Enter' && !boton.disabled) boton.click(); };
    boton.onclick = () => iniciar(campo.value);
    if (bloqueoHasta > Date.now()) bloquearCampo(); else campo.focus();
  }

  /** Con el bloqueo activo el campo no deja escribir y el botón cuenta los segundos que faltan. Al llegar a cero se libera solo. */
  function bloquearCampo() {
    const campo = $('quiz-codigo');
    const boton = $('quiz-empezar');
    campo.value = '';
    campo.disabled = true;
    campo.classList.add('error');
    boton.disabled = true;
    $('quiz-error').textContent = `Fallaste el código ${INICIO.fallosDeCodigo} veces. Espera para volver a intentarlo.`;
    clearInterval(cuentaAtras);
    const pintar = () => {
      if (!$('quiz-codigo')) return clearInterval(cuentaAtras);   // la persona ya salió de esta pantalla
      const falta = Math.ceil((bloqueoHasta - Date.now()) / 1000);
      if (falta > 0) { boton.textContent = 'Espera ' + formatoReloj(falta); return; }
      clearInterval(cuentaAtras);
      boton.textContent = 'Empezar';
      campo.disabled = false;
      campo.classList.remove('error');
      $('quiz-error').textContent = '';
      campo.focus();
    };
    pintar();
    cuentaAtras = setInterval(pintar, 250);
  }

  /* ---------- Validador: ver las preguntas sin responderlas ---------- */
  function verPreguntas() {
    pantalla.innerHTML = `${cabecera()}<div class="estado"><i class="giro oscuro"></i><p>Cargando preguntas…</p></div>`;
    servidorInsistente('verQuiz', q.unidad.id).then(r => {
      if (!r.ok) {
        toast(r.mensaje);
        return App.ir(q.volver);
      }
      q.preguntas = r.preguntas;
      q.porQuiz = r.porQuiz;
      q.actual = 0;
      pantallaRevision(true);
      // Si la persona ya salió mientras cargaba, el aviso no debe aparecer sobre otra pantalla.
      if (!$('vista-quiz').hidden) mostrarAviso('Cómo funciona en el evento', `Cada usuario responde solo ${q.porQuiz} de estas ${q.preguntas.length} preguntas, elegidas al azar.`);
    }).catch(() => {
      toast('No pudimos cargar las preguntas. Inténtalo de nuevo.');
      App.ir(q.volver);
    });
  }

  /** Una pregunta a la vez, con sus opciones a la vista pero sin poder elegir. La flecha de arriba vuelve al mapa en cualquier momento. */
  function pantallaRevision(entrar = false) {
    const p = q.preguntas[q.actual];
    const primera = q.actual === 0;
    const ultima = q.actual === q.preguntas.length - 1;
    pantalla.innerHTML = `
      ${cabecera()}
      <div class="pregunta-vista ${entrar ? 'entra' : ''}">
      <div class="quiz-cab" style="--c:${q.color}">
        <div class="pasos" aria-hidden="true">${q.preguntas.map((_, i) => `<i class="${i < q.actual ? 'pasado' : i === q.actual ? 'actual' : ''}"></i>`).join('')}</div>
      </div>
      <p class="sec chico">Pregunta ${q.actual + 1} de ${q.preguntas.length} · solo lectura${p.origen ? ' · ' + esc(p.origen) : ''}</p>
      <h2 class="enunciado">${esc(p.texto)}</h2>
      <div role="list" aria-label="Opciones">
        ${p.opciones.map((texto, i) => `
          <div class="opcion" style="--i:${i}" role="listitem"><span class="letra">${LETRAS[i]}</span><span>${esc(texto)}</span></div>`).join('')}
      </div>
      <button class="btn" data-siguiente style="${ultima ? 'visibility:hidden' : ''}">Siguiente</button>
      <button class="btn secundario" data-anterior style="${primera ? 'visibility:hidden' : ''}">Anterior</button>
      <button class="btn ${ultima ? '' : 'texto'}" data-ir="${q.volver}">${textoVolver()}</button>
      </div>`;
    window.scrollTo(0, 0);
    const mover = paso => () => { q.actual += paso; pantallaRevision(true); };
    const anterior = pantalla.querySelector('[data-anterior]');
    const siguiente = pantalla.querySelector('[data-siguiente]');
    if (anterior) anterior.onclick = mover(-1);
    if (siguiente) siguiente.onclick = mover(1);
  }

  function iniciar(codigo) {
    clearInterval(q.vigila);
    pantallaEspera('Preparando tu quiz', 'Estamos armando tus preguntas.', q.unidad.numPreguntas);

    servidorInsistente('iniciarQuiz', q.unidad.id, codigo).then(r => {
      if (!r.ok) {
        // La pantalla del código ya no está: si hace falta, se vuelve a mostrar para corregirlo.
        if (r.motivo === 'BLOQUEADO') bloqueoHasta = Date.now() + (Number(r.esperaSegundos) || INICIO.segundosBloqueoCodigo) * 1000;
        if (r.motivo === 'CODIGO' || r.motivo === 'BLOQUEADO') pantallaCodigo();
        return inicioRechazado(r);
      }
      q.intentoId = r.intentoId;
      q.preguntas = r.preguntas;
      q.respuestas = {};
      q.actual = 0;
      // El reloj se guía por la hora del servidor, no por la del celular.
      q.venceEn = r.venceEn + (Date.now() - r.ahora);
      pantallaPregunta(true);
      q.intervalo = setInterval(tic, 250);
    }).catch(() => {
      toast('No pudimos empezar el quiz. Inténtalo de nuevo.');
      if (q.unidad.estado === 'EN_CURSO') App.ir(q.volver); else pantallaCodigo();
    });
  }

  function inicioRechazado(r) {
    const campo = $('quiz-codigo');
    // Bloqueado: pantallaCodigo ya dejó el campo sin escribir y con su cuenta atrás.
    if (r.motivo === 'BLOQUEADO' && campo) return;
    if (r.motivo === 'CODIGO' && campo) {
      // La pantalla del código se acaba de volver a dibujar: el campo está vacío y el botón espera los 4 caracteres.
      campo.classList.add('error');
      $('quiz-error').textContent = r.mensaje;
      return;
    }
    if (r.motivo === 'VENCIDO') return pantallaVencido();
    // La charla cerró: se vuelve a la ruta (default de abajo), donde ya aparece "Cerrada".
    toast(r.mensaje);
    App.ir(q.volver);
  }

  /* ---------- Preguntas ---------- */
  const restante = () => Math.max(0, Math.ceil((q.venceEn - Date.now()) / 1000));

  function tic() {
    const r = restante();
    const reloj = $('quiz-reloj');
    if (reloj) {
      reloj.querySelector('span').textContent = formatoReloj(r);
      reloj.classList.toggle('poco', r <= SEGUNDOS_EN_ROJO);
    }
    if (r === 0) { clearInterval(q.intervalo); pantallaVencido(); }
  }

  /** entrar = true anima la entrada (al empezar o pasar de pregunta); al elegir una opción no se repite. */
  function pantallaPregunta(entrar = false) {
    const p = q.preguntas[q.actual];
    const elegida = q.respuestas[p.id];
    const ultima = q.actual === q.preguntas.length - 1;
    const r = restante();

    pantalla.innerHTML = `
      <div class="pregunta-vista ${entrar ? 'entra' : ''}">
      <div class="quiz-cab" style="--c:${q.color}">
        <div class="quiz-fila">
          <div class="donde"><span class="etiqueta-pab">${esc(q.etiqueta)}</span><b>${esc(q.titulo)}</b></div>
          <div class="reloj tnum ${r <= SEGUNDOS_EN_ROJO ? 'poco' : ''}" id="quiz-reloj" aria-label="Tiempo restante">${svg(ICONO.reloj, 18)}<span>${formatoReloj(r)}</span></div>
        </div>
        <div class="pasos" aria-hidden="true">${q.preguntas.map((_, i) => `<i class="${i < q.actual ? 'pasado' : i === q.actual ? 'actual' : ''}"></i>`).join('')}</div>
      </div>
      <p class="sec chico">Pregunta ${q.actual + 1} de ${q.preguntas.length}</p>
      <h2 class="enunciado">${esc(p.texto)}</h2>
      <div role="radiogroup" aria-label="Opciones">
        ${p.opciones.map((texto, i) => `
          <button class="opcion ${elegida === LETRAS[i] ? 'elegida' : ''}" style="--i:${i}" role="radio" aria-checked="${elegida === LETRAS[i]}" data-letra="${LETRAS[i]}">
            <span class="letra">${LETRAS[i]}</span><span>${esc(texto)}</span>
          </button>`).join('')}
      </div>
      <button class="btn" id="quiz-siguiente" ${elegida ? '' : 'disabled'}>${ultima ? 'Enviar respuestas' : 'Siguiente'}</button>
      <p class="aviso">Solo tienes un intento.</p>
      </div>`;

    $('quiz-siguiente').onclick = () => {
      if (ultima) return enviar();
      q.actual++;
      pantallaPregunta(true);
      window.scrollTo(0, 0);
    };
  }

  function enviar() {
    q.enviando = true;
    // Ya terminó: el reloj se detiene mientras el servidor corrige.
    clearInterval(q.intervalo);
    pantallaEnviando();

    servidorInsistente('enviarQuiz', q.intentoId, q.respuestas).then(r => {
      if (r.ok) return pantallaResultado(r);
      if (r.motivo === 'VENCIDO') return pantallaVencido();
      toast(r.mensaje);
      App.ir(q.volver);
    }).catch(() => {
      // Las respuestas siguen en memoria: no se reanuda el reloj ni se vuelve a las preguntas.
      q.enviando = false;
      pantallaNoGuardado();
    });
  }

  /** Si ni los reintentos llegan al servidor, se ofrece volver a enviar desde la misma pantalla. */
  function pantallaNoGuardado() {
    clearInterval(q.intervalo);
    pantalla.innerHTML = `
      ${cabecera()}
      <div class="tarjeta centro">
        <div class="disco-grande">${svg(ICONO.nube, 36)}</div>
        <h2>No pudimos guardar tus respuestas</h2>
        <p class="sec" style="margin-top:8px">Tus respuestas siguen aquí. Vuelve a intentarlo cuando tengas señal.</p>
      </div>
      <button class="btn" data-reintentar>Reintentar</button>`;
    pantalla.querySelector('[data-reintentar]').onclick = enviar;
    window.scrollTo(0, 0);
  }

  /* ---------- Revisando (mientras el servidor corrige) ---------- */
  function pantallaEnviando() {
    pantallaEspera('Revisando tus respuestas', 'Estamos sumando tus puntos.', q.preguntas.length);
  }

  /** Espera animada mientras el servidor responde: un punto por cada pregunta que se enciende. */
  function pantallaEspera(titulo, texto, pasos) {
    pantalla.innerHTML = `
      ${cabecera()}
      <div class="tarjeta centro enviando-quiz" style="--c:${q.color};--t:${q.tinte}" role="status" aria-live="polite">
        <div class="corrigiendo"><span class="anillo-girando"></span><span class="nucleo">${svg(ICONO.check, 34, q.color, 3)}</span></div>
        <h2>${titulo}</h2>
        <p class="sec" style="margin-top:6px">${texto}</p>
        <div class="revision" aria-hidden="true">${Array.from({ length: pasos }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</div>
      </div>`;
    window.scrollTo(0, 0);
  }

  /* ---------- Resultado ---------- */
  function pantallaResultado(r) {
    // El mapa lo usa para mostrar el resultado al instante, sin esperar al servidor.
    App.estado.recien = { unidadId: q.unidad.id, estado: 'COMPLETADO', correctas: r.correctas, total: r.total, puntaje: r.puntaje };
    // App.estado.puntos es el total antes de este quiz; el mapa lo suma al volver.
    const total = (App.estado.puntos || 0) + r.puntaje;
    pantalla.innerHTML = `
      ${cabecera()}
      <div class="tarjeta centro">
        <div class="sello ${r.correctas === r.total ? 'perfecto' : ''}">${svg(r.correctas === r.total ? ICONO.trofeo : ICONO.check, 44, '#fff', 3)}</div>
        <p class="ganado tnum" id="quiz-ganado">+0 puntos</p>
        <p class="sec" style="margin-top:6px">Llevas ${total} puntos en total.</p>
        <div class="datos"><span class="chip">${r.correctas} de ${r.total} correctas</span></div>
      </div>
      <button class="btn" data-ir="${q.volver}">${textoVolver()}</button>
      ${INICIO.vistas.indexOf('RANKING') >= 0 ? '<button class="btn secundario" data-ir="ranking">Ver ranking</button>' : ''}`;
    window.scrollTo(0, 0);
    contarPuntos(r.puntaje);
  }

  /** Los puntos suben desde 0 hasta el total, con desaceleración al final. */
  function contarPuntos(total) {
    const el = $('quiz-ganado');
    const inicio = performance.now();
    const DURACION = 900;
    const paso = t => {
      const k = Math.min(1, (t - inicio) / DURACION);
      el.textContent = '+' + Math.round(total * (1 - Math.pow(1 - k, 3))) + ' puntos';
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }

  function pantallaVencido() {
    clearInterval(q.intervalo);
    App.estado.recien = { unidadId: q.unidad.id, estado: 'VENCIDO', correctas: 0, total: q.unidad.numPreguntas, puntaje: 0 };
    pantalla.innerHTML = `
      ${cabecera()}
      <div class="tarjeta centro">
        <div class="disco-grande">${svg(ICONO.reloj, 36)}</div>
        <h2>Se acabó el tiempo</h2>
        <p class="sec" style="margin-top:8px">No alcanzaste a enviar tus respuestas de ${esc(q.titulo)}, así que este quiz no suma puntos.</p>
        <p class="sec" style="margin-top:8px">Todavía puedes sumar ${q.volver === 'charlas' ? 'en los demás talleres' : 'en los demás pabellones'}.</p>
      </div>
      <button class="btn" data-ir="${q.volver}">${textoVolver()}</button>`;
    window.scrollTo(0, 0);
  }

  pantalla.addEventListener('click', e => {
    const opcion = e.target.closest('[data-letra]');
    if (!opcion || !q || !q.preguntas || q.enviando) return;
    q.respuestas[q.preguntas[q.actual].id] = opcion.dataset.letra;
    pantallaPregunta();
  });

  App.registrar('quiz', { alMostrar: mostrar, alOcultar: ocultar, sinNav: true });
})();
</script>
