<style>
  /* Vista QUIZ: ingreso de código, preguntas, resultado y tiempo agotado. */
  .barra-sup { display: flex; align-items: center; gap: 4px; min-height: 48px; margin-bottom: 12px; }
  .volver { width: 48px; height: 48px; margin-left: -12px; display: grid; place-items: center; border-radius: 50%; flex: none; }
  .volver:active { background: var(--superficie); }
  .donde { min-width: 0; }
  .donde b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .datos { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
  .chip { border: 1px solid var(--borde); border-radius: 8px; padding: 5px 12px; font-size: 13px; color: var(--texto-2); }

  .campo-codigo { margin: 24px 0 8px; }
  #quiz-codigo {
    width: 100%; height: 64px; border-radius: 12px;
    background: var(--fondo); border: 1px solid #80868b; color: var(--texto);
    font: 500 28px/1 "Roboto Mono", ui-monospace, Consolas, monospace;
    text-align: center; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase; outline: none;
  }
  #quiz-codigo:focus { border: 2px solid var(--azul); }
  #quiz-codigo.error { border: 2px solid var(--rojo); animation: tiembla .3s; }
  @keyframes tiembla { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .msg-error { color: var(--rojo); font-size: 13px; min-height: 20px; margin-top: 6px; text-align: left; }

  .quiz-cab { position: sticky; top: 4px; z-index: 2; background: var(--fondo); padding: 4px 0 12px; }
  .quiz-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .reloj {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 99px;
    background: var(--superficie); border: 1px solid var(--borde); font-weight: 500; flex: none;
  }
  .reloj.poco { color: var(--rojo); border-color: var(--rojo); background: var(--rojo-suave); }
  .pasos { display: flex; gap: 6px; margin-top: 12px; }
  .pasos i { flex: 1; height: 4px; border-radius: 2px; background: var(--borde-suave); }
  .pasos i.pasado { background: var(--azul); }
  .pasos i.actual { background: #8ab4f8; }

  .enunciado { font-size: 20px; font-weight: 400; line-height: 1.35; margin: 10px 0 20px; }
  .opcion {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    min-height: 60px; padding: 12px 14px; margin-bottom: 10px;
    border: 1px solid var(--borde); border-radius: 16px; font-size: 15px;
  }
  .opcion .letra {
    width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center;
    border: 1px solid var(--borde); font-weight: 500; font-size: 14px; color: var(--texto-2);
  }
  .opcion.elegida { border-color: var(--azul); background: var(--azul-suave); box-shadow: inset 0 0 0 1px var(--azul); }
  .opcion.elegida .letra { background: var(--azul); border-color: var(--azul); color: #fff; }

  /* Resultado: sello que entra con onda, puntos que suben y filas del detalle que aparecen en cascada */
  .sello {
    position: relative; width: 112px; height: 112px; border-radius: 50%; margin: 8px auto 16px;
    background: var(--verde); display: grid; place-items: center;
    animation: sello-entrar .6s cubic-bezier(.3, 1.5, .5, 1) both;
  }
  .sello::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--verde);
    opacity: 0; animation: quiz-onda .9s ease-out .35s forwards;
  }
  .sello.perfecto { background: #f9ab00; }
  .sello.perfecto::after { border-color: #f9ab00; }
  @keyframes sello-entrar { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
  @keyframes quiz-onda { 0% { transform: scale(.95); opacity: .7; } 100% { transform: scale(1.45); opacity: 0; } }
  .ganado { font-size: 28px; color: var(--azul); animation: quiz-subir .5s ease .2s both; }
  @keyframes quiz-subir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .detalle { margin-top: 20px; border-top: 1px solid var(--borde-suave); text-align: left; }
  .detalle li { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--borde-suave); font-size: 14px; animation: quiz-fila .4s ease both; animation-delay: calc(.8s + var(--i) * .12s); }
  .detalle svg { flex: none; margin-top: 1px; }
  @keyframes quiz-fila { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

  /* Entrada de cada pregunta: la tarjeta sube, el enunciado y las opciones entran en cascada */
  .pregunta-vista.entra > * { animation: quiz-entra .4s ease both; }
  .pregunta-vista.entra .enunciado { animation-delay: .08s; }
  .pregunta-vista.entra .opcion { animation: quiz-opcion .45s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(.16s + var(--i) * .08s); }
  .pregunta-vista.entra #quiz-siguiente { animation-delay: .5s; }
  @keyframes quiz-entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes quiz-opcion { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

  /* Revisando: el aro gira alrededor del núcleo y cada pregunta se enciende en secuencia */
  .enviando-quiz { padding-top: 28px; padding-bottom: 28px; }
  .corrigiendo { position: relative; width: 128px; height: 128px; margin: 8px auto 20px; display: grid; place-items: center; }
  .anillo-girando {
    position: absolute; inset: 0; border-radius: 50%;
    border: 6px solid var(--borde-suave); border-top-color: var(--c); animation: quiz-girar 1s linear infinite;
  }
  .nucleo {
    width: 96px; height: 96px; border-radius: 50%; background: var(--t); display: grid; place-items: center;
    animation: quiz-respirar 1.6s ease-in-out infinite;
  }
  @keyframes quiz-girar { to { transform: rotate(360deg); } }
  @keyframes quiz-respirar { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.04); } }
  .revision { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
  .revision i { width: 12px; height: 12px; border-radius: 50%; background: var(--borde-suave); animation: quiz-encender 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * .2s); }
  @keyframes quiz-encender { 0%, 100% { background: var(--borde-suave); transform: scale(1); } 25% { background: var(--c); transform: scale(1.3); } }
</style>
